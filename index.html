// قراءة: Firebase أولاً ثم localStorage
async function usg(k){
  const lk=_lk(k);
  if(_db&&_activePhone){
    try{
      const snap=await _db.collection("sellers").doc(_activePhone).collection("data").doc(k).get();
      if(snap.exists){const v=snap.data().v;ss(lk,v);return v;}

async function getUsers(){
  if(_db){
    try{
      const snap=await _db.collection("sellers").get();
      const u={};
      snap.forEach(d=>{if(d.data().profile)u[d.id]={...d.data().profile};});
      if(Object.keys(u).length>0){ss("admin:users",u);return u;}
    }catch(e){console.warn("getUsers:",e);}
  }
  return sg("admin:users")||{};
}

function saveUsers(u){
  ss("admin:users",u);
  if(_db){
    Object.entries(u).forEach(([phone,data])=>{
      _db.collection("sellers").doc(phone).set({profile:data,t:Date.now()},{merge:true})
        .catch(e=>console.warn("saveUser:",e));
    });
  }
}

/* ══════════════════════════════════════════
   BARCODE SCANNER
══════════════════════════════════════════ */
function BarcodeScanner({onScan, onClose}){
  const vidRef=useRef(null);
  const canvasRef=useRef(null);
  const streamRef=useRef(null);
  const rafRef=useRef(null);
  const detectorRef=useRef(null);
  const [camErr,setCamErr]=useState(false);
  const [ready,setReady]=useState(false);
  const [status,setStatus]=useState("⏳ جاري التشغيل...");
  const [manual,setManual]=useState("");
  const detectedRef=useRef(false);
  const frameRef=useRef(0);

  useEffect(()=>{
    let alive=true;

    async function init(){
      await loadLibs();
      if(!alive)return;
      try{
        const stream=await navigator.mediaDevices.getUserMedia({
          video:{
            facingMode:{ideal:"environment"},
            width:{ideal:1920},height:{ideal:1080},
            frameRate:{ideal:60,min:30}
          }
        });
        streamRef.current=stream;
        if(!vidRef.current||!alive)return;
        vidRef.current.srcObject=stream;
        vidRef.current.setAttribute("playsinline","true");
        await vidRef.current.play();

        if("BarcodeDetector" in window){
          try{
            detectorRef.current=new window.BarcodeDetector({
              formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","data_matrix","itf"]
            });
            setStatus("✅ جاهز — وجّه على الباركود");
            setReady(true);
            nativeLoop();
            return;
          }catch{}
        }

        setStatus("✅ جاهز — وجّه على الباركود");
        setReady(true);
        manualLoop();
      }catch(e){
        setCamErr(true);
        setStatus("⚠️ تعذّر الكاميرا");
      }
    }

    async function nativeLoop(){
      if(!alive||detectedRef.current)return;
      const v=vidRef.current;
      if(!v||v.readyState<2){rafRef.current=requestAnimationFrame(nativeLoop);return;}
      try{
        const results=await detectorRef.current.detect(v);
        if(results?.length>0&&results[0].rawValue){
          found(results[0].rawValue);
          return;
        }
      }catch{}
      rafRef.current=requestAnimationFrame(nativeLoop);
    }

    function manualLoop(){
      if(!alive||detectedRef.current)return;
      const v=vidRef.current,cv=canvasRef.current;
      if(!v||!cv||v.readyState<2){rafRef.current=requestAnimationFrame(manualLoop);return;}
      frameRef.current++;

      const W=v.videoWidth,H=v.videoHeight;
      if(!W||!H){rafRef.current=requestAnimationFrame(manualLoop);return;}

      const ctx=cv.getContext("2d",{willReadFrequently:true,alpha:false});
      const scales=frameRef.current%3===0?[1,1.7,2.8]:[1,2];
      for(let sc of scales){
        if(detectedRef.current)break;
        const sw=Math.floor(W/sc),sh=Math.floor(H/sc);
        const sx=Math.floor((W-sw)/2),sy=Math.floor((H-sh)/2);
        cv.width=960;cv.height=Math.floor(960*sh/sw);
        ctx.filter="contrast(1.8) brightness(1.1) saturate(0)";
        ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
        ctx.filter="none";
        const imgData=ctx.getImageData(0,0,cv.width,cv.height);

        if(window.jsQR){
          try{
            const r=window.jsQR(imgData.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"});
            if(r?.data?.length>1){found(r.data);return;}
          }catch{}
        }

        if(window.Quagga?.decodeSingle){
          try{
            window.Quagga.decodeSingle({
              src:cv.toDataURL("image/jpeg",0.95),
              numOfWorkers:0,locate:true,
              inputStream:{size:cv.width},
              decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader","i2of5_reader"]},
            },res=>{
              if(res?.codeResult?.code&&!detectedRef.current)found(res.codeResult.code);
            });
          }catch{}
        }
      }
      rafRef.current=requestAnimationFrame(manualLoop);
    }

    function found(code){
      if(detectedRef.current||!code||code.length<3)return;
      detectedRef.current=true;
      stop();
      if(navigator.vibrate)navigator.vibrate([80,40,80]);
      onScan(code);
    }

    function stop(){
      alive=false;
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
    }

    init();
    return stop;
  },[onScan]);

  async function loadLibs(){
    return new Promise(resolve=>{
      let n=0,done=0;
      const libs=[];
      if(!window.jsQR)libs.push("https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js");
      if(!window.Quagga)libs.push("https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js");
      if(libs.length===0){resolve();return;}
      n=libs.length;
      libs.forEach(src=>{
        const s=document.createElement("script");
        s.src=src;
        s.onload=s.onerror=()=>{done++;if(done>=n)resolve();};
        document.head.appendChild(s);
      });
    });
  }

  const captureNow=()=>{
    const v=vidRef.current,cv=canvasRef.current;
    if(!v||!cv||detectedRef.current)return;
    setStatus("📸 جاري المسح...");
    const W=v.videoWidth,H=v.videoHeight;
    const attempts=[
      {sx:0,sy:0,sw:W,sh:H,size:1280},
      {sx:W*0.1,sy:H*0.1,sw:W*0.8,sh:H*0.8,size:960},
      {sx:W*0.2,sy:H*0.2,sw:W*0.6,sh:H*0.6,size:800},
    ];
    let found=false;
    let done=0;
    attempts.forEach(({sx,sy,sw,sh,size})=>{
      if(found)return;
      cv.width=size;cv.height=Math.floor(size*sh/sw);
      const ctx=cv.getContext("2d",{willReadFrequently:true});
      ctx.filter="contrast(2.0) brightness(1.2) saturate(0)";
      ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
      ctx.filter="none";
      if(window.Quagga?.decodeSingle){
        window.Quagga.decodeSingle({
          src:cv.toDataURL("image/jpeg",1.0),
          numOfWorkers:0,locate:true,
          inputStream:{size:cv.width},
          decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader","i2of5_reader"]},
        },res=>{
          done++;
          if(res?.codeResult?.code&&!detectedRef.current&&!found){
            found=true;
            detectedRef.current=true;
            if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
            if(rafRef.current)cancelAnimationFrame(rafRef.current);
            if(navigator.vibrate)navigator.vibrate([80,40,80]);
            onScan(res.codeResult.code);
          } else if(done>=attempts.length&&!found){
            setStatus("⚠️ لم يُقرأ — قرّب الباركود وحاول");
          }
        });
      }
    });
  };

  const close=()=>{
    try{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());}catch{}
    try{if(rafRef.current)cancelAnimationFrame(rafRef.current);}catch{}
    onClose();
  };

        </div>

        {!camErr&&(
          <div style={{position:"relative",background:"#000",borderRadius:14,overflow:"hidden",border:"2px solid rgba(35,134,54,0.6)",width:"100%",height:270}}>

function LoginView({onLogin}){
  const [phone,setPhone]=useState("");

  const [step,setStep]=useState("phone");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [shk,setShk]=useState(false);
  const [showAdmin,setShowAdmin]=useState(false);

  const handlePhoneNext=()=>{
    if(phone.trim().length>=9){setStep("pin");setErr("");}
    else{setErr("يرجى إدخال رقم هاتف صحيح");}
  };

  const pressNum=num=>{
    if(pin.length<4){
      const np=pin+num;
      setPin(np);
      if(np.length===4)verify(np);
    }
  };

  const backspace=()=>{setPin(pin.slice(0,-1));setErr("");};

  const verify=async(currentPin)=>{
    setLoading(true);setErr("");
    const users=await getUsers();
    const u=users[phone.trim()];
    if(u&&u.pin===currentPin){
      const days=daysUntil(u.subExpiry);
      if(!u.subscribed||days<=0){
        setErr("⚠️ اشتراكك منتهي. اتصل بالمشرف");
        setPin("");setShk(true);setTimeout(()=>setShk(false),400);
        setLoading(false);
        return;
      }
      onLogin({phone:phone.trim(),...u});
    }else{
      setErr("رمز PIN خاطئ، حاول مجدداً");
      setPin("");setShk(true);setTimeout(()=>setShk(false),400);
    }
    setLoading(false);
  };

  return(
    <div className="lw">
      <div className={"lcard "+(shk?"shk":"")}>
        <div style={{textAlign:"center",marginBottom:24}} onDoubleClick={()=>setShowAdmin(true)}>
          <span style={{fontSize:44}}>🏪</span>

        {step==="phone"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <label className="lbl">رقم الهاتف النشط للتجّار</label>
            <input className="inp" type="tel" placeholder="09XXXXXXXX" value={phone} onChange={e=>setPhone(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handlePhoneNext()} style={{textAlign:"center",fontSize:18,letterSpacing:1}}/>
          </div>
          {err&&<p style={{color:C.red,fontSize:11,textAlign:"center"}}>{err}</p>}
          <button className="btn btn-p" onClick={handlePhoneNext}>المتابعة ↩</button>
        </div>}

        {step==="pin"&&<div>
          <p style={{textAlign:"center",color:C.muted,fontSize:12,marginBottom:4}}>{phone}</p>
          <p style={{textAlign:"center",color:"#fff",fontSize:14,fontWeight:600,marginBottom:12}}>أدخل رمز PIN المتكون من 4 أرقام</p>
          
          <div className="pdots">
            {[1,2,3,4].map(i=><div key={i} className={"pd "+(pin.length>=i?"on":"")}/>)}
          </div>

          {err&&<p style={{color:C.red,fontSize:11,textAlign:"center",marginBottom:12}}>{err}</p>}

          <div className="numpad">
            {[1,2,3,4,5,6,7,8,9].map(n=><button key={n} className="nk" onClick={()=>pressNum(n.toString())}>{n}</button>)}
            <button className="nk" onClick={()=>setStep("phone")} style={{fontSize:13,color:C.muted}}>تغيير الرقم</button>
            <button className="nk" onClick={()=>pressNum("0")}>0</button>
            <button className="nk" onClick={backspace} style={{color:C.red}}>⌫</button>
          </div>
        </div>}

        <p style={{textAlign:"center",color:C.dim,fontSize:10,marginTop:24}}>تطبيق تجاري محمي • 2026</p>
      </div>
      {showAdmin&&<AdminPanel onClose={()=>setShowAdmin(false)}/>}

  );
}

function MainDashboard({user, onLogout}){
  const [tab,setTab]=useState("pos"); 
  const [prods,setProds]=useState({});
  const [cart,setCart]=useState([]);
  const [invs,setInvs]=useState([]);
  const [sets,setSets]=useState(INIT_SETS);
  const [scanner,setScanner]=useState(false);
  const [pForm,setPForm]=useState({code:"",name:"",price:"",cost:"",stock:"",expiry:""});
  const [pMsg,setPMsg]=useState("");
  const [curReceipt,setCurReceipt]=useState(null);

  useEffect(()=>{
    (async()=>{
      injectCSS();
      const p=await usg("prods");if(p)setProds(p);
      const i=await usg("invs");if(i)setInvs(i);
      const s=await usg("sets");if(s)setSets(s);
    })();
  },[]);

  const saveProds=d=>{setProds(d);uss("prods",d);};
  const saveInvs=d=>{setInvs(d);uss("invs",d);};
  const saveSets=d=>{setSets(d);uss("sets",d);};

  /* ══ منطق البيع والـ POS ══ */
  const handleScan=useCallback(code=>{
    setScanner(false);
    if(!prods[code]){
      setPForm({code,name:"",price:"",cost:"",stock:"",expiry:""});
      setTab("inventory");
      setPMsg("📋 الباركود غير مسجل، أدخل بيانات الصنف الجديد هنا");
      return;
    }
    const p=prods[code];
    if(p.stock<=0){alert("⚠️ عذراً، هذا المنتج منتهي من المخزون!");return;}
    setCart(prev=>{
      const ex=prev.find(i=>i.code===code);
      if(ex){
        const newQty=Math.min(p.stock,ex.qty+1);
        return prev.map(i=>i.code===code?{...i,qty:newQty}:i);
      }
      return [...prev,{code,name:p.name,price:p.price,qty:1}];
    });
  },[prods]);

  const changeCartQty=(code,q)=>{
    if(q<=0){setCart(cart.filter(i=>i.code!==code));return;}
    const maxS=prods[code]?.stock||999;
    setCart(cart.map(i=>i.code===code?{...i,qty:Math.min(maxS,q)}:i));
  };

  const checkout=()=>{
    if(!cart.length)return;
    const total=cart.reduce((s,i)=>s+(i.price*i.qty),0);
    const newInv={id:newId(),ts:Date.now(),items:[...cart],total};
    const upP={...prods};
    cart.forEach(i=>{if(upP[i.code])upP[i.code].stock=Math.max(0,upP[i.code].stock-i.qty);});
    saveProds(upP);
    saveInvs([newInv,...invs]);
    setCart([]);
    setCurReceipt(newInv);
  };

  /* ══ منطق المخزون ══ */
  const saveProductSubmit=e=>{
    e.preventDefault();
    if(!pForm.code.trim()||!pForm.name.trim()||!pForm.price)return;
    const up={...prods,[pForm.code.trim()]:{
      name:pForm.name.trim(),
      price:parseFloat(pForm.price)||0,
      cost:parseFloat(pForm.cost)||0,
      stock:parseInt(pForm.stock)||0,
      expiry:pForm.expiry||""
    }};
    saveProds(up);
    setPForm({code:"",name:"",price:"",cost:"",stock:"",expiry:""});
    setPMsg("✅ تم حفظ وتأمين المنتج بالمخزون سحابياً");
    setTimeout(()=>setPMsg(""),2500);
  };

  const delProduct=code=>{
    if(confirm("هل تريد حذف هذا الصنف نهائياً من المخزون؟")){
      const up={...prods};delete up[code];saveProds(up);
    }
  };

  /* ══ الإشعارات والتحذيرات ══ */
  const getNotifs=()=>{
    const n=[];
    Object.entries(prods).forEach(([code,p])=>{
      if(p.stock<=sets.lowStock)n.push({type:"stock",msg:`نفاد قريب: صنف [${p.name}] الكمية المتبقية ${p.stock} فقط`});
      if(p.expiry){
        const du=daysUntil(p.expiry);
        if(du<=sets.expiryDays)n.push({type:"exp",msg:`صلاحية: صنف [${p.name}] ينتهي خلال ${du} يوم (${fmtDate(p.expiry)})`});
      }
    });
    return n;
  };
  const notifs=getNotifs();

  /* ══ الإحصائيات والأرباح ══ */
  const stats=()=>{
    let sales=0,profit=0,itemsCount=0;
    invs.forEach(inv=>{
      sales+=inv.total;
      inv.items.forEach(i=>{
        itemsCount+=i.qty;
        const p=prods[i.code];
        if(p)profit+=(i.price-p.cost)*i.qty;
      });
    });
    return {sales,profit,itemsCount};
  };
  const st=stats();

  return(
    <div className="app">
      {/* شريط الأدوات العلوي */}
      <div className="tb">
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div className="tb-ico">🏪</div>
          <div>
            <h1 style={{fontSize:15,fontWeight:900,lineHeight:1.2}}>{user.name}</h1>
            <p style={{fontSize:10,color:C.muted}}>منظومة بيّاع • لوحة المتجر</p>
          </div>
        </div>
        <div className="tb-nav">
          <button className={"nb "+(tab==="pos"?"on":"")} onClick={()=>setTab("pos")} title="نقطة البيع">🛒</button>
          <button className={"nb "+(tab==="inventory"?"on":"")} onClick={()=>setTab("inventory")} title="المخزون">📦</button>
          <button className={"nb "+(tab==="invoices"?"on":"")} onClick={()=>setTab("invoices")} title="الفواتير">📑</button>
          <button className={"nb "+(tab==="reports"?"on":"")} onClick={()=>setTab("reports")} title="التقارير">📊</button>
          <button className={"nb "+(tab==="settings"?"on":"")} onClick={()=>setTab("settings")} title="الإعدادات">⚙️
            {notifs.length>0&&<span className="nb-bd">{notifs.length}</span>}
          </button>
          <button className="nb nb-out" onClick={onLogout}>خروج</button>
        </div>
      </div>

      <div className="sc">
        {/* 1. واجهة نقطة البيع الـ POS */}
        {tab==="pos"&&<div>
          <button className="btn btn-p" onClick={()=>setScanner(true)} style={{marginBottom:14,fontSize:15,padding:13}}>📷 مسح باركود صنف جديد</button>
          
          <div style={{marginBottom:12}}><p style={{fontSize:13,fontWeight:700,color:C.muted}}>سلة المبيعات الحالية ({cart.length})</p></div>
          
          {cart.length===0&&(
            <div className="card emp" onClick={()=>setScanner(true)} style={{cursor:"pointer"}}>
              <div className="emp-i" style={{fontSize:44,textAlign:"center",marginBottom:6}}>🛒</div>
              <p style={{color:C.muted,fontSize:13,textAlign:"center"}}>السلة فارغة. اضغط ومسح الباركود للبيع فوراً</p>
            </div>
          )}

          {cart.map(i=>(
            <div key={i.code} className="prow" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <p style={{fontWeight:700,fontSize:14}}>{i.name}</p>
                <p style={{fontSize:11,color:C.muted}}>{i.price.toFixed(2)} د.ل لِلقطعة</p>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <div className="qc">
                  <button className="qb" onClick={()=>changeCartQty(i.code,i.qty-1)}>—</button>
                  <span className="qn">{i.qty}</span>
                  <button className="qb" onClick={()=>changeCartQty(i.code,i.qty+1)}>+</button>
                </div>
                <div style={{minWidth:65,textAlign:"left",fontWeight:700,fontSize:14,color:C.green}}>{(i.price*i.qty).toFixed(2)} د.ل</div>
              </div>
            </div>
          ))}

          {cart.length>0&&<div className="card" style={{marginTop:14,background:C.surf,borderColor:C.border}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
              <span style={{fontSize:14,color:C.muted,fontWeight:600}}>المجموع الكلي:</span>
              <span style={{fontSize:20,fontWeight:900,color:C.green}}>{cart.reduce((s,i)=>s+(i.price*i.qty),0).toFixed(2)} د.ل</span>
            </div>
            <button className="btn btn-p" onClick={checkout} style={{fontSize:16,padding:13}}>💳 إتمام البيع واستخراج الفاتورة</button>
          </div>}
        </div>}

        {/* 2. واجهة إدارة المخزون المنتجات */}
        {tab==="inventory"&&<div>
          <form className="card" onSubmit={saveProductSubmit} style={{marginBottom:16,display:"flex",flexDirection:"column",gap:10}}>
            <p style={{fontSize:13,fontWeight:700,color:C.green}}>📋 إضافة / تعديل منتج في المستودع</p>
            <div style={{display:"flex",gap:6}}>
              <input className="inp" placeholder="الباركود المكتوب على السلعة" value={pForm.code} onChange={e=>setPForm({...pForm,code:e.target.value})} style={{flex:1}}/>
              <button type="button" className="btn btn-s btn-sm" onClick={()=>setScanner(true)}>📸 مسح</button>
            </div>
            <input className="inp" placeholder="اسم المنتج التجاري" value={pForm.name} onChange={e=>setPForm({...pForm,name:e.target.value})}/>
            <div style={{display:"flex",gap:8}}>
              <div><label className="lbl">سعر البيع (د.ل)</label><input className="inp" type="number" step="0.01" placeholder="0.00" value={pForm.price} onChange={e=>setPForm({...pForm,price:e.target.value})}/></div>
              <div><label className="lbl">سعر التكلفة (د.ل)</label><input className="inp" type="number" step="0.01" placeholder="0.00" value={pForm.cost} onChange={e=>setPForm({...pForm,cost:e.target.value})}/></div>
              <div><label className="lbl">الكمية الحالية</label><input className="inp" type="number" placeholder="0" value={pForm.stock} onChange={e=>setPForm({...pForm,stock:e.target.value})}/></div>
            </div>
            <div>
              <label className="lbl">تاريخ انتهاء الصلاحية (إن وجد)</label>
              <input className="inp" type="date" value={pForm.expiry} onChange={e=>setPForm({...pForm,expiry:e.target.value})} style={{colorScheme:"dark"}}/>
            </div>
            <button type="submit" className="btn btn-p">🔒 حفظ المنتج وتأمينه</button>
            {pMsg&&<p style={{textAlign:"center",fontSize:12,color:C.green}}>{pMsg}</p>}
          </form>

          <div style={{marginBottom:10}}><p style={{fontSize:13,fontWeight:700,color:C.muted}}>قائمة السلع المتوفرة حالياً ({Object.keys(prods).length})</p></div>
          
          {Object.keys(prods).length===0&&<div className="card emp"><p style={{color:C.muted,fontSize:12}}>لم تقم بإضافة أي بضاعة بعد للمخزون</p></div>}
          
          {Object.entries(prods).map(([code,p])=>{
            const isLow=p.stock<=sets.lowStock;
            const isExp=p.expiry&&daysUntil(p.expiry)<=sets.expiryDays;
            return(
              <div key={code} className="prow" style={{borderColor:(isLow||isExp)?(isExp?C.redBr:C.orange):C.border}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
                  <div>
                    <h4 style={{fontWeight:700,fontSize:14,color:"#fff"}}>{p.name}</h4>
                    <p style={{fontSize:11,color:C.muted}}>كود: {code} • تكلفة: {p.cost.toFixed(2)} د.ل</p>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <span style={{fontSize:15,fontWeight:700,color:C.green}}>{p.price.toFixed(2)} د.ل</span>
                    <p style={{fontSize:12,fontWeight:700,color:isLow?C.orange:"#fff",marginTop:2}}>المخزون: {p.stock} قطة</p>
                  </div>
                </div>
                {p.expiry&&<p style={{fontSize:10,color:isExp?C.red:C.muted,marginTop:4,fontWeight:600}}>⌛ الصلاحية: {fmtDate(p.expiry)}</p>}
                <div style={{display:"flex",gap:6,marginTop:8,justifyContent:"flex-end"}}>
                  <button className="btn btn-s btn-sm" onClick={()=>setPForm({code,...p})}>📝 تعديل</button>
                  <button className="btn btn-d btn-sm" onClick={()=>delProduct(code)}>🗑️ حذف</button>
                </div>
              </div>
            );
          })}
        </div>}

        {/* 3. واجهة أرشيف فواتير المبيعات */}
        {tab==="invoices"&&<div>
          <div style={{marginBottom:10}}><p style={{fontSize:13,fontWeight:700,color:C.muted}}>سجل فواتير المبيعات الصادرة ({invs.length})</p></div>
          {invs.length===0&&<div className="card emp"><p style={{color:C.muted,fontSize:12}}>لا توجد فواتير صادرة بعد</p></div>}
          {invs.map(inv=>(
            <div key={inv.id} className="inv-card" onClick={()=>setCurReceipt(inv)}>
              <div className="inv-head">
                <div>
                  <p style={{fontWeight:700,fontSize:13,color:"#fff"}}>{inv.id}</p>
                  <p style={{fontSize:10,color:C.muted}}>{fmtTime(inv.ts)}</p>
                </div>
                <p style={{fontWeight:900,fontSize:15,color:C.green}}>{inv.total.toFixed(2)} د.ل</p>
              </div>
              <div className="inv-body">
                <p style={{fontSize:11,color:C.muted,marginTop:6}}>العناصر: {inv.items.map(i=>`${i.name}(×${i.qty})`).join("، ")}</p>
              </div>
            </div>
          ))}
        </div>}

        {/* 4. التقارير المالية والأرباح */}
        {tab==="reports"&&<div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div className="card card-g" style={{textAlign:"center"}}>
            <p style={{fontSize:12,color:C.muted,fontWeight:600}}>إجمالي المبيعات الصافية</p>
            <h2 style={{fontSize:28,fontWeight:900,color:C.green,marginTop:2}}>{st.sales.toFixed(2)} د.ل</h2>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div className="card card-o" style={{textAlign:"center"}}>
              <p style={{fontSize:11,color:C.muted,fontWeight:600}}>الأرباح المحققة</p>
              <h3 style={{fontSize:18,fontWeight:900,color:C.orange,marginTop:2}}>{st.profit.toFixed(2)} د.ل</h3>
            </div>
            <div className="card" style={{textAlign:"center",background:C.surf}}>
              <p style={{fontSize:11,color:C.muted,fontWeight:600}}>القطع المباعة</p>
              <h3 style={{fontSize:18,fontWeight:900,color:"#fff",marginTop:2}}>{st.itemsCount} قطعة</h3>
            </div>
          </div>
        </div>}

        {/* 5. لوحة التحكم والإشعارات */}
        {tab==="settings"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <div className="card">
            <p style={{fontSize:13,fontWeight:700,color:"#fff",marginBottom:10}}>🔔 تحذيرات المنظومة الذكية</p>
            {notifs.length===0&&<p style={{color:C.muted,fontSize:11,textAlign:"center"}}>لا توجد أي تحذيرات حالية، كل شيء سليم</p>}
            {notifs.map((n,i)=>(
              <div key={i} className="ni" style={{background:n.type==="stock"?C.orange+"1a":C.redBg}}>
                <div className="ni-ico" style={{background:n.type==="stock"?C.orange:C.red,color:"#fff"}}>{n.type==="stock"?"📦":"⌛"}</div>
                <p style={{fontSize:12,color:"#fff",lineHeight:1.4}}>{n.msg}</p>
              </div>
            ))}
          </div>

          <div className="card" style={{display:"flex",flexDirection:"column",gap:6}}>
            <p style={{fontSize:13,fontWeight:700,color:C.green,marginBottom:4}}>⚙️ عتبات التنبيه التلقائي</p>
            <div className="sr">
              <div>
                <p className="sl">حد النقص في المخزون</p>
                <p className="ss2">ينبهك عندما تقل كمية السلعة عن هذا العدد</p>
              </div>
              <input className="ni2" type="number" value={sets.lowStock} onChange={e=>saveSets({...sets,lowStock:parseInt(e.target.value)||0})}/>
            </div>
            <div className="sr">
              <div>
                <p className="sl">مراقبة الصلاحية (أيام)</p>
                <p className="ss2">ينبهك قبل انتهاء تاريخ الصلاحية بهذه المدة</p>
              </div>
              <input className="ni2" type="number" value={sets.expiryDays} onChange={e=>saveSets({...sets,expiryDays:parseInt(e.target.value)||0})}/>
            </div>
          </div>
        </div>}
      </div>

      {/* مودال قراءة الباركود بالكاميرا */}
      {scanner&&<BarcodeScanner onScan={handleScan} onClose={()=>setScanner(false)}/>}
      
      {/* مودال استعراض وطباعة الفاتورة */}
      {curReceipt&&<ReceiptModal inv={curReceipt} sellerName={user.name} onClose={()=>setCurReceipt(null)}/>}
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APPLICATION APP
══════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);

  useEffect(()=>{
    const cached=sg("session:user");
    if(cached){
      setActivePhone(cached.phone);
      setUser(cached);
    }
  },[]);

  const login=u=>{
    setActivePhone(u.phone);
    setUser(u);
    ss("session:user",u);
  };

  const logout=()=>{
    setUser(null);
    setActivePhone("");
    localStorage.removeItem("session:user");
  };

  return (
    <div style={{minHeight:"100vh"}}>
      {!user ? <LoginView onLogin={login}/> : <MainDashboard user={user} onLogout={logout}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if("serviceWorker" in navigator){
  const sw=`
const V="bayyaa-v3";
const CACHE=[\n  "./",\n  "https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap",\n  "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js",\n  "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js",\n  "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js",\n  "https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.20.0/index.min.js",\n  "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"\n];
self.addEventListener("install",e=>{\n  e.waitUntil(caches.open(V).then(c=>c.addAll(CACHE).catch(()=>{})));\n  self.skipWaiting();\n});
self.addEventListener("activate",e=>{\n  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==V).map(k=>caches.delete(k)))));\n  self.clients.claim();\n});
self.addEventListener("fetch",e=>{\n  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));\n});`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
