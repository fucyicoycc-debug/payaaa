const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// تجزئة SHA-256 (تُستخدم لعدم تخزين أرقام PIN كنص صريح)
async function sha256Hex(str){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

let _db=null;
let _dbReady=false;
(function(){
  let t=0;
  function tryLoad(){
    t++;
    if(t>30)return;
    if(window.firebase&&window.firebase.firestore){
      if(!_db){
        try{
          if(!window.firebase.apps.length)window.firebase.initializeApp(FBCFG);
          _db=window.firebase.firestore();
          // تفعيل التخزين المحلي الدائم لـ Firestore (IndexedDB):
          // - يجعل التطبيق يعمل بدون إنترنت فعليًا (قراءة وكتابة من الكاش المحلي)
          // - يحفظ أي عملية بيع/تعديل تمت أثناء انقطاع النت في طابور دائم
          //   (لا يُفقد حتى لو أُغلق المتصفح أو أُعيد تشغيل الجهاز)
          // - يُرسله تلقائيًا للسيرفر فور عودة الإنترنت (مبني داخل Firestore نفسه)
          _db.enablePersistence({synchronizeTabs:true}).then(()=>{
            _dbReady=true;
            console.log("Firebase persistence ON");
          }).catch(e=>{
            _dbReady=true; // نكمل حتى لو فشل التفعيل (تبويب آخر مفتوح مثلاً)
            console.warn("FB persistence:",e&&e.code);
          });
          console.log("Firebase OK");
        }catch(e){console.warn("FB init:",e);}
      }
      return;
    }
    setTimeout(tryLoad,300);
  }
  const s1=document.createElement("script");
  s1.src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js";
  s1.onload=()=>{
    const s2=document.createElement("script");
    s2.src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js";
    s2.onload=()=>tryLoad();
    document.head.appendChild(s2);
  };
  document.head.appendChild(s1);
})();

/* ══ Storage معزول — مفتاح خاص بكل بائع ══ */
let _activePhone="";
const setActivePhone=p=>{_activePhone=p;};
// مفتاح التخزين: دائماً يتضمن رقم هاتف البائع
const _lk=(k,ph)=>{const p=ph||_activePhone;return p?("U|"+p+"|"+k):k;};

// قراءة من localStorage (سريع وفوري)
function usgLocal(k,ph){return sg(_lk(k,ph));}

// كتابة: localStorage فوري + Firebase في الخلفية
function uss(k,v,ph){
  const p=ph||_activePhone;
  if(!p){console.warn("uss: no phone!");return;}
  ss(_lk(k,p),v);
  if(_db){
    _db.collection("sellers").doc(p).collection("data").doc(k)
      .set({v,t:Date.now()}).catch(e=>console.warn("uss err:",e));
  }
}

// قراءة async (localStorage أولاً، ثم Firebase إذا فارغ)
async function usg(k,ph){
  const p=ph||_activePhone;
  if(!p)return null;
  const local=sg(_lk(k,p));
  if(local!==null)return local;
  if(_db){
    try{
      const snap=await _db.collection("sellers").doc(p).collection("data").doc(k).get();
      if(snap.exists){const v=snap.data().v;ss(_lk(k,p),v);return v;}
    }catch{}
  }
  return null;
}

/* ══ إدارة البائعين (تم دمجها وإصلاح التعارض) ══ */
async function getUsers(){
  if(_db){
    try{
      const snap=await _db.collection("sellers").get();
      const u={};
      snap.forEach(d=>{if(d.data().profile)u[d.id]={...d.data().profile};});
      if(Object.keys(u).length>0){ss("admin:users",u);return u;}
    }catch(e){console.warn("getUsers:",e);}
  }
  return sg("admin:users")||{};
}

function saveUsers(u){
  ss("admin:users",u);
  if(_db){

/* ══════════════════════════════════════════
   BARCODE SCANNER
══════════════════════════════════════════ */
function BarcodeScanner({onScan,onClose,continuous=false,lastAdded=null,noFind=false}){
  const vidRef=useRef(null);
  const streamRef=useRef(null);
  const scanLineRef=useRef(null);
  const frameRef=useRef(null);
  const frameHRef=useRef(300);
  const rafRef=useRef(null);
  const lineRafRef=useRef(null);
  const detectorRef=useRef(null);
  const lastScanTime=useRef(0);
  const linePos=useRef(5);
  const lineDir=useRef(1);
  const aliveRef=useRef(true);
  const [camErr,setCamErr]=useState(false);
  const [ready,setReady]=useState(false);
  const [torchOn,setTorchOn]=useState(false);
  const [manual,setManual]=useState("");
  const torchRef=useRef(false); // يحفظ الحالة حتى لو أعاد React تصيير المكوّن

  const toggleTorch=useCallback(async()=>{
    try{
      const track=streamRef.current?.getVideoTracks()[0];
      if(!track)return;
      const caps=track.getCapabilities?.();
      if(!caps?.torch)return;
      const newVal=!torchRef.current;
      await track.applyConstraints({advanced:[{torch:newVal}]});
      torchRef.current=newVal;
      setTorchOn(newVal);
    }catch{}
  },[]);

  // نخزن onScan في ref حتى لا تعيد تشغيل الكاميرا عند تغيّر الدالة (مهم لاستقرار الفلاش)
  const onScanRef=useRef(onScan);
  onScanRef.current=onScan;

  useEffect(()=>{
    aliveRef.current=true;

    // ── خط مسح سلس: يقيس سرعة شاشة الجهاز فعليًا ثم يكيّف حركته عليها ──
    // 1) يقيس معدل تحديث الشاشة الحقيقي (Hz) في أول نصف ثانية من التشغيل
    // 2) يستخدم متوسط متحرك (EMA) لزمن كل فريم بدل الاعتماد على فريم واحد فقط،
    //    فتصبح الحركة موحّدة حتى لو تذبذب توقيت الفريمات لحظيًا
    // 3) يحرّك الخط بالنسبة للزمن الفعلي (delta-time) لا لعدد الفريمات، فتتكيف
    //    السرعة تلقائيًا مع أي جهاز (60/90/120/144Hz) بدون أي كود خاص بكل جهاز
    const measureFrame=()=>{if(frameRef.current)frameHRef.current=frameRef.current.clientHeight||300;};
    measureFrame();
    window.addEventListener("resize",measureFrame);

    const SPEED=72; // % من ارتفاع الإطار في الثانية (سرعة الحركة المرجعية)
    let lastTs=null;
    let smoothDt=16.7; // تقدير أولي (سيُصحَّح تلقائيًا فور بدء القياس)
    let calibFrames=0;
    let calibSum=0;
    let detectedHz=60;
    function animateLine(ts){
      if(!aliveRef.current)return;
      if(lastTs===null)lastTs=ts;
      let dt=ts-lastTs;
      lastTs=ts;
      // تفادي قفزات كبيرة لو تجمّد التاب لحظيًا (تبديل تطبيقات مثلاً)
      if(dt>100)dt=smoothDt||16.7;

      // معايرة معدل تحديث الشاشة الحقيقي خلال أول ~24 فريم فقط
      if(calibFrames<24 && dt>0 && dt<60){
        calibSum+=dt; calibFrames++;
        if(calibFrames===24){
          const avg=calibSum/calibFrames;
          detectedHz=Math.round(1000/avg);
          smoothDt=avg;
        }
      }
      // متوسط متحرك أسّي لتنعيم أي تذبذب في توقيت الفريمات (يمنع "التقطيع")
      smoothDt=smoothDt*0.85+dt*0.15;

      if(scanLineRef.current){
        linePos.current+=lineDir.current*SPEED*(smoothDt/1000);
        if(linePos.current>=90){linePos.current=90;lineDir.current=-1;}
        if(linePos.current<=5){linePos.current=5;lineDir.current=1;}
        const px=(linePos.current/100)*frameHRef.current;
        scanLineRef.current.style.transform=`translateY(${px}px) translateZ(0)`;
      }
      lineRafRef.current=requestAnimationFrame(animateLine);
    }
    lineRafRef.current=requestAnimationFrame(animateLine);

    // ── تشغيل الكاميرا ──
    async function startCamera(){
      const tries=[
        {facingMode:{exact:"environment"},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60}},
        {facingMode:{exact:"environment"},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},
        {facingMode:"environment"},
        true
      ];
      let stream=null;
      for(const c of tries){
        try{stream=await navigator.mediaDevices.getUserMedia({video:c});break;}catch{}
      }
      if(!stream||!aliveRef.current){setCamErr(true);return;}
      streamRef.current=stream;
      const v=vidRef.current;
      if(!v)return;
      v.srcObject=stream;
      v.setAttribute("playsinline","true");
      v.muted=true;
      await v.play();
      setReady(true);
      // أعد تطبيق الفلاش إذا كان مفعّلاً قبل إعادة التصيير
      if(torchRef.current){
        try{
          const track=stream.getVideoTracks()[0];
          const caps=track.getCapabilities?.();
          if(caps?.torch)await track.applyConstraints({advanced:[{torch:true}]});
        }catch{}
      }

      // ── BarcodeDetector (أسرع وأدق) ──
      if("BarcodeDetector" in window){
        try{
          detectorRef.current=new BarcodeDetector({
            formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","data_matrix","codabar","itf"]
          });
          nativeLoop();
          return;
        }catch{}
      }
      // fallback إذا لم يدعم BarcodeDetector
      await loadLibs();
      fallbackLoop();
    }

    // ── BarcodeDetector Loop - بدون انتظار ──
    function nativeLoop(){
      if(!aliveRef.current)return;
      const v=vidRef.current;
      if(!v||v.readyState<2){rafRef.current=requestAnimationFrame(nativeLoop);return;}
      const now=Date.now();
      if(now-lastScanTime.current<500){rafRef.current=requestAnimationFrame(nativeLoop);return;}
      // detect بدون await لعدم حجب RAF
      detectorRef.current.detect(v).then(res=>{
        if(res?.length>0&&res[0].rawValue){
          emit(res[0].rawValue);
        }
      }).catch(()=>{});
      rafRef.current=requestAnimationFrame(nativeLoop);
    }

    // ── Fallback Loop (jsQR فقط - Quagga محذوف) ──
    function fallbackLoop(){
      if(!aliveRef.current)return;
      const v=vidRef.current;
      if(!v||v.readyState<2){rafRef.current=requestAnimationFrame(fallbackLoop);return;}
      const now=Date.now();
      if(now-lastScanTime.current<500){rafRef.current=requestAnimationFrame(fallbackLoop);return;}
      try{
        const cv=document.createElement("canvas");
        cv.width=640;cv.height=360;
        const ctx=cv.getContext("2d",{willReadFrequently:true,alpha:false});
        ctx.drawImage(v,0,0,640,360);
        if(window.jsQR){
          const img=ctx.getImageData(0,0,640,360);
          const r=window.jsQR(img.data,640,360,{inversionAttempts:"dontInvert"});
          if(r?.data)emit(r.data);
        }
      }catch{}
      rafRef.current=requestAnimationFrame(fallbackLoop);
    }

    async function loadLibs(){
      return new Promise(res=>{
        if(window.jsQR){res();return;}
        const s=document.createElement("script");
        s.src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js";
        s.onload=s.onerror=res;
        document.head.appendChild(s);
      });
    }

    function emit(code){
      if(!code||code.length<3||!aliveRef.current)return;
      const now=Date.now();
      if(now-lastScanTime.current<500)return;
      lastScanTime.current=now;
      if(navigator.vibrate)navigator.vibrate(50);
      if(!continuous){
        stop();
      }
      onScanRef.current(code);
    }

    function stop(){
      aliveRef.current=false;
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      if(lineRafRef.current)cancelAnimationFrame(lineRafRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
    }

    startCamera();
    return()=>{
      aliveRef.current=false;
      window.removeEventListener("resize",measureFrame);
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      if(lineRafRef.current)cancelAnimationFrame(lineRafRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
    };
  },[continuous]); // onScan يُقرأ عبر ref فلا يُعيد تشغيل الكاميرا

  const close=()=>{
    aliveRef.current=false;
    try{if(lineRafRef.current)cancelAnimationFrame(lineRafRef.current);}catch{}
    try{if(rafRef.current)cancelAnimationFrame(rafRef.current);}catch{}
    try{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());}catch{}
    onClose();
  };
  const go=()=>{if(manual.trim()){close();onScan(manual.trim());}};

function AdminPanel({onClose}){
  const [step,setStep]=useState("pin");
  const [pin,setPin]=useState("");
  const [err,setErr]=useState("");
  const [users,setUsers]=useState({});
  const [view,setView]=useState("list"); // list | add | edit
  const [editPhone,setEditPhone]=useState(null); // رقم البائع قيد التعديل
  const [form,setForm]=useState({phone:"",name:"",pin4:"",months:"1"});
  const [msg,setMsg]=useState("");
  const [confirmDel,setConfirmDel]=useState(null); // رقم البائع قيد الحذف
  const [attempts,setAttempts]=useState(0);
  const [lockUntil,setLockUntil]=useState(0);
  const [checking,setChecking]=useState(false);

  useEffect(()=>{
    (async()=>{const u=await getUsers();setUsers(u||{});})();
  },[]);

  const checkPin=async()=>{
    // حماية من محاولات التخمين المتكررة: قفل مؤقت بعد 5 محاولات فاشلة
    if(Date.now()<lockUntil){
      const secs=Math.ceil((lockUntil-Date.now())/1000);
      setErr(`محاولات كثيرة، حاول بعد ${secs} ثانية`);
      return;
    }
    setChecking(true);
    const hash=await sha256Hex(pin);
    setChecking(false);
    if(hash===ADMIN_PIN_HASH){setStep("manage");setErr("");setAttempts(0);}
    else{
      const n=attempts+1;
      setAttempts(n);
      if(n>=5){setLockUntil(Date.now()+30000);setErr("محاولات كثيرة، حاول بعد 30 ثانية");}
      else setErr("رمز المشرف غير صحيح");
    }
  };

  const saveUser=async()=>{
    if(!form.phone.trim()||!form.name.trim())
      return setMsg("يرجى تعبئة جميع الحقول");
    // عند التعديل: حقل الرمز فارغ يعني "إبقاء الرمز الحالي كما هو دون تغيير"
    const changingPin=form.pin4.trim().length>0;
    if(view==="add"&&!changingPin)return setMsg("يرجى إدخال رمز مكوّن من 4 أرقام");
    if(changingPin&&form.pin4.length!==4)return setMsg("الرمز يجب أن يكون 4 أرقام");

    const expiry=new Date();
    expiry.setMonth(expiry.getMonth()+parseInt(form.months||1));
    const u={...users};

    if(view==="edit"&&editPhone&&editPhone!==form.phone){
      // تغيير رقم الهاتف - انقل البيانات
      delete u[editPhone];
    }
    const prev=(view==="edit"&&users[editPhone])?users[editPhone]:{};
    u[form.phone.trim()]={
      name:form.name.trim(),
      ...(changingPin?{pinHash:await sha256Hex(form.pin4)}:{pinHash:prev.pinHash}),
      subscribed:true,
      subExpiry:expiry.toISOString().split("T")[0],
      ...(view==="edit"?{}:{createdAt:new Date().toISOString()})
    };
    setUsers(u);saveUsers(u);
    setMsg(view==="add"?"✅ تم إضافة البائع بنجاح":"✅ تم حفظ التعديل");
    setTimeout(()=>{setMsg("");setView("list");setEditPhone(null);
      setForm({phone:"",name:"",pin4:"",months:"1"});},1500);
  };

  const openEdit=phone=>{
    const u=users[phone];
    if(!u)return;
    // لا يُعاد عرض الرمز القديم أبدًا (غير مخزَّن أصلاً كنص صريح)؛ اترك الحقل فارغًا
    setForm({phone,name:u.name,pin4:"",months:"1"});
    setEditPhone(phone);setView("edit");setMsg("");
  };

  const toggleActive=phone=>{
    const u={...users};
    u[phone]={...u[phone],subscribed:!u[phone].subscribed};
    setUsers(u);saveUsers(u);
  };

  const renewSub=phone=>{
    const u={...users};
    const exp=new Date();
    exp.setMonth(exp.getMonth()+1);
    u[phone]={...u[phone],subscribed:true,subExpiry:exp.toISOString().split("T")[0]};
    setUsers(u);saveUsers(u);
    setMsg("✅ تم التجديد لشهر إضافي");
    setTimeout(()=>setMsg(""),2000);
  };

  const deleteUser=phone=>{
    const u={...users};
    delete u[phone];
    setUsers(u);saveUsers(u);
    setConfirmDel(null);
    setMsg("✅ تم حذف الحساب");
    setTimeout(()=>setMsg(""),2000);
    // حذف بيانات البائع من Firebase
    if(_db){
      try{_db.collection("sellers").doc(phone).delete().catch(()=>{});}catch{}
    }
  };

  // ── شاشة رمز المشرف ── (modal فوق شاشة الدخول)
  if(step==="pin")return(
    <div style={{position:"fixed",inset:0,background:"#0d1117",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
      <div className="lc" style={{maxWidth:320,width:"100%"}}>
        <p style={{color:"#e6edf3",fontWeight:700,fontSize:16,marginBottom:16,textAlign:"center"}}>لوحة المشرف</p>
        <input className="inp" type="password" placeholder="رمز المشرف"
          value={pin} onChange={e=>setPin(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&checkPin()}
          autoFocus style={{marginBottom:12,textAlign:"center",letterSpacing:4}}/>
        {err&&<p style={{color:"#f85149",textAlign:"center",fontSize:12,marginBottom:10}}>{err}</p>}
        <button className="btn btn-p" style={{width:"100%",marginBottom:8,opacity:checking?.6:1}} onClick={checkPin} disabled={checking}>{checking?"...":"دخول →"}</button>
        <button className="btn btn-s" style={{width:"100%"}} onClick={onClose}>إلغاء</button>
      </div>
    </div>
  );

  const entries=Object.entries(users);

  // ── فورم إضافة / تعديل ──
  if(view==="add"||view==="edit")return(
    <div style={{position:"fixed",inset:0,background:"#0d1117",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:16,overflowY:"auto"}}>
      <div className="lc" style={{maxWidth:380,width:"100%",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button className="btn btn-s btn-sm" onClick={()=>{setView("list");setEditPhone(null);setMsg("");setForm({phone:"",name:"",pin4:"",months:"1"});}}>← رجوع</button>
          <p style={{color:"#e6edf3",fontWeight:700,fontSize:15}}>{view==="add"?"➕ إضافة بائع":"✏️ تعديل الحساب"}</p>
        </div>
        <div className="card">
          {[
            {l:"رقم الهاتف",k:"phone",p:"09XXXXXXXX",t:"tel"},
            {l:"اسم البائع",k:"name",p:"الاسم الكامل",t:"text"},
            {l:view==="edit"?"رمز PIN الجديد (اتركه فارغًا للإبقاء عليه)":"رمز PIN (4 أرقام)",k:"pin4",p:"····",t:"number"},
          ].map(f=>(
            <div key={f.k} style={{marginBottom:12}}>
              <p className="lbl">{f.l}</p>
              <input className="inp" placeholder={f.p} type={f.t}
                value={form[f.k]} inputMode={f.t==="number"?"numeric":undefined}
                onChange={e=>setForm(x=>({...x,[f.k]:e.target.value}))}/>
            </div>
          ))}
          <div style={{marginBottom:14}}>
            <p className="lbl">مدة الاشتراك</p>
            <select className="inp" value={form.months}
              onChange={e=>setForm(x=>({...x,months:e.target.value}))}>
              {["1","3","6","12"].map(m=><option key={m} value={m}>{m} {parseInt(m)===1?"شهر":"أشهر"}</option>)}
            </select>
          </div>
          {msg&&<p style={{color:msg.startsWith("✅")?"#3a56b8":"#f85149",fontSize:12,marginBottom:10,fontWeight:600}}>{msg}</p>}
          <button className="btn btn-p" onClick={saveUser}>
            {view==="add"?"✅ إضافة البائع":"💾 حفظ التعديل"}
          </button>
        </div>
      </div>
    </div>
  );

  // ── قائمة البائعين ──
  return(
    <div style={{position:"fixed",inset:0,background:"#0d1117",
      display:"flex",alignItems:"flex-start",justifyContent:"center",
      zIndex:9999,padding:16,overflowY:"auto"}}>
      <div className="lc" style={{maxWidth:420,width:"100%",marginTop:20,marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <p style={{color:"#e6edf3",fontWeight:700,fontSize:15}}>👥 البائعون ({entries.length})</p>
          <div style={{display:"flex",gap:7}}>
            <button className="btn btn-p btn-sm" onClick={()=>{setView("add");setMsg("");setForm({phone:"",name:"",pin4:"",months:"1"});}}>+ إضافة</button>
            <button className="btn btn-s btn-sm" onClick={onClose}>✕</button>
          </div>
        </div>

        {msg&&<div style={{background:"rgba(30,48,122,0.15)",border:"1px solid rgba(30,48,122,0.3)",
          borderRadius:10,padding:"8px 12px",marginBottom:12,textAlign:"center"}}>
          <p style={{color:"#3a56b8",fontSize:13,fontWeight:700}}>{msg}</p>
        </div>}

        {entries.length===0
          ?<div className="emp card"><div className="emp-i">👤</div><p className="emp-t">لا يوجد بائعون</p></div>
          :entries.map(([phone,u])=>{
            const d=daysUntil(u.subExpiry);
            const active=u.subscribed&&d>=0;
            return(
              <div key={phone} className="card" style={{marginBottom:10}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                  <div style={{flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                      <p style={{color:"#e6edf3",fontWeight:700,fontSize:14}}>{u.name}</p>
                      <span style={{background:active?"rgba(30,48,122,0.2)":"rgba(218,54,51,0.2)",
                        color:active?"#5b7fe0":"#f85149",
                        fontSize:10,padding:"2px 7px",borderRadius:20,fontWeight:700}}>
                        {active?"✓ نشط":"✗ موقوف"}
                      </span>
                    </div>
                    <p style={{color:"#7d8590",fontSize:11}}>{phone}</p>
                    <p style={{color:d<7?"#f85149":d<30?"#f0883e":"#7d8590",fontSize:11,marginTop:2}}>
                      ينتهي: {fmtDate(u.subExpiry)} {d>=0?`(${d} يوم)`:"(منتهي)"}
                    </p>
                  </div>
                </div>
                {/* أزرار التحكم */}
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <button className="btn btn-s btn-sm" style={{flex:1,minWidth:60}}
                    onClick={()=>openEdit(phone)}>✏️ تعديل</button>
                  <button className="btn btn-s btn-sm" style={{flex:1,minWidth:60,
                    color:active?"#f0883e":"#3a56b8"}}
                    onClick={()=>toggleActive(phone)}>
                    {active?"⏸ إيقاف":"▶ تفعيل"}
                  </button>
                  <button className="btn btn-s btn-sm" style={{flex:1,minWidth:60,color:"#60a5fa"}}
                    onClick={()=>renewSub(phone)}>🔄 تجديد</button>
                  <button className="btn btn-d btn-sm" style={{flex:1,minWidth:60}}
                    onClick={()=>setConfirmDel(phone)}>🗑 حذف</button>
                </div>
              </div>
            );
          })
        }

        {/* تأكيد الحذف */}
        {confirmDel&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",
            display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
            <div className="card" style={{width:"100%",maxWidth:320,textAlign:"center"}}>
              <p style={{fontSize:28,marginBottom:8}}>⚠️</p>
              <p style={{color:"#e6edf3",fontWeight:700,fontSize:15,marginBottom:6}}>
                هل تريد حذف هذا الحساب؟
              </p>
              <p style={{color:"#7d8590",fontSize:12,marginBottom:4}}>
                {users[confirmDel]?.name}
              </p>
              <p style={{color:"#f85149",fontSize:11,marginBottom:16}}>
                ⚠️ سيتم حذف جميع بيانات هذا البائع نهائياً
              </p>
              <div style={{display:"flex",gap:10}}>
                <button className="btn btn-d" style={{flex:1}}
                  onClick={()=>deleteUser(confirmDel)}>نعم، احذف</button>
                <button className="btn btn-s" style={{flex:1}}
                  onClick={()=>setConfirmDel(null)}>تراجع</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function LoginScreen({onLogin}){
  const [phone,setPhone]=useState("");
  const [pin,setPin]=useState("");
  const [name,setName]=useState("");
  const [step,setStep]=useState("info");
  const [err,setErr]=useState("");
  const [shake,setShake]=useState(false);
  const [busy,setBusy]=useState(false);
  const [showAdmin,setShowAdmin]=useState(false);
  const [attempts,setAttempts]=useState(0);
  const [lockUntil,setLockUntil]=useState(0);

  const bad=msg=>{setErr(msg);setShake(true);setTimeout(()=>setShake(false),450);};

  const goPin=()=>{
    if(!name.trim())return bad("أدخل اسمك");
    if(phone.length<9)return bad("رقم الهاتف غير صحيح");
    setErr("");setStep("pin");
  };

  const doLogin=()=>{
    if(Date.now()<lockUntil){
      const secs=Math.ceil((lockUntil-Date.now())/1000);
      return bad(`محاولات كثيرة، حاول بعد ${secs} ثانية`);
    }
    setBusy(true);
    (async()=>{
      // تحقق من localStorage أولاً (سريع)
      let users=sg("admin:users")||{};
      let u=users[phone];
      // ثم تحقق من Firebase (إذا متاح)
      if(_db){
        try{const fbUsers=await getUsers();if(Object.keys(fbUsers).length>0){users=fbUsers;u=users[phone];}}catch{}
      }
      if(!u){setBusy(false);return bad("رقم الهاتف غير مسجل — تواصل مع المشرف");}

      // تحقق من الرمز عبر التجزئة (Hash)؛ ولو الحساب قديم وما زال يخزّن الرمز
      // كنص صريح (u.pin)، تحقق منه للتوافق ثم رقّه فورًا إلى تجزئة آمنة
      let pinOk=false;
      if(u.pinHash){
        pinOk=(await sha256Hex(pin))===u.pinHash;
      } else if(u.pin!==undefined){
        pinOk=u.pin===pin;
        if(pinOk){
          // ترقية تلقائية وصامتة من نص صريح إلى تجزئة، مع حذف الحقل القديم فعليًا من Firestore
          const migrated={...users,[phone]:{...u,pinHash:await sha256Hex(pin)}};
          delete migrated[phone].pin;
          saveUsers(migrated);
          if(_db&&window.firebase){
            _db.collection("sellers").doc(phone)
              .update({"profile.pin":window.firebase.firestore.FieldValue.delete()})
              .catch(()=>{});
          }
        }
      }
      if(!pinOk){
        setPin("");setBusy(false);
        const n=attempts+1;setAttempts(n);
        if(n>=5){setLockUntil(Date.now()+30000);return bad("محاولات كثيرة، حاول بعد 30 ثانية");}
        return bad("الرمز غير صحيح");
      }
      setAttempts(0);
      if(!u.subscribed){setBusy(false);return bad("الاشتراك موقوف — تواصل مع المشرف");}
      if(u.subExpiry&&daysUntil(u.subExpiry)<0){setBusy(false);return bad("انتهى اشتراكك — تواصل مع المشرف للتجديد");}
      const ud={phone,name:u.name,plan:"باقة بريميوم",subExpiry:u.subExpiry};
      ss("session:user",ud);
      _activePhone=phone;
      setActivePhone(phone);
      // حمّل بيانات البائع من Firebase مباشرة بعد تسجيل الدخول
      if(_db){
        try{
          const base=_db.collection("sellers").doc(phone).collection("data");
          const [ps,st,ns,rs]=await Promise.all([
            base.doc("products:all").get(),
            base.doc("settings:app").get(),
            base.doc("notifs:list").get(),
            base.doc("sales:list").get(),
          ]);
          if(ps.exists&&ps.data().v){ss(_lk("products:all",phone),ps.data().v);}
          if(st.exists&&st.data().v){ss(_lk("settings:app",phone),st.data().v);}
          if(ns.exists&&ns.data().v){ss(_lk("notifs:list",phone),ns.data().v);}
          if(rs.exists&&rs.data().v){ss(_lk("sales:list",phone),rs.data().v);}
        }catch(e){console.warn("Login FB load:",e);}
      }
      onLogin(ud,phone);
      setBusy(false);
    })();
  };

  return(
    <div className="lw">
      {showAdmin&&<AdminPanel onClose={()=>setShowAdmin(false)}/>}
      <div className={`lcard${shake?" shk":""}`}>
        <div style={{textAlign:"center",marginBottom:24}}>

          <h1 style={{color:"#fff",fontSize:26,fontWeight:900}}>مرحبًا بكم</h1>
          <p style={{color:"#7d8590",fontSize:12,marginTop:3}}>نظام نقطة البيع الذكي</p>
        </div>

        {step==="info"&&<>
          <div style={{marginBottom:13}}>
            <p className="lbl">الاسم</p>
            <input className="inp" placeholder="اسمك الكامل" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&goPin()}/>
          </div>
          <div style={{marginBottom:22}}>
            <p className="lbl">رقم الهاتف</p>
            <input className="inp" placeholder="09XXXXXXXX" value={phone} type="tel" onChange={e=>setPhone(e.target.value.replace(/\D/g,"").slice(0,10))} onKeyDown={e=>e.key==="Enter"&&goPin()}/>
          </div>
          {err&&<p style={{color:"#f85149",fontSize:12,textAlign:"center",marginBottom:12}}>{err}</p>}
          <button className="btn btn-p" onClick={goPin}>التالي →</button>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16}}>
            <p style={{color:"#30363d",fontSize:11}}>الاشتراك 45 د.ل/شهر</p>
            <button onClick={()=>setShowAdmin(true)} style={{background:"none",border:"none",color:"#30363d",fontSize:11,cursor:"pointer",fontFamily:"'Cairo',sans-serif"}}>🔑 المشرف</button>
          </div>
        </>}

        {step==="pin"&&<>
          <button onClick={()=>{setStep("info");setPin("");setErr("");}} style={{background:"none",border:"none",color:"#7d8590",cursor:"pointer",fontFamily:"'Cairo',sans-serif",fontSize:12,marginBottom:16}}>← رجوع</button>
          <p style={{color:"#e6edf3",textAlign:"center",fontSize:14,marginBottom:2}}>مرحباً، {name}</p>
          <p style={{color:"#7d8590",textAlign:"center",fontSize:11,marginBottom:4}}>رمز الدخول (4 أرقام)</p>
          <div className="pdots">{[0,1,2,3].map(i=><div key={i} className={`pd${pin.length>i?" on":""}`}/>)}</div>
          {err&&<p style={{color:"#f85149",fontSize:12,textAlign:"center",marginBottom:9}}>{err}</p>}
          <div className="numpad">
            {[1,2,3,4,5,6,7,8,9].map(n=>(
              <button key={n} className="nk" onClick={()=>pin.length<4&&setPin(p=>p+n)}>{n}</button>
            ))}
            <button className="nk" style={{fontSize:14}} onClick={()=>setPin(p=>p.slice(0,-1))}>⌫</button>
            <button className="nk" onClick={()=>pin.length<4&&setPin(p=>p+"0")}>0</button>
            <button className="nk" style={{background:pin.length===4?"linear-gradient(135deg,#1e307a,#3a56b8)":undefined,fontSize:18}} onClick={doLogin} disabled={pin.length<4||busy}>{busy?"⏳":"✓"}</button>
          </div>
        </>}
      </div>
    </div>
  );
}

/* ══ POS TAB ══ */
function POSTab({prods,saveProds,addSale,sales,markDebt,returnInvoice}){
  const [cart,setCart]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [lastAdded,setLastAdded]=useState(null);
  const [noFind,setNoFind]=useState(false);
  const [showRec,setShowRec]=useState(false);
  const [curRec,setCurRec]=useState(null);
  const [showDebt,setShowDebt]=useState(false);
  const [debtName,setDebtName]=useState("");
  const [search,setSearch]=useState("");
  const [searchRes,setSearchRes]=useState([]);
  const timerRef=useRef(null);
  const nfTimerRef=useRef(null);

  useEffect(()=>{
    const q=search.trim();
    if(!q){setSearchRes([]);return;}
    const isNum=/^[0-9]+$/.test(q);
    let res;
    if(isNum){
      res=Object.entries(prods).filter(([code])=>code.endsWith(q));
    } else {
      const sw=Object.entries(prods).filter(([,p])=>p.name.startsWith(q));
      const cn=Object.entries(prods).filter(([,p])=>!p.name.startsWith(q)&&p.name.includes(q));
      res=[...sw,...cn];
    }
    setSearchRes(res.slice(0,8));
  },[search,prods]);

  const addToCart=useCallback((code,p)=>{
    const maxStock=prods[code]?.stock??0;
    setCart(prev=>{
      const ex=prev.find(i=>i.code===code);
      const curQty=ex?ex.qty:0;
      // لا تتجاوز المخزون المتاح
      if(curQty>=maxStock){
        // إشعار نفاد الكمية
        setLastAdded({name:p.name,outOfStock:true,ts:Date.now()});
        if(timerRef.current)clearTimeout(timerRef.current);
        timerRef.current=setTimeout(()=>setLastAdded(null),2500);
        return prev;
      }
      if(ex)return prev.map(i=>i.code===code?{...i,qty:i.qty+1}:i);
      return [...prev,{...p,code,qty:1,maxStock}];
    });
    const curInCart=cart.find(i=>i.code===code)?.qty??0;
    if(curInCart<maxStock){
      const newQty=curInCart+1;
      setLastAdded({
        name:p.name,
        outOfStock:newQty>=maxStock,
        remaining:maxStock-newQty,
        ts:Date.now()
      });
      setNoFind(false);
      if(timerRef.current)clearTimeout(timerRef.current);
      timerRef.current=setTimeout(()=>setLastAdded(null),2000);
    }
    setSearch("");setSearchRes([]);
  },[prods,cart]);

  const handleScan=useCallback(code=>{
    const p=prods[code];
    if(!p){
      setLastAdded(null);
      setNoFind(true);
      if(nfTimerRef.current)clearTimeout(nfTimerRef.current);
      nfTimerRef.current=setTimeout(()=>setNoFind(false),2000);
      return;
    }
    if(p.stock<=0){
      setLastAdded({name:p.name,outOfStock:true,remaining:0,ts:Date.now()});
      if(timerRef.current)clearTimeout(timerRef.current);
      timerRef.current=setTimeout(()=>setLastAdded(null),2500);
      return;
    }
    addToCart(code,p);
  },[prods,addToCart]);

  const remove=code=>setCart(p=>p.filter(i=>i.code!==code));
  const chgQty=(code,d)=>setCart(p=>p.map(i=>{
    if(i.code!==code)return i;
    let nq=i.qty+d;
    if(i.qty<0){
      // سلعة إرجاع: تبقى سالبة دائمًا (لا تتحول لبيع عادي عبر أزرار +/-)
      if(nq>=0)nq=-1;
    } else {
      // سلعة بيع عادية: لا تقل عن 1 ولا تتجاوز المخزون المتاح إطلاقًا
      nq=Math.max(1,Math.min(i.maxStock??nq,nq));
    }
    return {...i,qty:nq};
  }));
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);

  const checkout=()=>{
    const upd={...prods};
    cart.forEach(it=>{if(upd[it.code])upd[it.code]={...upd[it.code],stock:Math.max(0,upd[it.code].stock-it.qty)};});
    saveProds(upd);
    const isReturn=cart.some(i=>i.qty<0);
    const rec={id:newId(),ts:Date.now(),isReturn,
      items:cart.map(i=>({code:i.code,name:i.name,qty:i.qty,price:i.price,total:+(i.price*i.qty).toFixed(2)})),
      total:+total.toFixed(2)};
    addSale(rec);setCurRec(rec);setShowRec(true);setScanning(false);
  };

  const newSale=()=>{setCart([]);setShowRec(false);setCurRec(null);setLastAdded(null);setSearch("");setShowDebt(false);setDebtName("");};

  const debtorNames=useMemo(()=>{
    const names=(sales||[]).filter(s=>s.debtor).map(s=>s.debtor);
    return [...new Set(names)];
  },[sales]);

  const debtSuggest=useMemo(()=>{
    const q=debtName.trim();
    if(!q)return[];
    const sw=debtorNames.filter(n=>n.startsWith(q));
    const cn=debtorNames.filter(n=>!n.startsWith(q)&&n.includes(q));
    return [...sw,...cn].slice(0,6);
  },[debtName,debtorNames]);

  const confirmDebt=name=>{
    const n=(name||debtName).trim();
    if(!n||!curRec)return;
    markDebt&&markDebt(curRec.id,n);
    setCurRec(prev=>prev?{...prev,debtor:n,isDebt:true}:prev);
    setDebtName(n);setShowDebt(false);
  };

  const doReturn=()=>{
    if(!curRec||curRec.isReturn)return;
    returnInvoice&&returnInvoice(curRec.id,curRec.items);
    setCurRec(prev=>prev?{...prev,isReturn:true}:prev);
  };

  if(showRec&&curRec)return(
    <div className="sc">
      <div className="rp">
        <div style={{textAlign:"center",borderBottom:"2px dashed #ccc",paddingBottom:13,marginBottom:13}}>
          <div style={{fontSize:30,marginBottom:5}}>{curRec.isReturn?"↩️":"🧾"}</div>
          <h2 style={{fontSize:16,fontWeight:900}}>{curRec.isReturn?"فاتورة إرجاع":"فاتورة بيّاع"}</h2>
          <p style={{color:"#666",fontSize:11,marginTop:2}}>{curRec.id}</p>
          <p style={{color:"#555",fontSize:11}}>{fmtTime(curRec.ts)}</p>
        </div>
        {curRec.items.map((it,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f0f0f0",fontSize:12}}>
            <span style={{fontWeight:700}}>{it.qty<0&&"↩️ "}{it.name}</span>
            <span style={{color:it.qty<0?"#1e7a3a":"#1e307a",fontWeight:700}}>{it.qty}×{it.price.toFixed(2)}={it.total.toFixed(2)} د.ل</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:13,borderTop:"2px solid #111",paddingTop:9,fontSize:17,fontWeight:900}}>
          <span>المجموع</span><span style={{color:curRec.isReturn?"#1e7a3a":"#1e307a"}}>{curRec.total.toFixed(2)} د.ل</span>
        </div>
        {curRec.debtor&&(
          <div style={{marginTop:10,background:"rgba(218,54,51,0.08)",border:"1px solid rgba(218,54,51,0.25)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
            <p style={{color:"#b83a3a",fontWeight:700,fontSize:12}}>💳 دين على: {curRec.debtor}</p>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button className="btn btn-p" onClick={newSale} style={{flex:1}}>بيع جديد +</button>
        {!curRec.isReturn&&(curRec.debtor
          ?<button className="btn btn-s" style={{flex:1,opacity:.6}} disabled>✅ دين مسجّل</button>
          :<button className="btn btn-r" onClick={()=>setShowDebt(v=>!v)} style={{flex:1}}>دين</button>)}
      </div>
      {showDebt&&!curRec.debtor&&!curRec.isReturn&&(
        <div style={{marginTop:10}}>
          <input className="inp" autoFocus placeholder="اسم المدين..."
            value={debtName} onChange={e=>setDebtName(e.target.value)}
            onKeyDown={e=>{if(e.key==="Enter")confirmDebt();}}/>
          {debtSuggest.length>0&&(
            <div style={{background:"#161b22",border:"1px solid rgba(48,54,61,0.8)",
              borderRadius:10,marginTop:5,overflow:"hidden",maxHeight:180,overflowY:"auto"}}>
              {debtSuggest.map(n=>(
                <div key={n} onClick={()=>confirmDebt(n)}
                  style={{padding:"9px 14px",borderBottom:"1px solid rgba(48,54,61,0.5)",
                    cursor:"pointer",color:"#e6edf3",fontSize:13,fontWeight:700}}>{n}</div>
              ))}
            </div>
          )}
          <button className="btn btn-r" style={{width:"100%",marginTop:8}} onClick={()=>confirmDebt()}>تأكيد الدين</button>
        </div>
      )}
      {!curRec.debtor&&(
        <div style={{marginTop:8}}>
          <button className={`btn ${curRec.isReturn?"btn-s":"btn-g"}`} style={{width:"100%",opacity:curRec.isReturn?.6:1}}
            onClick={doReturn} disabled={curRec.isReturn}>
            {curRec.isReturn?"✅ تم الإرجاع":"↩️ إرجاع"}
          </button>
        </div>
      )}
      <div style={{marginTop:8}}>
        <button className="btn btn-s" onClick={()=>setShowRec(false)} style={{width:"100%"}}>عرض السلة</button>
      </div>
    </div>
  );

  return(
    <div className="sc">
      {/* ماسح مستمر */}
      {scanning?(
        <div style={{marginBottom:11}}>
          <BarcodeScanner onScan={handleScan} onClose={()=>setScanning(false)}
            continuous={true} lastAdded={lastAdded} noFind={noFind}/>
          <button className="btn btn-s" style={{width:"100%",marginTop:8,fontSize:13,fontWeight:700}}
            onClick={()=>setScanning(false)}>
            ✔️ انتهيت من المسح ({cart.reduce((s,i)=>s+i.qty,0)} منتج في السلة)
          </button>
        </div>
      ):(
        <button className="btn btn-p" style={{marginBottom:11,fontSize:15}}
          onClick={()=>setScanning(true)}>
          📷 مسح الباركود / QR
        </button>
      )}

      {/* بحث يدوي */}
      {!scanning&&(
        <div style={{marginBottom:11}}>
          <div style={{position:"relative"}}>
            <input className="inp"
              placeholder="🔍 ابحث بالاسم أو آخر 4 أرقام من الكود..."
              value={search} onChange={e=>setSearch(e.target.value)}
              style={{paddingRight:36}}/>
            {search&&<button onClick={()=>{setSearch("");setSearchRes([]);}}
              style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",
                background:"none",border:"none",color:"#7d8590",fontSize:16,cursor:"pointer"}}>✕</button>}
          </div>
          {searchRes.length>0&&(
            <div style={{background:"#161b22",border:"1px solid rgba(48,54,61,0.8)",
              borderRadius:10,marginTop:5,overflow:"hidden",maxHeight:220,overflowY:"auto"}}>
              {searchRes.map(([code,p])=>(
                <div key={code} onClick={()=>addToCart(code,p)}
                  style={{padding:"10px 14px",borderBottom:"1px solid rgba(48,54,61,0.5)",
                    cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{p.name}</p>
                    <p style={{color:"#484f58",fontSize:10}}>كود: {code} · متوفر: {p.stock}</p>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <p style={{color:"#5b7fe0",fontWeight:900,fontSize:13}}>{p.price.toFixed(2)} د.ل</p>
                    <p style={{color:"#1e307a",fontSize:10,fontWeight:700}}>+ إضافة</p>
                  </div>
                </div>
              ))}
            </div>
          )}
          {search.trim()&&searchRes.length===0&&(
            <div style={{background:"rgba(248,81,73,0.08)",border:"1px solid rgba(248,81,73,0.2)",
              borderRadius:8,padding:"8px 12px",marginTop:5,textAlign:"center"}}>
              <p style={{color:"#f85149",fontSize:12}}>لا توجد نتائج</p>
            </div>
          )}
        </div>
      )}

      {/* السلة */}
      <div className="card" style={{marginBottom:11}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <p style={{color:"#e6edf3",fontWeight:700,fontSize:14}}>🛍️ السلة</p>
          {cart.length>0&&<span className="tag tg">{cart.reduce((s,i)=>s+i.qty,0)} منتج</span>}
        </div>
        {cart.length===0
          ?<div className="emp"><div className="emp-i"><img src={LOGO_URI} style={{width:44,height:"auto",opacity:0.55}} alt="بيّاع"/></div><p className="emp-t">امسح باركود منتج لبدء البيع</p></div>
          :<div style={{maxHeight:"36vh",overflowY:"auto"}}>
            {cart.map(item=>(
              <div key={item.code} className="prow" style={item.qty<0?{background:"rgba(63,185,80,0.06)",borderRadius:8}:undefined}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13,marginBottom:3}}>
                      {item.qty<0&&<span style={{color:"#3fb950",fontSize:11,marginLeft:4}}>↩️ إرجاع</span>}
                      {item.name}
                    </p>
                    <p style={{color:"#484f58",fontSize:10}}>كود: {item.code}  ·  {item.price.toFixed(2)} د.ل</p>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,marginRight:5}}>
                    <p style={{color:item.qty<0?"#3fb950":"#5b7fe0",fontWeight:900,fontSize:14}}>{(item.price*item.qty).toFixed(2)} د.ل</p>
                    <div className="qc">
                      <button className="qb" onClick={()=>chgQty(item.code,-1)}>−</button>
                      <span className="qn">{item.qty}</span>
                      <button className="qb" onClick={()=>chgQty(item.code,1)}>+</button>
                    </div>
                    <button className="btn btn-d btn-sm" onClick={()=>remove(item.code)}>🗑 حذف</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        }
      </div>

      <div className="card card-g" style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{color:"#7d8590",fontSize:13,fontWeight:600}}>المجموع الكلي</p>
          <p style={{color:cart.some(i=>i.qty<0)?"#3fb950":"#5b7fe0",fontSize:24,fontWeight:900}}>{total.toFixed(2)} <span style={{fontSize:12}}>د.ل</span></p>
        </div>
      </div>
      <button className={`btn ${cart.some(i=>i.qty<0)?"btn-g":"btn-p"}`} disabled={cart.length===0} onClick={checkout} style={{fontSize:15}}>
        {cart.some(i=>i.qty<0)?"↩️ إتمام الإرجاع وإصدار الفاتورة":"✅ إتمام البيع وإصدار الفاتورة"}
      </button>
    </div>
  );
}
