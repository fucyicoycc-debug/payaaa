/* ══ Storage معزول — مفتاح خاص بكل بائع ══ */
let _activePhone="";
const setActivePhone=p=>{_activePhone=p;};
// مفتاح التخزين: دائماً يتضمن رقم هاتف البائع
const _lk=(k,ph)=>{const p=ph||_activePhone;return p?("U|"+p+"|"+k):k;};

// قراءة من localStorage (سريع وفوري)
function usgLocal(k,ph){return sg(_lk(k,ph));}

// كتابة: localStorage فوري + Firebase في الخلفية
function uss(k,v,ph){
  const p=ph||_activePhone;
  if(!p){console.warn("uss: no phone!");return;}
  ss(_lk(k,p),v);
  if(_db){
    _db.collection("sellers").doc(p).collection("data").doc(k)
      .set({v,t:Date.now()}).catch(e=>console.warn("uss err:",e));
  }
}

// قراءة async (localStorage أولاً، ثم Firebase إذا فارغ)
async function usg(k,ph){
  const p=ph||_activePhone;
  if(!p)return null;
  const local=sg(_lk(k,p));
  if(local!==null)return local;
  if(_db){
    try{
      const snap=await _db.collection("sellers").doc(p).collection("data").doc(k).get();
      if(snap.exists){const v=snap.data().v;ss(_lk(k,p),v);return v;}
    }catch{}
  }
  return null;
}

async function getUsers(){
  if(_db){
    try{
      const snap=await _db.collection("sellers").get();
      const u={};
      snap.forEach(d=>{if(d.data().profile)u[d.id]={...d.data().profile};});
      if(Object.keys(u).length>0){ss("admin:users",u);return u;}
    }catch(e){console.warn("getUsers:",e);}
  }
  return sg("admin:users")||{};
}

function saveUsers(u){
  ss("admin:users",u);
  if(_db){
    Object.entries(u).forEach(([phone,data])=>{
      _db.collection("sellers").doc(phone).set({profile:data,t:Date.now()},{merge:true})
        .catch(e=>console.warn("saveUser:",e));
    });
  }
}

/* ══════════════════════════════════════════
   BARCODE SCANNER
══════════════════════════════════════════ */
function BarcodeScanner({onScan,onClose,continuous=false,lastAdded=null,noFind=false}){
  const vidRef=useRef(null);
  const canvasRef=useRef(null);
  const streamRef=useRef(null);
  const rafRef=useRef(null);
  const detectorRef=useRef(null);
  const [camErr,setCamErr]=useState(false);
  const [ready,setReady]=useState(false);
  const [manual,setManual]=useState("");
  const lastScanTime=useRef(0);
  const aliveRef=useRef(true);

  useEffect(()=>{
    aliveRef.current=true;
    lastScanTime.current=0;

    async function init(){
      // تحميل مكتبات المسح
      await new Promise(resolve=>{
        let n=0,done=0;
        const libs=[];
        if(!window.jsQR)libs.push("https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js");
        if(!window.Quagga)libs.push("https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js");
        if(!libs.length){resolve();return;}
        n=libs.length;
        libs.forEach(src=>{
          const s=document.createElement("script");
          s.src=src;
          s.onload=s.onerror=()=>{done++;if(done>=n)resolve();};
          document.head.appendChild(s);
        });
      });
      if(!aliveRef.current)return;

      try{
        // محاولة فتح الكاميرا الخلفية بطريقة Samsung المتوافقة
        let stream=null;
        const attempts=[
          {video:{facingMode:{exact:"environment"}}},
          {video:{facingMode:"environment"}},
          {video:{facingMode:{ideal:"environment"}}},
          {video:true},
        ];
        for(const c of attempts){
          try{stream=await navigator.mediaDevices.getUserMedia(c);break;}catch{}
        }
        if(!stream){setCamErr(true);return;}

        streamRef.current=stream;
        const v=vidRef.current;
        if(!v||!aliveRef.current)return;
        v.srcObject=stream;
        v.setAttribute("playsinline","true");
        v.setAttribute("webkit-playsinline","true");
        v.muted=true;
        await v.play();

        

        setReady(true);

        // BarcodeDetector
        if("BarcodeDetector" in window){
          try{detectorRef.current=new window.BarcodeDetector({
            formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]
          });}catch{}
        }
        loop();
      }catch(e){console.error(e);setCamErr(true);}
    }

    async function loop(){
      if(!aliveRef.current)return;
      const v=vidRef.current,cv=canvasRef.current;
      if(!v||!cv||v.readyState<2){rafRef.current=requestAnimationFrame(loop);return;}
      const now=Date.now();
      if(now-lastScanTime.current<1500){rafRef.current=requestAnimationFrame(loop);return;}

      if(detectorRef.current){
        try{
          const res=await detectorRef.current.detect(v);
          if(res?.length>0&&res[0].rawValue){emit(res[0].rawValue);rafRef.current=requestAnimationFrame(loop);return;}
        }catch{}
      }

      const W=v.videoWidth,H=v.videoHeight;
      if(!W||!H){rafRef.current=requestAnimationFrame(loop);return;}
      for(const scale of [1,1.8,3]){
        if(!aliveRef.current)return;
        const sw=Math.floor(W/scale),sh=Math.floor(H/scale);
        cv.width=800;cv.height=Math.floor(800*sh/sw)||400;
        const ctx=cv.getContext("2d",{willReadFrequently:true,alpha:false});
        ctx.filter="contrast(1.7) brightness(1.1) saturate(0)";
        ctx.drawImage(v,Math.floor((W-sw)/2),Math.floor((H-sh)/2),sw,sh,0,0,cv.width,cv.height);
        ctx.filter="none";
        if(window.jsQR){
          try{
            const r=window.jsQR(ctx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height,{inversionAttempts:"attemptBoth"});
            if(r?.data?.length>2){emit(r.data);rafRef.current=requestAnimationFrame(loop);return;}
          }catch{}
        }
        if(window.Quagga?.decodeSingle){
          let hit=false;
          await new Promise(res=>{
            try{window.Quagga.decodeSingle({
              src:cv.toDataURL("image/jpeg",0.92),numOfWorkers:0,locate:true,
              inputStream:{size:800},
              decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]}
            },r=>{if(r?.codeResult?.code){hit=true;emit(r.codeResult.code);}res();});}catch{res();}
          });
          if(hit){rafRef.current=requestAnimationFrame(loop);return;}
        }
      }
      rafRef.current=requestAnimationFrame(loop);
    }

    function emit(code){
      if(!code||code.length<3||!aliveRef.current)return;
      const now=Date.now();
      if(now-lastScanTime.current<1500)return;
      lastScanTime.current=now;
      if(navigator.vibrate)navigator.vibrate([60,30,60]);
      if(!continuous){
        aliveRef.current=false;
        if(rafRef.current)cancelAnimationFrame(rafRef.current);
        if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
      }
      onScan(code);
    }

    init();
    return()=>{
      aliveRef.current=false;
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
    };
  },[onScan,continuous]);

  const close=()=>{
    aliveRef.current=false;
    try{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());}catch{}
    try{if(rafRef.current)cancelAnimationFrame(rafRef.current);}catch{}
    onClose();
  };
  const go=()=>{if(manual.trim()){close();onScan(manual.trim());}};

  return(
    <div style={{
      position:"fixed",top:0,left:0,right:0,bottom:0,
      width:"100%",height:"100%",
      background:"rgba(0,0,0,0.92)",
      display:"flex",alignItems:"center",justifyContent:"center",
      zIndex:9999,padding:"12px",boxSizing:"border-box",
      margin:0,overflow:"hidden"

function LoginScreen({onLogin}){
  const [phone,setPhone]=useState("");
  const [pin,setPin]=useState("");
  const [name,setName]=useState("");
  const [step,setStep]=useState("info");
  const [err,setErr]=useState("");
  const [shake,setShake]=useState(false);
  const [busy,setBusy]=useState(false);
  const [showAdmin,setShowAdmin]=useState(false);

  const bad=msg=>{setErr(msg);setShake(true);setTimeout(()=>setShake(false),450);};

  const goPin=()=>{
    if(!name.trim())return bad("أدخل اسمك");
    if(phone.length<9)return bad("رقم الهاتف غير صحيح");
    setErr("");setStep("pin");
  };

  const doLogin=()=>{
    setBusy(true);
    (async()=>{
      // تحقق من localStorage أولاً (سريع)
      let users=sg("admin:users")||{};
      let u=users[phone];
      // ثم تحقق من Firebase (إذا متاح)
      if(_db){
        try{const fbUsers=await getUsers();if(Object.keys(fbUsers).length>0){users=fbUsers;u=users[phone];}}catch{}
      }
      if(!u){setBusy(false);return bad("رقم الهاتف غير مسجل — تواصل مع المشرف");}
      if(u.pin!==pin){setPin("");setBusy(false);return bad("الرمز غير صحيح");}
      if(!u.subscribed){setBusy(false);return bad("الاشتراك موقوف — تواصل مع المشرف");}
      if(u.subExpiry&&daysUntil(u.subExpiry)<0){setBusy(false);return bad("انتهى اشتراكك — تواصل مع المشرف للتجديد");}
      const ud={phone,name:u.name,plan:"باقة بريميوم",subExpiry:u.subExpiry};
      ss("session:user",ud);
      _activePhone=phone;
      setActivePhone(phone);
      // حمّل بيانات البائع من Firebase مباشرة بعد تسجيل الدخول
      if(_db){
        try{
          const base=_db.collection("sellers").doc(phone).collection("data");
          const [ps,st,ns,rs]=await Promise.all([
            base.doc("products:all").get(),
            base.doc("settings:app").get(),
            base.doc("notifs:list").get(),
            base.doc("sales:list").get(),
          ]);
          if(ps.exists&&ps.data().v){ss(_lk("products:all",phone),ps.data().v);}
          if(st.exists&&st.data().v){ss(_lk("settings:app",phone),st.data().v);}
          if(ns.exists&&ns.data().v){ss(_lk("notifs:list",phone),ns.data().v);}
          if(rs.exists&&rs.data().v){ss(_lk("sales:list",phone),rs.data().v);}
        }catch(e){console.warn("Login FB load:",e);}
      }
      onLogin(ud,phone);
      setBusy(false);
    })();
  };

  return(
    <div className="lw">
      {showAdmin&&<AdminPanel onClose={()=>setShowAdmin(false)}/>}
      <div className={`lcard${shake?" shk":""}`}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{width:64,height:64,background:"linear-gradient(135deg,#238636,#2ea043)",borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 13px",fontSize:28,boxShadow:"0 8px 22px rgba(35,134,54,0.35)"}}>🏪</div>
          <h1 style={{color:"#fff",fontSize:26,fontWeight:900}}>بيّاع</h1>
          <p style={{color:"#7d8590",fontSize:12,marginTop:3}}>نظام نقطة البيع الذكي</p>
        </div>

        {step==="info"&&<>
          <div style={{marginBottom:13}}>
            <p className="lbl">الاسم</p>
            <input className="inp" placeholder="اسمك الكامل" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&goPin()}/>
          </div>
          <div style={{marginBottom:22}}>
            <p className="lbl">رقم الهاتف</p>
            <input className="inp" placeholder="09XXXXXXXX" value={phone} type="tel" onChange={e=>setPhone(e.target.value.replace(/\D/g,"").slice(0,10))} onKeyDown={e=>e.key==="Enter"&&goPin()}/>
          </div>
          {err&&<p style={{color:"#f85149",fontSize:12,textAlign:"center",marginBottom:12}}>{err}</p>}
          <button className="btn btn-p" onClick={goPin}>التالي →</button>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16}}>
            <p style={{color:"#30363d",fontSize:11}}>الاشتراك 45 د.ل/شهر</p>
            <button onClick={()=>setShowAdmin(true)} style={{background:"none",border:"none",color:"#30363d",fontSize:11,cursor:"pointer",fontFamily:"'Cairo',sans-serif"}}>🔑 المشرف</button>
          </div>

        {step==="pin"&&<>
          <button onClick={()=>{setStep("info");setPin("");setErr("");}} style={{background:"none",border:"none",color:"#7d8590",cursor:"pointer",fontFamily:"'Cairo',sans-serif",fontSize:12,marginBottom:16}}>← رجوع</button>

function POSTab({prods,saveProds,addSale}){
  const [cart,setCart]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [lastAdded,setLastAdded]=useState(null);
  const [noFind,setNoFind]=useState(false);
  const [showRec,setShowRec]=useState(false);
  const [curRec,setCurRec]=useState(null);
  const [search,setSearch]=useState("");
  const [searchRes,setSearchRes]=useState([]);
  const timerRef=useRef(null);
  const nfTimerRef=useRef(null);

  useEffect(()=>{
    const q=search.trim();
    if(!q){setSearchRes([]);return;}
    const isNum=/^[0-9]+$/.test(q);
    let res;
    if(isNum){
      res=Object.entries(prods).filter(([code])=>code.endsWith(q));
    } else {
      const sw=Object.entries(prods).filter(([,p])=>p.name.startsWith(q));
      const cn=Object.entries(prods).filter(([,p])=>!p.name.startsWith(q)&&p.name.includes(q));
      res=[...sw,...cn];
    }
    setSearchRes(res.slice(0,8));
  },[search,prods]);

  const addToCart=useCallback((code,p)=>{
    const maxStock=prods[code]?.stock??0;
    setCart(prev=>{
      const ex=prev.find(i=>i.code===code);
      const curQty=ex?ex.qty:0;
      // لا تتجاوز المخزون المتاح
      if(curQty>=maxStock){
        // إشعار نفاد الكمية
        setLastAdded({name:p.name,outOfStock:true,ts:Date.now()});
        if(timerRef.current)clearTimeout(timerRef.current);
        timerRef.current=setTimeout(()=>setLastAdded(null),2500);
        return prev;
      }
      if(ex)return prev.map(i=>i.code===code?{...i,qty:i.qty+1}:i);
      return [...prev,{...p,code,qty:1,maxStock}];
    });
    const curInCart=cart.find(i=>i.code===code)?.qty??0;
    if(curInCart<maxStock){
      const newQty=curInCart+1;
      setLastAdded({
        name:p.name,
        outOfStock:newQty>=maxStock,
        remaining:maxStock-newQty,
        ts:Date.now()
      });
      setNoFind(false);
      if(timerRef.current)clearTimeout(timerRef.current);
      timerRef.current=setTimeout(()=>setLastAdded(null),2000);
    }
    setSearch("");setSearchRes([]);
  },[prods,cart]);

  const handleScan=useCallback(code=>{
    const p=prods[code];
    if(!p){
      setLastAdded(null);
      setNoFind(true);
      if(nfTimerRef.current)clearTimeout(nfTimerRef.current);
      nfTimerRef.current=setTimeout(()=>setNoFind(false),2000);
      return;
    }
    if(p.stock<=0){
      setLastAdded({name:p.name,outOfStock:true,remaining:0,ts:Date.now()});
      if(timerRef.current)clearTimeout(timerRef.current);
      timerRef.current=setTimeout(()=>setLastAdded(null),2500);
      return;
    }
    addToCart(code,p);
  },[prods,addToCart]);

  const remove=code=>setCart(p=>p.filter(i=>i.code!==code));
  const chgQty=(code,d)=>setCart(p=>p.map(i=>i.code!==code?i:{...i,qty:Math.max(1,i.qty+d)}));
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);

  const checkout=()=>{
    const upd={...prods};
    cart.forEach(it=>{if(upd[it.code])upd[it.code]={...upd[it.code],stock:Math.max(0,upd[it.code].stock-it.qty)};});
    saveProds(upd);
    const rec={id:newId(),ts:Date.now(),
      items:cart.map(i=>({code:i.code,name:i.name,qty:i.qty,price:i.price,total:+(i.price*i.qty).toFixed(2)})),
      total:+total.toFixed(2)};
    addSale(rec);setCurRec(rec);setShowRec(true);setScanning(false);
  };

  const newSale=()=>{setCart([]);setShowRec(false);setCurRec(null);setLastAdded(null);setSearch("");};

  if(showRec&&curRec)return(
    <div className="sc">
      <div className="rp">
        <div style={{textAlign:"center",borderBottom:"2px dashed #ccc",paddingBottom:13,marginBottom:13}}>
          <div style={{fontSize:30,marginBottom:5}}>🧾</div>
          <h2 style={{fontSize:16,fontWeight:900}}>فاتورة بيّاع</h2>
          <p style={{color:"#666",fontSize:11,marginTop:2}}>{curRec.id}</p>
          <p style={{color:"#555",fontSize:11}}>{fmtTime(curRec.ts)}</p>
        </div>
        {curRec.items.map((it,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f0f0f0",fontSize:12}}>
            <span style={{fontWeight:700}}>{it.name}</span>
            <span style={{color:"#238636",fontWeight:700}}>{it.qty}×{it.price.toFixed(2)}={it.total.toFixed(2)} د.ل</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:13,borderTop:"2px solid #111",paddingTop:9,fontSize:17,fontWeight:900}}>
          <span>المجموع</span><span style={{color:"#238636"}}>{curRec.total.toFixed(2)} د.ل</span>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button className="btn btn-p" onClick={newSale} style={{flex:1}}>بيع جديد +</button>
        <button className="btn btn-s" onClick={()=>setShowRec(false)} style={{flex:1}}>عرض السلة</button>
      </div>
    </div>
  );

  return(
    <div className="sc">
      {/* ماسح مستمر */}
      {scanning?(
        <div style={{marginBottom:11}}>
          <BarcodeScanner onScan={handleScan} onClose={()=>setScanning(false)}
            continuous={true} lastAdded={lastAdded} noFind={noFind}/>
          <button className="btn btn-s" style={{width:"100%",marginTop:8,fontSize:13,fontWeight:700}}
            onClick={()=>setScanning(false)}>
            ✔️ انتهيت من المسح ({cart.reduce((s,i)=>s+i.qty,0)} منتج في السلة)
          </button>
        </div>
      ):(
        <button className="btn btn-p" style={{marginBottom:11,fontSize:15}}
          onClick={()=>setScanning(true)}>
          📷 مسح الباركود / QR
        </button>
      )}

      {/* بحث يدوي */}
      {!scanning&&(
        <div style={{marginBottom:11}}>
          <div style={{position:"relative"}}>
            <input className="inp"
              placeholder="🔍 ابحث بالاسم أو آخر 4 أرقام من الكود..."
              value={search} onChange={e=>setSearch(e.target.value)}
              style={{paddingRight:36}}/>
            {search&&<button onClick={()=>{setSearch("");setSearchRes([]);}}
              style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",
                background:"none",border:"none",color:"#7d8590",fontSize:16,cursor:"pointer"}}>✕</button>}
          </div>
          {searchRes.length>0&&(
            <div style={{background:"#161b22",border:"1px solid rgba(48,54,61,0.8)",
              borderRadius:10,marginTop:5,overflow:"hidden",maxHeight:220,overflowY:"auto"}}>
              {searchRes.map(([code,p])=>(
                <div key={code} onClick={()=>addToCart(code,p)}
                  style={{padding:"10px 14px",borderBottom:"1px solid rgba(48,54,61,0.5)",
                    cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{p.name}</p>
                    <p style={{color:"#484f58",fontSize:10}}>كود: {code} · متوفر: {p.stock}</p>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <p style={{color:"#3fb950",fontWeight:900,fontSize:13}}>{p.price.toFixed(2)} د.ل</p>
                    <p style={{color:"#238636",fontSize:10,fontWeight:700}}>+ إضافة</p>
                  </div>
                </div>
              ))}
            </div>
          )}
          {search.trim()&&searchRes.length===0&&(
            <div style={{background:"rgba(248,81,73,0.08)",border:"1px solid rgba(248,81,73,0.2)",
              borderRadius:8,padding:"8px 12px",marginTop:5,textAlign:"center"}}>
              <p style={{color:"#f85149",fontSize:12}}>لا توجد نتائج</p>
            </div>
          )}
        </div>
      )}

      {/* السلة */}
      <div className="card" style={{marginBottom:11}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <p style={{color:"#e6edf3",fontWeight:700,fontSize:14}}>🛍️ السلة</p>
          {cart.length>0&&<span className="tag tg">{cart.reduce((s,i)=>s+i.qty,0)} منتج</span>}
        </div>
        {cart.length===0
          ?<div className="emp"><div className="emp-i">🏪</div><p className="emp-t">امسح باركود منتج لبدء البيع</p></div>
          :<div style={{maxHeight:"36vh",overflowY:"auto"}}>
            {cart.map(item=>(
              <div key={item.code} className="prow">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div style={{flex:1}}>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13,marginBottom:3}}>{item.name}</p>
                    <p style={{color:"#484f58",fontSize:10}}>كود: {item.code}  ·  {item.price.toFixed(2)} د.ل</p>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,marginRight:5}}>
                    <p style={{color:"#3fb950",fontWeight:900,fontSize:14}}>{(item.price*item.qty).toFixed(2)} د.ل</p>
                    <div className="qc">
                      <button className="qb" onClick={()=>chgQty(item.code,-1)}>−</button>
                      <span className="qn">{item.qty}</span>
                      <button className="qb" onClick={()=>chgQty(item.code,1)}>+</button>
                    </div>
                    <button className="btn btn-d btn-sm" onClick={()=>remove(item.code)}>🗑 حذف</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        }
      </div>

      <div className="card card-g" style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{color:"#7d8590",fontSize:13,fontWeight:600}}>المجموع الكلي</p>
          <p style={{color:"#3fb950",fontSize:24,fontWeight:900}}>{total.toFixed(2)} <span style={{fontSize:12}}>د.ل</span></p>
        </div>
      </div>
      <button className="btn btn-p" disabled={cart.length===0} onClick={checkout} style={{fontSize:15}}>
        ✅ إتمام البيع وإصدار الفاتورة
      </button>
    </div>
  );
}

function ProductsTab({prods,saveProds,sets}){
  const [mode,setMode]=useState("list");
  const [edit,setEdit]=useState(null);
  const [scan,setScan]=useState(false);
  const [search,setSearch]=useState("");
  const [form,setForm]=useState({code:"",name:"",price:"",stock:"",
    exDay:"",exMonth:"",exYear:"",noExpiry:false,category:"غذائي"});
  const [err,setErr]=useState("");

  const buildExpiry=()=>{
    if(form.noExpiry)return "2099-12-31";
    const d=String(form.exDay).padStart(2,"0");
    const m=String(form.exMonth).padStart(2,"0");
    const y=form.exYear;
    if(!d||!m||!y||y.length<4)return "";
    return `${y}-${m}-${d}`;
  };
  const parseExpiry=exp=>{
    if(!exp||exp==="2099-12-31")return{exDay:"",exMonth:"",exYear:"",noExpiry:true};
    const p=exp.split("-");
    return{exDay:p[2]||"",exMonth:p[1]||"",exYear:p[0]||"",noExpiry:false};
  };

  const openAdd=()=>{setForm({code:"",name:"",price:"",stock:"",exDay:"",exMonth:"",exYear:"",noExpiry:false,category:"غذائي"});setErr("");setEdit(null);setMode("add");};
  const openEdit=code=>{
    const p=prods[code];
    setForm({code,name:p.name,price:p.price,stock:p.stock,...parseExpiry(p.expiry),category:p.category||"غذائي"});
    setEdit(code);setErr("");setMode("edit");
  };
  const save=()=>{
    if(!form.code.trim()||!form.name.trim()||!form.price||!form.stock)return setErr("يرجى تعبئة جميع الحقول");
    const expiry=buildExpiry();
    if(!form.noExpiry&&!expiry)return setErr("أدخل تاريخ الصلاحية أو اختر بلا تاريخ");
    const u={...prods};
    u[form.code.trim()]={name:form.name.trim(),price:parseFloat(form.price),stock:parseInt(form.stock),expiry,category:form.category};
    if(edit&&edit!==form.code.trim())delete u[edit];
    saveProds(u);setMode("list");
  };
  const del=code=>{if(confirm("حذف هذا المنتج؟")){const u={...prods};delete u[code];saveProds(u);}};

  // فلترة البحث
  const allEntries=Object.entries(prods);
  const filtered=search.trim()
    ?allEntries.filter(([code,p])=>{
        const q=search.trim();
        const isNum=/^[0-9]+$/.test(q);
        if(isNum)return code.endsWith(q);
        return p.name.startsWith(q)||p.name.includes(q);
      })
    :allEntries;
  // ترتيب: يبدأ بالحرف أولاً
  const sorted=search.trim()&&!/^[0-9]+$/.test(search.trim())
    ?[...filtered].sort((a,b)=>{
        const q=search.trim();
        const aS=a[1].name.startsWith(q)?0:1;
        const bS=b[1].name.startsWith(q)?0:1;
        return aS-bS;
      })
    :filtered;

  if(mode!=="list")return(
    <div className="sc">
      {scan&&<BarcodeScanner onScan={c=>{setScan(false);setForm(f=>({...f,code:c}));}} onClose={()=>setScan(false)}/>}
      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:16}}>
        <button className="btn btn-s btn-sm" onClick={()=>setMode("list")}>← رجوع</button>
        <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700}}>{mode==="add"?"إضافة منتج":"تعديل المنتج"}</h2>
      </div>
      <div className="card">
        <div style={{marginBottom:12}}>
          <p className="lbl">كود / باركود المنتج</p>
          <div style={{display:"flex",gap:7}}>
            <input className="inp" placeholder="أدخل أو امسح الكود" value={form.code}
              onChange={e=>setForm(f=>({...f,code:e.target.value}))} style={{flex:1}}
              readOnly={mode==="edit"}/>
            <button className="btn btn-s btn-sm" style={{flexShrink:0,fontSize:18}} onClick={()=>setScan(true)}>📷</button>
          </div>
        </div>
        {[{l:"اسم المنتج",k:"name",p:"مثال: سكر 1كغ",t:"text"},{l:"السعر (د.ل)",k:"price",p:"0.00",t:"number"},{l:"الكمية",k:"stock",p:"0",t:"number"}].map(f=>(
          <div key={f.k} style={{marginBottom:12}}>
            <p className="lbl">{f.l}</p>
            <input className="inp" placeholder={f.p} type={f.t} value={form[f.k]} onChange={e=>setForm(x=>({...x,[f.k]:e.target.value}))}/>
          </div>
        ))}
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <p className="lbl" style={{margin:0}}>تاريخ الصلاحية</p>
            <button onClick={()=>setForm(f=>({...f,noExpiry:!f.noExpiry}))}
              style={{background:form.noExpiry?"rgba(35,134,54,0.2)":"rgba(255,255,255,0.06)",border:form.noExpiry?"1px solid #2ea043":"1px solid rgba(255,255,255,0.1)",borderRadius:8,padding:"4px 10px",color:form.noExpiry?"#3fb950":"#7d8590",fontFamily:"'Cairo',sans-serif",fontSize:11,cursor:"pointer",fontWeight:600}}>
              {form.noExpiry?"✅ بلا تاريخ":"⊘ بلا تاريخ"}
            </button>
          </div>
          {!form.noExpiry?(
            <div style={{display:"flex",gap:7}}>
              <div style={{flex:1,textAlign:"center"}}><p style={{color:"#484f58",fontSize:10,marginBottom:4}}>اليوم</p><input className="inp" placeholder="DD" maxLength={2} value={form.exDay} onChange={e=>setForm(f=>({...f,exDay:e.target.value.replace(/[^0-9]/g,"")}))} inputMode="numeric" pattern="[0-9]*" style={{textAlign:"center",padding:"10px 4px"}}/></div>
              <div style={{flex:1,textAlign:"center"}}><p style={{color:"#484f58",fontSize:10,marginBottom:4}}>الشهر</p><input className="inp" placeholder="MM" maxLength={2} value={form.exMonth} onChange={e=>setForm(f=>({...f,exMonth:e.target.value.replace(/[^0-9]/g,"")}))} inputMode="numeric" pattern="[0-9]*" style={{textAlign:"center",padding:"10px 4px"}}/></div>
              <div style={{flex:2,textAlign:"center"}}><p style={{color:"#484f58",fontSize:10,marginBottom:4}}>السنة</p><input className="inp" placeholder="YYYY" maxLength={4} value={form.exYear} onChange={e=>setForm(f=>({...f,exYear:e.target.value.replace(/[^0-9]/g,"")}))} inputMode="numeric" pattern="[0-9]*" style={{textAlign:"center",padding:"10px 4px"}}/></div>
            </div>
          ):(
            <div style={{background:"rgba(35,134,54,0.08)",border:"1px solid rgba(35,134,54,0.2)",borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
              <p style={{color:"#3fb950",fontSize:12,fontWeight:600}}>✅ المنتج بلا تاريخ صلاحية</p>
            </div>
          )}
        </div>
        <div style={{marginBottom:16}}>
          <p className="lbl">الفئة</p>
          <select className="inp" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {["غذائي","ألبان","مواد تنظيف","مشروبات","أخرى"].map(x=><option key={x} value={x}>{x}</option>)}
          </select>
        </div>
        {err&&<p style={{color:"#f85149",fontSize:12,marginBottom:12}}>{err}</p>}
        <button className="btn btn-p" onClick={save}>{mode==="add"?"✅ إضافة":"💾 حفظ التعديل"}</button>
      </div>
    </div>
  );

  return(
    <div className="sc">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700}}>📦 المنتجات ({allEntries.length})</h2>
        <button className="btn btn-p btn-sm" onClick={openAdd}>+ إضافة</button>
      </div>

      {/* بحث في المخزن */}
      <div style={{position:"relative",marginBottom:11}}>
        <input className="inp"
          placeholder="🔍 ابحث بالاسم أو آخر أرقام الكود..."
          value={search} onChange={e=>setSearch(e.target.value)}
          style={{paddingRight:36}}/>
        {search&&<button onClick={()=>setSearch("")}
          style={{position:"absolute",left:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#7d8590",fontSize:16,cursor:"pointer"}}>✕</button>}
      </div>

      {sorted.length===0
        ?<div className="emp card"><div className="emp-i">📦</div>
          <p className="emp-t">{search?"لا توجد نتائج":"لا توجد منتجات"}</p></div>
        :sorted.map(([code,p])=>{
          const d=daysUntil(p.expiry==="2099-12-31"?"9999-12-31":p.expiry);
          const low=p.stock<=(sets?.lowStock||10);
          return(
            <div key={code} className="prow">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap",marginBottom:3}}>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{p.name}</p>
                    {p.expiry!=="2099-12-31"&&d<0&&<span className="tag tr">منتهي</span>}
                    {p.expiry!=="2099-12-31"&&d>=0&&d<=(sets?.expiryDays||30)&&<span className="tag to">ينتهي قريباً</span>}
                    {low&&<span className="tag tr">مخزون منخفض</span>}
                  </div>
                  <p style={{color:"#484f58",fontSize:10}}>
                    {code}  ·  كمية: {p.stock}  ·  {p.expiry==="2099-12-31"?"بلا تاريخ":fmtDate(p.expiry)}
                  </p>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                  <p style={{color:"#3fb950",fontWeight:900,fontSize:13}}>{p.price.toFixed(2)} د.ل</p>
                  <div style={{display:"flex",gap:5}}>
                    <button className="btn btn-s btn-sm" onClick={()=>openEdit(code)}>✏️</button>
                    <button className="btn btn-d btn-sm" onClick={()=>del(code)}>🗑</button>
                  </div>
                </div>
              </div>
            </div>
          );
        })
      }
    </div>
  );
}

function RestockTab({prods,saveProds}){
  const [scan,setScan]=useState(false);
  const [form,setForm]=useState({code:"",name:"",price:"",stock:"",
    exDay:"",exMonth:"",exYear:"",noExpiry:false,category:"غذائي"});
  const [isExist,setIsExist]=useState(false);
  const [done,setDone]=useState(false);
  const [doneStock,setDoneStock]=useState(0);
  const [err,setErr]=useState("");

  const buildExpiry=()=>{
    if(form.noExpiry)return "2099-12-31";
    const d=String(form.exDay).padStart(2,"0");
    const m=String(form.exMonth).padStart(2,"0");
    const y=form.exYear;
    if(!d||!m||!y||y.length<4)return "";
    return `${y}-${m}-${d}`;
  };

  const parseExpiry=exp=>{
    if(!exp||exp==="2099-12-31")return{exDay:"",exMonth:"",exYear:"",noExpiry:true};
    const p=exp.split("-");
    return{exDay:p[2]||"",exMonth:p[1]||"",exYear:p[0]||"",noExpiry:false};
  };

  const onCode=code=>{
    const t=code.trim();setDone(false);setErr("");
    const ex=prods[t];
    if(ex){
      setIsExist(true);
      setForm({code:t,name:ex.name,price:ex.price,stock:"",
        category:ex.category||"غذائي",...parseExpiry(ex.expiry)});
    } else {
      setIsExist(false);
      setForm({code:t,name:"",price:"",stock:"",
        exDay:"",exMonth:"",exYear:"",noExpiry:false,category:"غذائي"});
    }
  };

  const save=()=>{
    if(!form.code.trim())return setErr("أدخل كود المنتج");
    if(!isExist&&!form.name.trim())return setErr("أدخل اسم المنتج");
    if(!form.price||isNaN(form.price))return setErr("أدخل السعر");
    if(!form.stock||isNaN(form.stock)||parseInt(form.stock)<=0)return setErr("أدخل الكمية");
    const expiry=buildExpiry();
    if(!form.noExpiry&&!expiry)return setErr("أدخل تاريخ الصلاحية أو اختر بلا تاريخ");
    const upd={...prods};
    const addQty=parseInt(form.stock);
    const newStock=isExist?(upd[form.code].stock+addQty):addQty;
    if(isExist) upd[form.code]={...upd[form.code],price:parseFloat(form.price),expiry,stock:newStock};
    else upd[form.code.trim()]={name:form.name.trim(),price:parseFloat(form.price),
      stock:addQty,expiry,category:form.category};
    saveProds(upd);setDoneStock(newStock);setDone(true);setErr("");
    setTimeout(()=>{
      setForm({code:"",name:"",price:"",stock:"",exDay:"",exMonth:"",exYear:"",noExpiry:false,category:"غذائي"});
      setIsExist(false);setDone(false);
    },2500);
  };

  return(
    <div className="sc">
      {scan&&<BarcodeScanner onScan={c=>{setScan(false);onCode(c);}} onClose={()=>setScan(false)}/>}
      <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700,marginBottom:13}}>➕ زيادة المخزون</h2>
      <div className="card">

        {/* كود المنتج */}
        <div style={{marginBottom:12}}>
          <p className="lbl">كود / باركود المنتج</p>
          <div style={{display:"flex",gap:7}}>
            <input className="inp" placeholder="أدخل أو امسح..." value={form.code}
              onChange={e=>onCode(e.target.value)} style={{flex:1}}/>
            <button className="btn btn-s btn-sm" style={{flexShrink:0,fontSize:18}}
              onClick={()=>setScan(true)}>📷</button>
          </div>
        </div>

        {/* حالة المنتج */}
        {isExist&&form.code&&(
          <div className="card card-g" style={{marginBottom:12,padding:"9px 13px"}}>
            <p style={{color:"#2ea043",fontWeight:700,fontSize:13}}>✅ {form.name}</p>
            <p style={{color:"#7d8590",fontSize:11,marginTop:2}}>المخزون الحالي: {prods[form.code]?.stock} وحدة</p>
          </div>
        )}
        {!isExist&&form.code&&(
          <div className="card card-o" style={{marginBottom:12,padding:"9px 13px"}}>
            <p style={{color:"#f0883e",fontWeight:700,fontSize:13}}>🆕 منتج جديد — يُضاف للمخزون</p>
          </div>
        )}

        {/* اسم المنتج - للمنتجات الجديدة فقط */}
        {!isExist&&(
          <div style={{marginBottom:12}}>
            <p className="lbl">اسم المنتج</p>
            <input className="inp" placeholder="اسم المنتج" value={form.name}
              onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
          </div>
        )}

        {/* السعر */}
        <div style={{marginBottom:12}}>
          <p className="lbl">السعر (د.ل)</p>
          <input className="inp" placeholder="0.00" type="number" value={form.price}
            onChange={e=>setForm(f=>({...f,price:e.target.value}))}/>
        </div>

        {/* تاريخ الصلاحية - ثلاث خانات يدوية */}
        <div style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <p className="lbl" style={{margin:0}}>تاريخ الصلاحية</p>
            <button onClick={()=>setForm(f=>({...f,noExpiry:!f.noExpiry}))}
              style={{background:form.noExpiry?"rgba(35,134,54,0.2)":"rgba(255,255,255,0.06)",
                border:form.noExpiry?"1px solid #2ea043":"1px solid rgba(255,255,255,0.1)",
                borderRadius:8,padding:"4px 10px",
                color:form.noExpiry?"#3fb950":"#7d8590",
                fontFamily:"'Cairo',sans-serif",fontSize:11,cursor:"pointer",fontWeight:600}}>
              {form.noExpiry?"✅ بلا تاريخ":"⊘ بلا تاريخ"}
            </button>
          </div>
          {!form.noExpiry?(
            <div style={{display:"flex",gap:7}}>
              <div style={{flex:1,textAlign:"center"}}>
                <p style={{color:"#484f58",fontSize:10,marginBottom:4}}>اليوم</p>
                <input className="inp" placeholder="DD" maxLength={2} value={form.exDay}
                  onChange={e=>setForm(f=>({...f,exDay:e.target.value.replace(/[^0-9]/g,"")}))} inputMode="numeric" pattern="[0-9]*"
                  style={{textAlign:"center",padding:"10px 4px"}}/>
              </div>
              <div style={{flex:1,textAlign:"center"}}>
                <p style={{color:"#484f58",fontSize:10,marginBottom:4}}>الشهر</p>
                <input className="inp" placeholder="MM" maxLength={2} value={form.exMonth}
                  onChange={e=>setForm(f=>({...f,exMonth:e.target.value.replace(/[^0-9]/g,"")}))} inputMode="numeric" pattern="[0-9]*"
                  style={{textAlign:"center",padding:"10px 4px"}}/>
              </div>
              <div style={{flex:2,textAlign:"center"}}>
                <p style={{color:"#484f58",fontSize:10,marginBottom:4}}>السنة</p>
                <input className="inp" placeholder="YYYY" maxLength={4} value={form.exYear}
                  onChange={e=>setForm(f=>({...f,exYear:e.target.value.replace(/[^0-9]/g,"")}))} inputMode="numeric" pattern="[0-9]*"
                  style={{textAlign:"center",padding:"10px 4px"}}/>
              </div>
            </div>
          ):(
            <div style={{background:"rgba(35,134,54,0.08)",border:"1px solid rgba(35,134,54,0.2)",
              borderRadius:8,padding:"8px 12px",textAlign:"center"}}>
              <p style={{color:"#3fb950",fontSize:12,fontWeight:600}}>✅ المنتج بلا تاريخ صلاحية</p>
            </div>
          )}
        </div>

        {/* الكمية */}
        <div style={{marginBottom:12}}>
          <p className="lbl">{isExist?"الكمية المضافة":"الكمية الأولية"}</p>
          <input className="inp" placeholder="0" type="number" min="1" value={form.stock}
            onChange={e=>setForm(f=>({...f,stock:e.target.value}))}/>
        </div>

        {/* الفئة - للمنتجات الجديدة */}
        {!isExist&&(
          <div style={{marginBottom:12}}>
            <p className="lbl">الفئة</p>
            <select className="inp" value={form.category}
              onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
              {["غذائي","ألبان","مواد تنظيف","مشروبات","أخرى"].map(x=><option key={x} value={x}>{x}</option>)}
            </select>
          </div>
        )}

        {err&&<p style={{color:"#f85149",fontSize:12,marginBottom:11,fontWeight:600}}>{err}</p>}

        {done
          ?<div className="card card-g" style={{textAlign:"center",padding:"12px"}}>
            <p style={{color:"#2ea043",fontWeight:700,fontSize:14}}>✅ تم بنجاح</p>
            <p style={{color:"#7d8590",fontSize:12,marginTop:4}}>المخزون الجديد: {doneStock} وحدة</p>
          </div>
          :<button className="btn btn-p" onClick={save} disabled={!form.code}>
            {isExist?"📦 إضافة للمخزون":"✅ إضافة منتج جديد"}
          </button>
        }
      </div>

      {/* أقل مخزوناً */}
      <div style={{marginTop:14}}>
        <p style={{color:"#7d8590",fontSize:12,fontWeight:700,marginBottom:8}}>📊 أقل مخزوناً</p>
        {Object.entries(prods).sort((a,b)=>a[1].stock-b[1].stock).slice(0,5).map(([code,p])=>(
          <div key={code} className="prow" style={{cursor:"pointer"}} onClick={()=>onCode(code)}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{p.name}</p>
                <p style={{color:"#484f58",fontSize:10}}>كود: {code} — اضغط للتعبئة</p>
              </div>
              <div style={{textAlign:"center"}}>
                <p style={{color:p.stock<=5?"#f85149":p.stock<=10?"#f0883e":"#3fb950",fontWeight:900,fontSize:17}}>{p.stock}</p>
                <p style={{color:"#484f58",fontSize:10}}>وحدة</p>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SalesTab({sales, setSalesExt, prods, saveProds}){
  const [period,setPeriod]=useState("day");
  const [open,setOpen]=useState(null);
  const [selected,setSelected]=useState(new Set());
  const [selectMode,setSelectMode]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null);
  const [editSale,setEditSale]=useState(null); // فاتورة قيد التعديل
  const [editItems,setEditItems]=useState([]);

  const now=Date.now();
  const periods={
    day:  {label:"اليوم",     ms:86400000,    icon:"📅"},
    week: {label:"الأسبوع",  ms:86400000*7,  icon:"📆"},
    month:{label:"الشهر",    ms:86400000*30, icon:"🗓️"},
    year: {label:"السنة",    ms:86400000*365,icon:"📊"},
  };
  const filtered=sales.filter(s=>now-s.ts<periods[period].ms);
  const grand=filtered.reduce((s,x)=>s+x.total,0);

  const delOne=id=>{
    const u=sales.filter(s=>s.id!==id);
    setSalesExt(u);setOpen(null);setConfirmDel(null);
  };
  const delSelected=()=>{
    const u=sales.filter(s=>!selected.has(s.id));
    setSalesExt(u);setSelected(new Set());setSelectMode(false);setConfirmDel(null);
  };
  const toggleSel=id=>{
    const s=new Set(selected);
    s.has(id)?s.delete(id):s.add(id);
    setSelected(s);
  };

  // ── فتح تعديل الفاتورة ──
  const openEdit=sale=>{
    setEditSale(sale);
    setEditItems(sale.items.map(i=>({...i})));
  };
  const editQty=(code,d)=>{
    setEditItems(prev=>prev.map(i=>{
      if(i.code!==code)return i;
      const maxStock=(prods[code]?.stock??0)+i.qty; // المخزون + ما في الفاتورة
      const nq=Math.max(0,Math.min(maxStock,i.qty+d));
      return{...i,qty:nq,total:+(i.price*nq).toFixed(2)};
    }).filter(i=>i.qty>0));
  };
  const saveEdit=()=>{
    if(editItems.length===0)return;
    // احسب الفرق في المخزون
    if(prods&&saveProds){
      const upd={...prods};
      // أعد المخزون القديم
      editSale.items.forEach(old=>{if(upd[old.code])upd[old.code]={...upd[old.code],stock:upd[old.code].stock+old.qty};});
      // اخصم الجديد
      editItems.forEach(ni=>{if(upd[ni.code])upd[ni.code]={...upd[ni.code],stock:Math.max(0,upd[ni.code].stock-ni.qty)};});
      saveProds(upd);
    }
    const newTotal=+editItems.reduce((s,i)=>s+i.total,0).toFixed(2);
    const updated={...editSale,items:editItems,total:newTotal,edited:true};
    const u=sales.map(s=>s.id===editSale.id?updated:s);
    setSalesExt(u);
    setEditSale(null);setEditItems([]);
  };

  // ── شاشة تعديل الفاتورة ──
  if(editSale)return(
    <div className="sc">
      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14}}>
        <button className="btn btn-s btn-sm" onClick={()=>{setEditSale(null);setEditItems([]); }}>← رجوع</button>
        <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700}}>✏️ تعديل الفاتورة</h2>
      </div>
      <div className="card" style={{marginBottom:12}}>
        <p style={{color:"#7d8590",fontSize:11,marginBottom:10}}>{editSale.id} · {fmtTime(editSale.ts)}</p>
        {/* رأس الجدول */}
        <div style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:8,
          borderBottom:"2px solid rgba(48,54,61,0.6)",paddingBottom:7,marginBottom:7}}>
          <p style={{color:"#7d8590",fontSize:11,fontWeight:700}}>المنتج</p>
          <p style={{color:"#7d8590",fontSize:11,fontWeight:700,textAlign:"center",minWidth:80}}>الكمية</p>
          <p style={{color:"#7d8590",fontSize:11,fontWeight:700,textAlign:"left",minWidth:60}}>السعر</p>
        </div>
        {editItems.map(it=>(
          <div key={it.code} style={{display:"grid",gridTemplateColumns:"1fr auto auto",
            gap:8,alignItems:"center",padding:"7px 0",
            borderBottom:"1px solid rgba(48,54,61,0.3)"}}>
            <div>
              <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{it.name}</p>
              <p style={{color:"#484f58",fontSize:10}}>{it.price.toFixed(2)} د.ل/قطعة</p>
            </div>
            <div className="qc" style={{minWidth:80}}>
              <button className="qb" onClick={()=>editQty(it.code,-1)}>−</button>
              <span className="qn">{it.qty}</span>
              <button className="qb" onClick={()=>editQty(it.code,1)}>+</button>
            </div>
            <p style={{color:"#3fb950",fontWeight:900,fontSize:13,minWidth:60,textAlign:"left"}}>
              {it.total.toFixed(2)}
            </p>
          </div>
        ))}
        {editItems.length===0&&(
          <p style={{color:"#f85149",fontSize:12,textAlign:"center",padding:"10px 0"}}>
            ⚠️ الفاتورة فارغة — جميع المنتجات أُزيلت
          </p>
        )}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:12,
          borderTop:"2px solid rgba(48,54,61,0.6)",paddingTop:10}}>
          <p style={{color:"#7d8590",fontWeight:700,fontSize:14}}>المجموع</p>
          <p style={{color:"#3fb950",fontWeight:900,fontSize:18}}>
            {editItems.reduce((s,i)=>s+i.total,0).toFixed(2)} د.ل
          </p>
        </div>
      </div>
      <div style={{display:"flex",gap:8}}>
        <button className="btn btn-p" style={{flex:1}} onClick={saveEdit} disabled={editItems.length===0}>
          💾 حفظ التعديل
        </button>
        <button className="btn btn-d" style={{flex:1}} onClick={()=>setConfirmDel(editSale.id)}>
          🗑 حذف الفاتورة
        </button>
      </div>
      {confirmDel&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",
          display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
          <div className="card" style={{width:"100%",maxWidth:320,textAlign:"center"}}>
            <p style={{color:"#e6edf3",fontWeight:700,fontSize:15,marginBottom:8}}>حذف الفاتورة؟</p>
            <p style={{color:"#7d8590",fontSize:12,marginBottom:14}}>سيتم استرجاع المخزون تلقائياً</p>
            <div style={{display:"flex",gap:8}}>
              <button className="btn btn-d" style={{flex:1}} onClick={()=>{
                // استرجاع المخزون عند حذف الفاتورة
                if(prods&&saveProds){
                  const upd={...prods};
                  editSale.items.forEach(it=>{if(upd[it.code])upd[it.code]={...upd[it.code],stock:upd[it.code].stock+it.qty};});
                  saveProds(upd);
                }
                delOne(confirmDel);setEditSale(null);setEditItems([]);
              }}>نعم، احذف</button>
              <button className="btn btn-s" style={{flex:1}} onClick={()=>setConfirmDel(null)}>إلغاء</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  return(
    <div className="sc">
      <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700,marginBottom:13}}>🧾 سجل المبيعات</h2>

      {/* أزرار الفترات */}
      <div style={{display:"flex",gap:6,marginBottom:13,overflowX:"auto",paddingBottom:4}}>
        {Object.entries(periods).map(([key,p])=>(
          <button key={key} onClick={()=>{setPeriod(key);setOpen(null);setSelectMode(false);setSelected(new Set());}}
            style={{flexShrink:0,
              background:period===key?"linear-gradient(135deg,#238636,#2ea043)":"rgba(255,255,255,0.06)",
              border:period===key?"none":"1px solid rgba(255,255,255,0.09)",
              borderRadius:20,padding:"7px 14px",color:period===key?"#fff":"#7d8590",
              fontFamily:"'Cairo',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer"}}>
            {p.icon} {p.label}
          </button>
        ))}
      </div>

      {/* ملخص */}
      {filtered.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:13}}>
          {[
            {l:"الفواتير",v:filtered.length,u:"فاتورة",c:"#3fb950"},
            {l:"المنتجات",v:filtered.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0),u:"قطعة",c:"#60a5fa"},
            {l:"الإجمالي",v:grand.toFixed(2),u:"د.ل",c:"#f0883e"},
          ].map(({l,v,u,c})=>(
            <div key={l} style={{background:"rgba(22,27,34,0.9)",border:"1px solid rgba(48,54,61,0.7)",
              borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
              <p style={{color:c,fontWeight:900,fontSize:18}}>{v}</p>
              <p style={{color:"#484f58",fontSize:10}}>{u}</p>
              <p style={{color:"#7d8590",fontSize:10,marginTop:2}}>{l}</p>
            </div>
          ))}
        </div>
      )}

      {/* أزرار التحديد والمسح */}
      {filtered.length>0&&(
        <div style={{display:"flex",gap:7,marginBottom:10}}>
          <button className="btn btn-s btn-sm" style={{flex:1}}
            onClick={()=>{setSelectMode(!selectMode);setSelected(new Set());}}>
            {selectMode?"إلغاء التحديد":"☑️ تحديد للمسح"}
          </button>
          {selectMode&&selected.size>0&&(
            <button className="btn btn-d btn-sm" style={{flex:1}}
              onClick={()=>setConfirmDel("selected")}>
              🗑 مسح ({selected.size})
            </button>
          )}
          {selectMode&&(
            <button className="btn btn-s btn-sm"
              onClick={()=>setSelected(new Set(filtered.map(s=>s.id)))}>
              تحديد الكل
            </button>
          )}
        </div>
      )}

      {/* تنبيه المسح التلقائي */}
      <div style={{background:"rgba(35,134,54,0.06)",border:"1px solid rgba(35,134,54,0.2)",
        borderRadius:10,padding:"8px 12px",marginBottom:12,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:14}}>🔄</span>
        <p style={{color:"#7d8590",fontSize:10}}>
          {period==="day"?"تُمسح بعد 24 ساعة":period==="week"?"تُمسح بعد 7 أيام":
           period==="month"?"تُمسح بعد 30 يوماً":"تُمسح بعد 365 يوماً"} — تلقائياً
        </p>
      </div>

      {filtered.length===0
        ?<div className="emp card"><div className="emp-i">🧾</div>
          <p className="emp-t">لا توجد مبيعات في {periods[period].label}</p></div>
        :filtered.map(sale=>(
          <div key={sale.id} className="inv-card"
            onClick={()=>!selectMode&&setOpen(open===sale.id?null:sale.id)}>
            <div className="inv-head">
              {selectMode&&(
                <input type="checkbox" checked={selected.has(sale.id)}
                  onChange={()=>toggleSel(sale.id)}
                  style={{width:18,height:18,marginLeft:8,accentColor:"#2ea043"}}
                  onClick={e=>e.stopPropagation()}/>
              )}
              <div style={{flex:1}}>
                <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>
                  {sale.id} {sale.edited&&<span style={{color:"#f0883e",fontSize:10}}>✏️ معدّلة</span>}
                </p>
                <p style={{color:"#7d8590",fontSize:10,marginTop:2}}>🕐 {fmtTime(sale.ts)}</p>
              </div>
              <div style={{textAlign:"center",marginLeft:8}}>
                <p style={{color:"#3fb950",fontWeight:900,fontSize:15}}>{sale.total.toFixed(2)} د.ل</p>
                <p style={{color:"#484f58",fontSize:10}}>{sale.items.length} صنف {open===sale.id?"▲":"▼"}</p>
              </div>
            </div>

            {open===sale.id&&(
              <div className="inv-body">
                <div style={{height:1,background:"rgba(48,54,61,0.45)",margin:"0 0 8px"}}/>
                {/* رأس الجدول */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 40px 70px",
                  gap:4,paddingBottom:6,borderBottom:"1px solid rgba(48,54,61,0.4)",marginBottom:6}}>
                  <p style={{color:"#7d8590",fontSize:10,fontWeight:700}}>المنتج</p>
                  <p style={{color:"#7d8590",fontSize:10,fontWeight:700,textAlign:"center"}}>العدد</p>
                  <p style={{color:"#7d8590",fontSize:10,fontWeight:700,textAlign:"left"}}>السعر</p>
                </div>
                {/* صفوف المنتجات */}
                {sale.items.map((it,i)=>(
                  <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 40px 70px",
                    gap:4,alignItems:"center",padding:"5px 0",
                    borderBottom:"1px solid rgba(48,54,61,0.2)"}}>
                    <p style={{color:"#e6edf3",fontWeight:600,fontSize:12}}>{it.name}</p>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:12,textAlign:"center"}}>{it.qty}</p>
                    <p style={{color:"#3fb950",fontWeight:700,fontSize:12,textAlign:"left"}}>{it.total.toFixed(2)} د.ل</p>
                  </div>
                ))}
                {/* المجموع */}
                <div style={{display:"flex",justifyContent:"space-between",
                  marginTop:9,borderTop:"2px solid rgba(48,54,61,0.5)",paddingTop:8}}>
                  <span style={{color:"#7d8590",fontSize:13,fontWeight:700}}>المجموع</span>
                  <span style={{color:"#3fb950",fontSize:15,fontWeight:900}}>{sale.total.toFixed(2)} د.ل</span>
                </div>
                {/* أزرار التعديل والحذف */}
                <div style={{display:"flex",gap:7,marginTop:10}}>
                  <button className="btn btn-s btn-sm" style={{flex:1}}
                    onClick={e=>{e.stopPropagation();openEdit(sale);}}>
                    ✏️ تعديل / إرجاع
                  </button>
                  <button className="btn btn-d btn-sm" style={{flex:1}}
                    onClick={e=>{e.stopPropagation();setConfirmDel(sale.id);}}>
                    🗑 حذف
                  </button>
                </div>
              </div>
            )}
          </div>
        ))
      }

      {/* تأكيد الحذف */}
      {confirmDel&&confirmDel!=="selected"&&!editSale&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",
          display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
          <div className="card" style={{width:"100%",maxWidth:300,textAlign:"center"}}>
            <p style={{color:"#e6edf3",fontWeight:700,fontSize:15,marginBottom:8}}>حذف هذه الفاتورة؟</p>
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button className="btn btn-d" style={{flex:1}} onClick={()=>delOne(confirmDel)}>نعم</button>
              <button className="btn btn-s" style={{flex:1}} onClick={()=>setConfirmDel(null)}>لا</button>
            </div>
          </div>
        </div>
      )}
      {confirmDel==="selected"&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",
          display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
          <div className="card" style={{width:"100%",maxWidth:300,textAlign:"center"}}>
            <p style={{color:"#e6edf3",fontWeight:700,fontSize:15,marginBottom:8}}>
              حذف {selected.size} فاتورة؟
            </p>
            <div style={{display:"flex",gap:8,marginTop:12}}>
              <button className="btn btn-d" style={{flex:1}} onClick={delSelected}>نعم</button>
              <button className="btn btn-s" style={{flex:1}} onClick={()=>setConfirmDel(null)}>لا</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function ReportsTab({sales,prods,sets,user}){
  const [genStatus,setGenStatus]=useState(""); // "","loading","done","error"
  const now=Date.now();

  // ── بناء PDF بالـ HTML ثم طباعة ──
  function buildHTML(title, bodyHTML){
    return `<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"/>
<title>${title}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}

  function downloadPDF(html, filename){
    const w=window.open("","_blank");
    if(!w){setGenStatus("error");return;}
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(()=>{
      w.print();
      setGenStatus("done");
      setTimeout(()=>setGenStatus(""),3000);
    },600);
  }

  // ── تقرير الفاتورة الواحدة ──
  function printInvoice(sale){
    const rows=sale.items.map(it=>`
      <tr>
        <td>${it.name}</td>
        <td style="text-align:center">${it.qty}</td>
        <td style="text-align:center">${it.price.toFixed(2)}</td>
        <td style="text-align:center;font-weight:bold;color:#1a5c2a">${it.total.toFixed(2)}</td>
      </tr>`).join("");
    const body=`
      <h1>🧾 فاتورة بيّاع</h1>
      <div class="sub">${sale.id} · ${new Date(sale.ts).toLocaleString("ar-SA")}${sale.edited?" · (معدّلة)":""}</div>
      <table>
        <tr><th>المنتج</th><th style="text-align:center">العدد</th><th style="text-align:center">سعر القطعة</th><th style="text-align:center">الإجمالي</th></tr>
        ${rows}
        <tr class="total">
          <td colspan="3" style="text-align:left;font-weight:bold">المجموع الكلي</td>
          <td style="text-align:center;font-size:15px;color:#1a5c2a">${sale.total.toFixed(2)} د.ل</td>
        </tr>
      </table>`;
    downloadPDF(buildHTML("فاتورة - "+sale.id, body),"invoice.pdf");
  }

  // ── تقرير مبيعات اليوم ──
  function printDailySales(){
    setGenStatus("loading");
    const today=sales.filter(s=>now-s.ts<86400000);
    if(today.length===0){setGenStatus("error");setTimeout(()=>setGenStatus(""),2000);return;}
    const rows=today.map(s=>`
      <tr>
        <td>${s.id}</td>
        <td>${new Date(s.ts).toLocaleTimeString("ar-SA")}</td>
        <td style="text-align:center">${s.items.reduce((a,i)=>a+i.qty,0)}</td>
        <td style="text-align:center;font-weight:bold;color:#1a5c2a">${s.total.toFixed(2)} د.ل</td>
      </tr>`).join("");
    const total=today.reduce((s,x)=>s+x.total,0);
    const body=`
      <h1>📅 تقرير مبيعات اليوم</h1>
      <div class="sub">${new Date().toLocaleDateString("ar-SA")} · ${today.length} فاتورة</div>
      <table>
        <tr><th>رقم الفاتورة</th><th>الوقت</th><th style="text-align:center">عدد الأصناف</th><th style="text-align:center">المبلغ</th></tr>

          <td style="text-align:center;font-size:15px;color:#1a5c2a">${total.toFixed(2)} د.ل</td>
        </tr>
      </table>`;
    downloadPDF(buildHTML("تقرير اليوم", body),"daily.pdf");

      .filter(([,p])=>{
        if(!p.expiry||p.expiry==="2099-12-31")return false;
        const d=daysUntil(p.expiry);
        return d<=days;
      })
      .sort((a,b)=>new Date(a[1].expiry)-new Date(b[1].expiry));
    if(expiring.length===0){setGenStatus("error");setTimeout(()=>setGenStatus(""),2000);return;}
    const rows=expiring.map(([code,p])=>{
      const d=daysUntil(p.expiry);
      return`<tr>
        <td>${p.name}</td>
        <td style="text-align:center;font-family:monospace">${code}</td>
        <td style="text-align:center">${p.stock}</td>
        <td style="text-align:center">${fmtDate(p.expiry)}</td>

      </tr>`;}).join("");
    const body=`
      <h1>⏰ تقرير قريب انتهاء الصلاحية</h1>

    downloadPDF(buildHTML("تقرير انتهاء الصلاحية", body),"expiry.pdf");

      {/* تقارير المبيعات */}
      <div className="card" style={{marginBottom:12}}>
        <p style={{color:"#7d8590",fontSize:11,fontWeight:700,marginBottom:12}}>🧾 تقارير المبيعات</p>

        <div style={{background:"rgba(22,27,34,0.6)",borderRadius:10,padding:"12px",marginBottom:10}}>

            <div>
              <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>📅 مبيعات اليوم</p>
              <p style={{color:"#7d8590",fontSize:11}}>{todaySales.length} فاتورة · {todaySales.reduce((s,x)=>s+x.total,0).toFixed(2)} د.ل</p>
            </div>
            <button className="btn btn-p btn-sm" onClick={printDailySales}>🖨️ طباعة</button>

        <div style={{background:"rgba(22,27,34,0.6)",borderRadius:10,padding:"12px"}}>

      {/* تقارير المخزون */}

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

function App(){
  const [user,setUser]=useState(null);
  const [booting,setBooting]=useState(true);
  const [tab,setTab]=useState("pos");
  const [prods,setProds]=useState({});
  const [sets,setSets]=useState(INIT_SETS);
  const [notifs,setNotifs]=useState([]);
  const [unread,setUnread]=useState(0);
  const [sales,setSales]=useState([]);

  useEffect(()=>{
    injectCSS();

    // ── تحميل مكتبات المسح ──
    function loadScript(src){
      if(!document.querySelector(`script[src="${src}"]`)){
        const s=document.createElement("script");s.src=src;document.head.appendChild(s);
      }
    }
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js");
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js");

    // ── انتظر Firebase ثم حمّل البيانات ──
    async function waitForFirebase(maxMs=8000){
      const t0=Date.now();
      return new Promise(resolve=>{
        function check(){
          if(_db){resolve(true);return;}
          if(Date.now()-t0>maxMs){resolve(false);return;}
          setTimeout(check,200);
        }
        check();
      });
    }

    async function boot(){
      // 1) استعد الجلسة من localStorage
      const sess=sg("session:user");
      if(!sess){setBooting(false);return;}

      // 2) انتظر Firebase (حتى 8 ثوانٍ)
      const fbReady=await waitForFirebase(8000);

      // 3) تحقق من المستخدم
      let users=sg("admin:users")||{};
      if(fbReady&&_db){
        try{
          const snap=await _db.collection("sellers").get();
          const fbUsers={};
          snap.forEach(d=>{if(d.data().profile)fbUsers[d.id]={...d.data().profile};});
          if(Object.keys(fbUsers).length>0){users=fbUsers;ss("admin:users",fbUsers);}
        }catch(e){console.warn("getUsers boot:",e);}
      }
      const u=users[sess.phone];
      if(!u||!u.subscribed||(!u.subExpiry||daysUntil(u.subExpiry)<0)){
        setBooting(false);return;
      }

      // 4) عيّن البائع النشط
      _activePhone=sess.phone;
      setActivePhone(sess.phone);
      setUser({...sess,subExpiry:u.subExpiry});

      // 5) حمّل البيانات: Firebase أولاً إذا متاح، localStorage كـ fallback
      if(fbReady&&_db){
        try{
          const base=_db.collection("sellers").doc(sess.phone).collection("data");
          const [ps,ss2,ns,rs]=await Promise.all([
            base.doc("products:all").get(),
            base.doc("settings:app").get(),
            base.doc("notifs:list").get(),
            base.doc("sales:list").get(),
          ]);
          if(ps.exists){const v=ps.data().v;setProds(v||{});ss(_lk("products:all",sess.phone),v||{});}
          else{const lp=sg(_lk("products:all",sess.phone));setProds(lp||{});}
          if(ss2.exists){const v=ss2.data().v;setSets(v||INIT_SETS);ss(_lk("settings:app",sess.phone),v);}
          else{const ls=sg(_lk("settings:app",sess.phone));setSets(ls||INIT_SETS);}
          if(ns.exists){const v=ns.data().v||[];setNotifs(v);setUnread(v.filter(x=>!x.read).length);ss(_lk("notifs:list",sess.phone),v);}
          else{const ln=sg(_lk("notifs:list",sess.phone));if(ln){setNotifs(ln);setUnread(ln.filter(x=>!x.read).length);}}
          if(rs.exists){
            const v=rs.data().v||[];
            const now=Date.now();
            const fresh=v.filter(x=>now-x.ts<86400000*366);
            setSales(fresh);ss(_lk("sales:list",sess.phone),fresh);
          } else {
            const lr=sg(_lk("sales:list",sess.phone));
            if(lr){const now=Date.now();setSales(lr.filter(x=>now-x.ts<86400000*366));}
          }
        }catch(e){
          console.warn("Firebase load error:",e);
          // fallback to localStorage
          const lp=sg(_lk("products:all",sess.phone));setProds(lp||{});
          const ls=sg(_lk("settings:app",sess.phone));setSets(ls||INIT_SETS);
        }
      } else {
        // Firebase غير متاح - استخدم localStorage
        const lp=sg(_lk("products:all",sess.phone));setProds(lp||{});
        const ls=sg(_lk("settings:app",sess.phone));setSets(ls||INIT_SETS);
        const ln=sg(_lk("notifs:list",sess.phone));if(ln){setNotifs(ln);setUnread(ln.filter(x=>!x.read).length);}
        const lr=sg(_lk("sales:list",sess.phone));
        if(lr){const now=Date.now();setSales(lr.filter(x=>now-x.ts<86400000*366));}
      }

      setBooting(false);

      // 6) مزامنة فورية Real-time بعد التحميل
      if(fbReady&&_db){
        try{
          const ph=sess.phone;
          const base=_db.collection("sellers").doc(ph).collection("data");
          base.doc("products:all").onSnapshot(snap=>{
            if(snap.exists&&ph===_activePhone){
              const v=snap.data().v;if(v){setProds(v);ss(_lk("products:all",ph),v);}
            }
          });
          base.doc("sales:list").onSnapshot(snap=>{
            if(snap.exists&&ph===_activePhone){
              const v=snap.data().v;if(v){
                const now=Date.now();
                const f=v.filter(x=>now-x.ts<86400000*366);
                setSales(f);ss(_lk("sales:list",ph),f);
              }
            }
          });
          base.doc("settings:app").onSnapshot(snap=>{
            if(snap.exists&&ph===_activePhone){
              const v=snap.data().v;if(v){setSets(v);ss(_lk("settings:app",ph),v);}
            }
          });
          console.log("✅ Real-time sync active");
        }catch(e){console.warn("RT sync:",e);}
      }
    }

    boot();
  },[]);

  useEffect(()=>{
    if(!Object.keys(prods).length)return;
    const newN=[];
    Object.entries(prods).forEach(([code,p])=>{
      const d=daysUntil(p.expiry);
      if(d>=0&&d<=sets.expiryDays)newN.push({id:`exp-${code}`,type:"expiry",icon:"⏰",title:"صلاحية قاربت على الانتهاء",body:`${p.name} — ينتهي خلال ${d} يوم`,read:false,ts:Date.now()});
      if(d<0)newN.push({id:`xp-${code}`,type:"expired",icon:"❌",title:"منتج منتهي الصلاحية",body:`${p.name}`,read:false,ts:Date.now()});
      if(p.stock>0&&p.stock<=sets.lowStock)newN.push({id:`stk-${code}`,type:"stock",icon:"📦",title:"مخزون منخفض",body:`${p.name} — تبقى ${p.stock} وحدة`,read:false,ts:Date.now()});
      if(p.stock===0)newN.push({id:`out-${code}`,type:"stockout",icon:"🚫",title:"نفذ المخزون",body:`${p.name}`,read:false,ts:Date.now()});
    });
    setNotifs(prev=>{
      const exist=new Set(prev.map(n=>n.id));
      const merged=[...newN.filter(n=>!exist.has(n.id)),...prev];
      setUnread(merged.filter(n=>!n.read).length);
      uss("notifs:list",merged);
      return merged;
    });
  },[prods,sets]);

  const saveProds=p=>{setProds(p);uss("products:all",p);};
  const saveSets=s=>{setSets(s);uss("settings:app",s);};
  const addSale=sale=>setSales(prev=>{
    const u=[sale,...prev].filter(x=>Date.now()-x.ts<86400000*366);
    uss("sales:list",u);return u;
  });
  const markRead=()=>{setNotifs(prev=>{const n=prev.map(x=>({...x,read:true}));uss("notifs:list",n);return n;});setUnread(0);};
  const logout=()=>{ss("session:user",null);_activePhone="";setActivePhone("");setUser(null);setTab("pos");setProds({});setSales([]);setSets(INIT_SETS);setNotifs([]);setUnread(0);};

  if(booting)return(
    <div style={{minHeight:"100vh",background:"#0d1117",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
      <div style={{fontSize:48}}>🏪</div>
      <p style={{color:"#7d8590",fontSize:14,fontFamily:"'Cairo',sans-serif"}}>جاري التحميل...</p>
    </div>
  );
  if(!user)return <LoginScreen onLogin={(ud,ph)=>{if(ph){_activePhone=ph;const lp=sg(_lk('products:all',ph));setProds(lp||{});const ls=sg(_lk('settings:app',ph));if(ls)setSets(ls);const ln=sg(_lk('notifs:list',ph));if(ln){setNotifs(ln);setUnread(ln.filter(x=>!x.read).length);}const lr=sg(_lk('sales:list',ph));if(lr){const now=Date.now();setSales(lr.filter(x=>now-x.ts<86400000*366));}else setSales([]);}else{setProds({});setSales([]);setSets(INIT_SETS);}setUser(ud);}}/>;

  const TABS=[
    {id:"pos",icon:"🛒",label:"البيع"},
    {id:"products",icon:"📦",label:"المنتجات"},
    {id:"restock",icon:"➕",label:"المخزون"},
    {id:"sales",icon:"🧾",label:"المبيعات"},
    {id:"reports",icon:"📊",label:"التقارير"},
    {id:"notifs",icon:"🔔",label:"الإشعارات"},
    {id:"settings",icon:"⚙️",label:"الإعدادات"},
  ];

  return(
    <div className="app">
      <div className="tb">
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div className="tb-ico">🏪</div>
          <div>
            <div style={{fontSize:19,fontWeight:900,color:"#fff",lineHeight:1}}>بيّاع</div>
            <div style={{fontSize:10,color:"#7d8590"}}>{user.name}</div>
          </div>
        </div>
        <div className="tb-nav">
          {TABS.map(t=>(
            <button key={t.id} title={t.label} className={`nb${tab===t.id?" on":""}`} onClick={()=>{if(t.id==="notifs")markRead();setTab(t.id);}}>{t.icon}
              {t.id==="notifs"&&unread>0&&<span className="nb-bd">{unread}</span>}
            </button>
          ))}
          <button className="nb nb-out" onClick={logout}>خروج</button>
        </div>
      </div>
      {tab==="pos"&&<POSTab prods={prods} saveProds={saveProds} sets={sets} addSale={addSale}/>}
      {tab==="products"&&<ProductsTab prods={prods} saveProds={saveProds} sets={sets}/>}
      {tab==="restock"&&<RestockTab prods={prods} saveProds={saveProds}/>}
      {tab==="sales"&&<SalesTab sales={sales} setSalesExt={s=>{setSales(s);uss("sales:list",s);}} prods={prods} saveProds={saveProds}/>}
      {tab==="reports"&&<ReportsTab sales={sales} prods={prods} sets={sets} user={user}/>}
      {tab==="notifs"&&<NotifsTab notifs={notifs}/>}
      {tab==="settings"&&<SettingsTab sets={sets} saveSets={saveSets} user={user} onLogout={logout}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Service Worker -->
<script>
if("serviceWorker" in navigator){
  const sw=`
const V="bayyaa-v3";
const CACHE=[
  "./",
  "https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap",
  "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.20.0/index.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"
];
self.addEventListener("install",e=>{
  e.waitUntil(caches.open(V).then(c=>c.addAll(CACHE).catch(()=>{})));
  self.skipWaiting();
});
self.addEventListener("activate",e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==V).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener("fetch",e=>{
  e.respondWith(
    caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
      if(res.ok){const c=res.clone();caches.open(V).then(cache=>cache.put(e.request,c));}
      return res;
    }).catch(()=>caches.match("./")))
  );
});
  `;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.worker=URL.createObjectURL(blob);
  navigator.serviceWorker.register(navigator.worker).catch(()=>{});
}
</script>
</body>
</html>
