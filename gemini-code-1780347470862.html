/* ══ نظام عزل البائع الفعلي (Dynamic Multi-Tenancy Engine) ══ */
let _activePhone = "";
const setActivePhone = p => { _activePhone = p; };
const _lk = k => _activePhone ? `u_${_activePhone}_${k}` : k;

async function usg(k) {
  const lk = _lk(k);
  if (_db && _activePhone) {
    try {
      const snap = await _db.collection("sellers").doc(_activePhone).collection("data").doc(k).get();
      if (snap.exists) { const v = snap.data().v; ss(lk, v); return v; }
    } catch {}
  }
  return sg(lk);
}

function uss(k, v) {
  if (!_activePhone) return;
  ss(_lk(k), v);
  if (_db) {
    _db.collection("sellers").doc(_activePhone).collection("data").doc(k)
      .set({ v, t: Date.now() }).catch(e => console.warn("Error Syncing Isolated Data:", e));
  }
}

/* ══ إدارة الحسابات والاشتراكات السحابية لأي عدد من البائعين ══ */
async function getUsers() {
  if (_db) {
    try {
      const snap = await _db.collection("sellers").get();
      const u = {};
      snap.forEach(d => { if (d.data().profile) u[d.id] = { ...d.data().profile }; });
      if (Object.keys(u).length > 0) { ss("admin:users", u); return u; }
    } catch (e) { console.warn("getUsers:", e); }
  }
  return sg("admin:users") || {};
}

function saveUsers(u) {
  ss("admin:users", u);
  if (_db) {
    Object.entries(u).forEach(([phone, data]) => {
      _db.collection("sellers").doc(phone).set({ profile: data, t: Date.now() }, { merge: true })
        .catch(e => console.warn("saveUser:", e));
    });
  }
}

/* ══ ماسح الباركود الكاميرا واليدوي ══ */
function BarcodeScanner({ onScan, onClose }) {
  const vidRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const detectorRef = useRef(null);
  const [camErr, setCamErr] = useState(false);
  const [status, setStatus] = useState("⏳ جاري التشغيل...");
  const [manual, setManual] = useState("");
  const detectedRef = useRef(false);

  useEffect(() => {
    let alive = true;
    async function init() {
      await loadLibs();
      if (!alive) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        streamRef.current = stream;
        if (!vidRef.current || !alive) return;
        vidRef.current.srcObject = stream;
        vidRef.current.setAttribute("playsinline", "true");
        await vidRef.current.play();

        if ("BarcodeDetector" in window) {
          try {
            detectorRef.current = new window.BarcodeDetector({ formats: ["ean_13", "ean_8", "code_128", "qr_code"] });
            setStatus("✅ جاهز — وجه الكاميرا");
            nativeLoop(); return;
          } catch {}
        }
        setStatus("✅ جاهز — وجه الكاميرا");
        manualLoop();
      } catch (e) {
        setCamErr(true); setStatus("⚠️ تعذر تشغيل الكاميرا");
      }
    }

    async function nativeLoop() {
      if (!alive || detectedRef.current) return;
      const v = vidRef.current;
      if (!v || v.readyState < 2) { rafRef.current = requestAnimationFrame(nativeLoop); return; }
      try {
        const results = await detectorRef.current.detect(v);
        if (results?.length > 0 && results[0].rawValue) { found(results[0].rawValue); return; }
      } catch {}
      rafRef.current = requestAnimationFrame(nativeLoop);
    }

    function manualLoop() {
      if (!alive || detectedRef.current) return;
      const v = vidRef.current, cv = canvasRef.current;
      if (!v || !cv || v.readyState < 2) { rafRef.current = requestAnimationFrame(manualLoop); return; }
      const ctx = cv.getContext("2d", { willReadFrequently: true });
      cv.width = 400; cv.height = 300;
      ctx.drawImage(v, 0, 0, cv.width, cv.height);
      if (window.jsQR) {
        const img = ctx.getImageData(0, 0, cv.width, cv.height);
        const r = window.jsQR(img.data, cv.width, cv.height);
        if (r?.data) { found(r.data); return; }
      }
      rafRef.current = requestAnimationFrame(manualLoop);
    }

    function found(code) {
      if (detectedRef.current || !code) return;
      detectedRef.current = true;
      if (navigator.vibrate) navigator.vibrate(60);
      onScan(code);
    }

    init();
    return () => { alive = false; if (rafRef.current) cancelAnimationFrame(rafRef.current); if (streamRef.current) streamRef.current.getTracks().forEach(t => t.stop()); };
  }, [onScan]);

  async function loadLibs() {
    return new Promise(resolve => {
      if (window.jsQR) return resolve();
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js";
      s.onload = () => resolve();
      document.head.appendChild(s);
    });
  }

  const go = () => { if (manual.trim()) { onScan(manual.trim()); } };

  return (
    <div className="scan-modal">
      <div style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 10 }}>
          <p style={{ color: "#fff", fontWeight: 700 }}>{status}</p>
          <button onClick={onClose} style={{ color: "#fff", background: "none", fontSize: 16 }}>✕</button>
        </div>
        {!camErr && <video ref={vidRef} muted playsInline style={{ width: "100%", borderRadius: 12, background: "#000", height: 240, objectFit: "cover" }} />}
        <canvas ref={canvasRef} style={{ display: "none" }} />
        <div style={{ display: "flex", gap: 6, marginTop: 12 }}>
          <input className="inp" placeholder="أدخل الكود يدوياً..." value={manual} onChange={e => setManual(e.target.value)} onKeyDown={e => e.key === "Enter" && go()} />
          <button className="btn btn-p" style={{ width: "auto" }} onClick={go}>إدخال</button>
        </div>
      </div>
    </div>
  );
}

    if (!form.phone || form.phone.length < 9) return setMsg("رقم الهاتف خاطئ");

    if (form.pin4.length !== 4) return setMsg("PIN يجب أن يكون 4 أرقام");

    const u = { ...users, [form.phone]: { name: form.name.trim(), pin: form.pin4, subscribed: true, subExpiry: exp.toISOString().split("T")[0] } };

    } else if (action === "addMonth") {
      const d = new Date(updated[ph].subExpiry > new Date().toISOString() ? updated[ph].subExpiry : new Date());
      d.setMonth(d.getMonth() + 1); updated[ph].subExpiry = d.toISOString().split("T")[0]; updated[ph].subscribed = true;

                  <span style={{ color: active ? C.green : C.red, fontWeight: 700 }}>{active ? "نشط" : "منتهي"}</span>
                </div>
                <p style={{ fontSize: 10, color: C.muted }}>صلاحية الاشتراك لغاية: {u.subExpiry}</p>
                <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                  <button className="btn btn-s btn-sm" onClick={() => toggleSub(ph, "addMonth")}>➕ تمديد شهر</button>

}

/* ══ شاشة الدخول المحدثة بقفل الاشتراك ══ */
function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState("");
  const [pin, setPin] = useState("");
  const [name, setName] = useState("");
  const [step, setStep] = useState("info");
  const [err, setErr] = useState("");
  const [showAdmin, setShowAdmin] = useState(false);

  const goPin = () => {
    if (!name.trim() || phone.length < 9) return setErr("الرجاء التحقق من البيانات المطلوبة");
    setErr(""); setStep("pin");
  };

  const doLogin = async () => {
    const users = await getUsers();
    const u = users[phone];
    if (!u || u.pin !== pin) return setErr("رقم الهاتف أو الرمز السري غير مسجل!");
    if (!isSubValid(u.subExpiry)) return setErr("🛑 حسابك منتهي الصلاحية! يرجى الاتصال بالإدارة لتجديد الاشتراك.");
    const ud = { phone, name: u.name, subExpiry: u.subExpiry };
    setActivePhone(phone);
    ss("session:user", ud);
    onLogin(ud);
  };

  return (
    <div className="lw">
      {showAdmin && <AdminPanel onClose={() => setShowAdmin(false)} />}
      <div className="lcard">
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 32, marginBottom: 6 }}>🏪</div>
          <h1 style={{ color: "#fff", fontSize: 22 }}>منظومة بيّاع للبائعين</h1>
          <p style={{ color: C.muted, fontSize: 11 }}>بيئة عمل معزولة ومؤمنة بالكامل للنشاط التجاري</p>
        </div>
        {step === "info" && <>
          <input className="inp" placeholder="اسمك الكريم" value={name} onChange={e => setName(e.target.value)} style={{ marginBottom: 8 }} />
          <input className="inp" placeholder="رقم هاتفك المسجل" value={phone} onChange={e => setPhone(e.target.value)} style={{ marginBottom: 12 }} />
          {err && <p style={{ color: C.red, fontSize: 12, marginBottom: 8, textAlign: "center" }}>{err}</p>}
          <button className="btn btn-p" onClick={goPin}>التالي ←</button>
          <button onClick={() => setShowAdmin(true)} style={{ background: "none", color: C.muted, fontSize: 11, marginTop: 12, width: "100%" }}>🔑 بوابة المشرف العام</button>
        </>}
        {step === "pin" && <>
          <p style={{ textAlign: "center", color: "#fff", fontSize: 13, marginBottom: 8 }}>مرحباً {name}، أدخل رمز الـ PIN المعزول</p>
          <div className="pdots">{[0, 1, 2, 3].map(i => <div key={i} className={`pd${pin.length > i ? " on" : ""}`} />)}</div>
          <div className="numpad">
            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => <button key={n} className="nk" onClick={() => pin.length < 4 && setPin(p => p + n)}>{n}</button>)}
            <button className="nk" onClick={() => setPin(p => p.slice(0, -1))}>⌫</button>
            <button className="nk" onClick={() => pin.length < 4 && setPin(p => p + "0")}>0</button>
            <button className="nk" style={{ background: C.green }} onClick={doLogin} disabled={pin.length < 4}>✓</button>
          </div>
          {err && <p style={{ color: C.red, fontSize: 12, marginTop: 8, textAlign: "center" }}>{err}</p>}
        </>}
      </div>
    </div>
  );
}

/* ══ تبويب نقطة البيع ══ */
function POSTab({ prods, saveProds, addSale }) {
  const [cart, setCart] = useState([]);
  const [scanning, setScanning] = useState(false);
  const [showRec, setShowRec] = useState(false);
  const [curRec, setCurRec] = useState(null);

  const handleScan = useCallback(code => {
    setScanning(false);
    const p = prods[code];
    if (!p) { alert("المنتج غير موجود في مخزنك الخاص!"); return; }
    setCart(prev => {
      const ex = prev.find(i => i.code === code);
      if (ex) return prev.map(i => i.code === code ? { ...i, qty: Math.min(prods[code].stock, i.qty + 1) } : i);
      return [...prev, { ...p, code, qty: 1 }];
    });
  }, [prods]);

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

  const checkout = () => {
    const upd = { ...prods };
    cart.forEach(it => { if (upd[it.code]) upd[it.code] = { ...upd[it.code], stock: Math.max(0, upd[it.code].stock - it.qty) }; });
    saveProds(upd);
    const rec = { id: newId(), ts: Date.now(), items: cart.map(i => ({ code: i.code, name: i.name, qty: i.qty, price: i.price, total: i.price * i.qty })), total };
    addSale(rec); setCurRec(rec); setShowRec(true);
  };

  if (showRec && curRec) return (
    <div className="sc">
      <div className="rp">
        <h3 style={{ textAlign: "center", marginBottom: 10 }}>🧾 فاتورة البيع</h3>
        {curRec.items.map((it, i) => <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 12, padding: "4px 0" }}><span style={{ fontWeight: 700 }}>{it.name}</span><span>{it.qty} × {it.price} = {it.total} د.ل</span></div>)}
        <div style={{ borderTop: "1px solid #111", marginTop: 10, paddingTop: 6, display: "flex", justifyContent: "space-between", fontWeight: 900 }}><span>الإجمالي:</span><span>{curRec.total} د.ل</span></div>
      </div>
      <button className="btn btn-p" style={{ marginTop: 12 }} onClick={() => { setCart([]); setShowRec(false); }}>بيع جديد +</button>
    </div>
  );

  return (
    <div className="sc">
      {scanning && <BarcodeScanner onScan={handleScan} onClose={() => setScanning(false)} />}
      <button className="btn btn-p" style={{ marginBottom: 12 }} onClick={() => setScanning(true)}>📷 مسح باركود البيع</button>
      <div className="card" style={{ marginBottom: 12 }}>
        <p style={{ fontWeight: 700, marginBottom: 8 }}>🛒 سلة المبيعات الحالية</p>
        {cart.length === 0 ? <div className="emp"><p className="emp-t">السلة فارغة، امسح منتج من مخزنك لبدء البيع</p></div> :
          cart.map(i => (
            <div key={i.code} className="prow" style={{ display: "flex", justifyContent: "space-between" }}>
              <div><p style={{ fontWeight: 700 }}>{i.name}</p><p style={{ fontSize: 11, color: C.muted }}>{i.price} د.ل</p></div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 700, color: C.green }}>{i.qty} قطعة</span>
                <button className="btn btn-d btn-sm" onClick={() => setCart(p => p.filter(x => x.code !== i.code))}>🗑️</button>
              </div>
            </div>
          ))
        }
      </div>
      <div className="card card-g" style={{ marginBottom: 12, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span>إجمالي الفاتورة:</span><span style={{ fontSize: 20, fontWeight: 900, color: C.green }}>{total} د.ل</span>
      </div>
      <button className="btn btn-p" disabled={cart.length === 0} onClick={checkout}>إتمام عملية البيع وحفظ الفاتورة</button>
    </div>
  );
}

function RestockTab({ prods, saveProds }) {
  const [code, setCode] = useState("");
  const [qty, setQty] = useState("");

  const doAdd = () => {
    if (!prods[code]) return alert("هذا الكود غير موجود بمخزنك، أضفه كمنتج جديد أولاً!");

  return (

/* ══ سجل المبيعات المعزول مع الحذف والتحديد المجمع ══ */
function SalesTab({ sales, setSales }) {
  const [open, setOpen] = useState(null);
  const [checkedIds, setCheckedIds] = useState([]);

  const deleteSingleInvoice = (id, e) => {
    e.stopPropagation();
    const ask = confirm("هل تريد مسح هذه الفاتورة؟");
    if (ask) {
      const updatedSales = sales.filter(s => s.id !== id);
      setSales(updatedSales); uss("sales:list", updatedSales);
      setCheckedIds(p => p.filter(x => x !== id)); setOpen(null);
    }
  };

  const toggleSelectAll = () => {
    if (checkedIds.length === sales.length) { setCheckedIds([]); }
    else { setCheckedIds(sales.map(s => s.id)); }
  };

  const deleteSelectedInvoices = () => {
    if (checkedIds.length === 0) return;
    const ask = confirm(`هل تريد مسح جميع الفواتير المحددة وعددها (${checkedIds.length})؟`);
    if (ask) {
      const updatedSales = sales.filter(s => !checkedIds.includes(s.id));
      setSales(updatedSales); uss("sales:list", updatedSales);
      setCheckedIds([]); setOpen(null);
    }
  };

  const toggleCheck = (id, e) => {
    e.stopPropagation();
    if (checkedIds.includes(id)) { setCheckedIds(p => p.filter(x => x !== id)); }
    else { setCheckedIds(p => [...p, id]); }
  };

  return (
    <div className="sc">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <p style={{ fontWeight: 700 }}>🧾 فواتير مبيعاتك الشخصية ({sales.length})</p>
        {sales.length > 0 && (
          <div style={{ display: "flex", gap: 6 }}>
            <button className="btn btn-s btn-sm" onClick={toggleSelectAll}>
              {checkedIds.length === sales.length ? "🔲 إلغاء الكل" : "☑️ تحديد الكل"}
            </button>
            <button className="btn btn-d btn-sm" onClick={deleteSelectedInvoices} disabled={checkedIds.length === 0} style={{ opacity: checkedIds.length === 0 ? 0.5 : 1 }}>
              🗑️ مسح المحددة
            </button>
          </div>
        )}
      </div>

      {sales.length === 0 ? <div className="emp card"><p className="emp-t">لا توجد أي فواتير مسجلة لحسابك حالياً</p></div> :
        sales.map(sale => (
          <div key={sale.id} className="inv-card" style={{ borderColor: checkedIds.includes(sale.id) ? C.green : undefined }}>
            <div className="inv-head" onClick={() => setOpen(open === sale.id ? null : sale.id)}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <input type="checkbox" checked={checkedIds.includes(sale.id)} onChange={(e) => toggleCheck(sale.id, e)} onClick={(e) => e.stopPropagation()} style={{ width: 16, height: 16 }} />
                <div>
                  <p style={{ fontWeight: 700, fontSize: 13 }}>{sale.id}</p>
                  <p style={{ fontSize: 10, color: C.muted }}>{fmtTime(sale.ts)}</p>
                </div>
              </div>
              <div style={{ textAlign: "left", display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 900, color: C.green }}>{sale.total} د.ل</span>
                <button className="btn btn-d btn-sm" style={{ padding: "3px 8px", fontSize: 10 }} onClick={(e) => deleteSingleInvoice(sale.id, e)}>🗑️ مسح</button>
              </div>
            </div>
            {open === sale.id && (
              <div className="inv-body">
                {sale.items.map((it, idx) => (
                  <div key={idx} style={{ display: "flex", justifyContent: "space-between", fontSize: 11, padding: "3px 0", color: C.text }}>
                    <span>{it.name} ({it.qty} قطعة)</span><span>{it.total} د.ل</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        ))
      }
    </div>
  );
}

/* ══════════════════════════════════════════
   محرّك التطبيق والتحكم الفوقي المعزول
══════════════════════════════════════════ */
function App() {
  const [user, setUser] = useState(null);
  const [booting, setBooting] = useState(true);
  const [tab, setTab] = useState("pos");
  const [prods, setProds] = useState({});
  const [sets, setSets] = useState(INIT_SETS);
  const [notifs, setNotifs] = useState([]);
  const [sales, setSales] = useState([]);

  useEffect(() => {
    injectCSS();
    let interval = setInterval(async () => {
      if (window.firebase && window.firebase.apps && _db) {
        clearInterval(interval);
        const sess = sg("session:user");
        if (sess) {
          // فحص سحابي سريع لضمان عدم انتهاء الاشتراك عند الفتح والتبديل
          const uSnap = await _db.collection("sellers").get();
          let valid = false;
          uSnap.forEach(d => { if (d.id === sess.phone && isSubValid(d.data().profile?.subExpiry)) valid = true; });
          
          if (valid) {
            setActivePhone(sess.phone); setUser(sess);
            setProds(await usg("products:all") || {});
            setSets(await usg("settings:app") || INIT_SETS);
            setSales(await usg("sales:list") || []);
          } else {
            ss("session:user", null); setActivePhone(""); setUser(null);
          }
        }
        setBooting(false);
      }
    }, 150);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    if (!user || Object.keys(prods).length === 0) return;
    const newN = [];
    Object.entries(prods).forEach(([code, p]) => {
      if (p.stock === 0) newN.push({ id: `out-${code}`, title: "نفذ المخزون تماماً", body: `لقد انتهت كمية منتج [ ${p.name} ] من مخزنك` });
      else if (p.stock <= sets.lowStock) newN.push({ id: `low-${code}`, title: "مخزون منخفض جداً", body: `المنتج [ ${p.name} ] شارف على النفاد، المتبقي: ${p.stock}` });
    });
    setNotifs(newN);
  }, [prods, sets, user]);

  const saveProds = p => { setProds(p); uss("products:all", p); };
  const saveSets = s => { setSets(s); uss("settings:app", s); };
  const addSale = sale => setSales(prev => { const u = [sale, ...prev]; uss("sales:list", u); return u; });

  const handleLogin = (ud) => {
    setUser(ud); setBooting(true);
    (async () => {
      setProds(await usg("products:all") || {});
      setSets(await usg("settings:app") || INIT_SETS);
      setSales(await usg("sales:list") || []);
      setBooting(false);
    })();
  };

  const logout = () => { ss("session:user", null); setActivePhone(""); setUser(null); setProds({}); setSales([]); setTab("pos"); };

  if (booting) return (
    <div style={{ minHeight: "100vh", background: "#0d1117", display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 10 }}>
      <div style={{ fontSize: 40 }}>🏪</div>
      <p style={{ color: C.muted, fontSize: 13 }}>جاري تهيئة وتحميل مساحة البائع المعزولة...</p>
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  const TABS = [
    { id: "pos", icon: "🛒", label: "البيع" },
    { id: "products", icon: "📦", label: "المخزن" },
    { id: "restock", icon: "➕", label: "التوريد" },
    { id: "sales", icon: "🧾", label: "الفواتير" },
    { id: "notifs", icon: "🔔", label: "التنبيهات" },
    { id: "settings", icon: "⚙️", label: "الإعدادات" },
  ];

  return (
    <div className="app">
      <div className="tb">
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <div className="tb-ico">🏪</div>
          <div><p style={{ fontSize: 16, fontWeight: 900, color: "#fff" }}>بيّاع الذكي</p><p style={{ fontSize: 10, color: C.green }}>البائع الحركي: {user.name}</p></div>
        </div>
        <div className="tb-nav">
          {TABS.map(t => (
            <button key={t.id} className={`nb${tab === t.id ? " on" : ""}`} onClick={() => setTab(t.id)} style={{ fontSize: 13, padding: "4px 8px" }}>{t.icon} {t.label}</button>
          ))}
          <button className="nb nb-out" onClick={logout}>خروج</button>
        </div>
      </div>
      {tab === "pos" && <POSTab prods={prods} saveProds={saveProds} addSale={addSale} />}
      {tab === "products" && <ProductsTab prods={prods} saveProds={saveProds} />}
      {tab === "restock" && <RestockTab prods={prods} saveProds={saveProds} />}
      {tab === "sales" && <SalesTab sales={sales} setSales={setSales} />}
      {tab === "notifs" && <NotifsTab notifs={notifs} />}
      {tab === "settings" && <SettingsTab sets={sets} saveSets={saveSets} user={user} prods={prods} sales={sales} onLogout={logout} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if("serviceWorker" in navigator){
  const sw=`
const V="bayyaa-v4";
const CACHE=[
  "./",
  "https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap",
  "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"
];
self.addEventListener("install",e=>{
  e.waitUntil(caches.open(V).then(c=>c.addAll(CACHE).catch(()=>{})));
  self.skipWaiting();
});
self.addEventListener("activate",e=>{
  e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==V).map(k=>caches.delete(k)))));
  self.clients.claim();
});
self.addEventListener("fetch",e=>{
  e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>{})));
});`;
  navigator.serviceWorker.register("data:text/javascript;base64,"+btoa(unescape(encodeURIComponent(sw))));
}
</script>
</body>
