/* ══ Storage معزول — مفتاح خاص بكل بائع ══ */
let _activePhone="";
const setActivePhone=p=>{_activePhone=p;};
// مفتاح التخزين: دائماً يتضمن رقم هاتف البائع
const _lk=(k,ph)=>{const p=ph||_activePhone;return p?("U|"+p+"|"+k):k;};

// قراءة من localStorage (سريع وفوري)
function usgLocal(k,ph){return sg(_lk(k,ph));}

// كتابة: localStorage فوري + Firebase في الخلفية
function uss(k,v,ph){
  const p=ph||_activePhone;
  if(!p){console.warn("uss: no phone!");return;}
  ss(_lk(k,p),v);
  if(_db){
    _db.collection("sellers").doc(p).collection("data").doc(k)
      .set({v,t:Date.now()}).catch(e=>console.warn("uss err:",e));
  }
}

// قراءة async (localStorage أولاً، ثم Firebase إذا فارغ)
async function usg(k,ph){
  const p=ph||_activePhone;
  if(!p)return null;
  const local=sg(_lk(k,p));
  if(local!==null)return local;
  if(_db){
    try{
      const snap=await _db.collection("sellers").doc(p).collection("data").doc(k).get();
      if(snap.exists){const v=snap.data().v;ss(_lk(k,p),v);return v;}
    }catch{}
  }
  return null;
}

/* ══ إدارة البائعين (تم دمجها وإصلاح التعارض) ══ */
async function getUsers(){
  if(_db){
    try{
      const snap=await _db.collection("sellers").get();
      const u={};
      snap.forEach(d=>{if(d.data().profile)u[d.id]={...d.data().profile};});
      if(Object.keys(u).length>0){ss("admin:users",u);return u;}
    }catch(e){console.warn("getUsers:",e);}
  }
  return sg("admin:users")||{};
}

function saveUsers(u){
  ss("admin:users",u);
  if(_db){
    Object.entries(u).forEach(([phone,data])=>{
      _db.collection("sellers").doc(phone).set({profile:data,t:Date.now()},{merge:true})
        .catch(e=>console.warn("saveUser:",e));
    });
  }
}

/* ══════════════════════════════════════════
   BARCODE SCANNER — متعدد المسح + إشعار
══════════════════════════════════════════ */
function BarcodeScanner({onScan, onClose, multiMode}){
  const vidRef=useRef(null);
  const canvasRef=useRef(null);
  const streamRef=useRef(null);
  const rafRef=useRef(null);
  const detectorRef=useRef(null);
  const [camErr,setCamErr]=useState(false);
  const [ready,setReady]=useState(false);
  const [status,setStatus]=useState("⏳ جاري التشغيل...");
  const [manual,setManual]=useState("");
  const [toast,setToast]=useState(null);
  const [addedCount,setAddedCount]=useState(0);
  const lockRef=useRef(false);
  const frameRef=useRef(0);
  const toastTRef=useRef(null);

  // إظهار إشعار فوق الكاميرا
  const showToast=(info)=>{
    if(toastTRef.current)clearTimeout(toastTRef.current);
    setToast(info);
    toastTRef.current=setTimeout(()=>setToast(null),2200);
  };

  useEffect(()=>{
    let alive=true;

    async function init(){
      await loadLibs();
      if(!alive)return;
      try{
        const stream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60,min:30}}
        });
        streamRef.current=stream;
        if(!vidRef.current||!alive)return;
        vidRef.current.srcObject=stream;
        vidRef.current.setAttribute("playsinline","true");
        await vidRef.current.play();
        if("BarcodeDetector" in window){
          try{
            detectorRef.current=new window.BarcodeDetector({
              formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","data_matrix","itf"]
            });
            setStatus("✅ جاهز — وجّه على الباركود");
            setReady(true);
            nativeLoop();
            return;
          }catch{}
        }
        setStatus("✅ جاهز — وجّه على الباركود");
        setReady(true);
        manualLoop();
      }catch(e){setCamErr(true);setStatus("⚠️ تعذّر الكاميرا");}
    }

    async function nativeLoop(){
      if(!alive)return;
      const v=vidRef.current;
      if(!v||v.readyState<2){rafRef.current=requestAnimationFrame(nativeLoop);return;}
      try{
        const results=await detectorRef.current.detect(v);
        if(results?.length>0&&results[0].rawValue&&!lockRef.current){
          found(results[0].rawValue);
          return;
        }
      }catch{}
      rafRef.current=requestAnimationFrame(nativeLoop);
    }

    function manualLoop(){
      if(!alive)return;
      const v=vidRef.current,cv=canvasRef.current;
      if(!v||!cv||v.readyState<2){rafRef.current=requestAnimationFrame(manualLoop);return;}
      frameRef.current++;
      const W=v.videoWidth,H=v.videoHeight;
      if(!W||!H){rafRef.current=requestAnimationFrame(manualLoop);return;}
      const ctx=cv.getContext("2d",{willReadFrequently:true,alpha:false});
      const scales=frameRef.current%3===0?[1,1.7,2.8]:[1,2];
      for(let sc of scales){
        if(lockRef.current)break;
        const sw=Math.floor(W/sc),sh=Math.floor(H/sc);
        const sx=Math.floor((W-sw)/2),sy=Math.floor((H-sh)/2);
        cv.width=960;cv.height=Math.floor(960*sh/sw);
        ctx.filter="contrast(1.8) brightness(1.1) saturate(0)";
        ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
        ctx.filter="none";
        const imgData=ctx.getImageData(0,0,cv.width,cv.height);
        if(window.jsQR){
          try{
            const r=window.jsQR(imgData.data,cv.width,cv.height,{inversionAttempts:"attemptBoth"});
            if(r?.data?.length>1&&!lockRef.current){found(r.data);return;}
          }catch{}
        }
        if(window.Quagga?.decodeSingle){
          try{
            window.Quagga.decodeSingle({
              src:cv.toDataURL("image/jpeg",0.95),numOfWorkers:0,locate:true,
              inputStream:{size:cv.width},
              decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader","i2of5_reader"]},
            },res=>{if(res?.codeResult?.code&&!lockRef.current)found(res.codeResult.code);});
          }catch{}
        }
      }
      rafRef.current=requestAnimationFrame(manualLoop);
    }

    function found(code){
      if(lockRef.current||!code||code.length<3)return;
      lockRef.current=true;
      if(navigator.vibrate)navigator.vibrate([80,40,80]);

      if(multiMode){
        // وضع متعدد: لا نغلق الكاميرا، نبعث الكود ونُظهر إشعاراً
        const result=onScan(code);
        if(result&&result.name){
          showToast({ok:true,name:result.name});
          setAddedCount(c=>c+1);
        } else if(result&&result.notFound){
          showToast({ok:false,code});
        }
        // بعد 1.5 ثانية افتح القفل وامسح من جديد
        setTimeout(()=>{
          lockRef.current=false;
          if(alive){
            if(detectorRef.current)rafRef.current=requestAnimationFrame(nativeLoop);
            else rafRef.current=requestAnimationFrame(manualLoop);
          }
        },1500);
      } else {
        // الوضع العادي: أغلق الكاميرا وأرسل الكود
        stopCam();
        onScan(code);
      }
    }

    function stopCam(){
      alive=false;
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
    }

    init();
    return ()=>{
      alive=false;
      if(rafRef.current)cancelAnimationFrame(rafRef.current);
      if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
    };
  },[onScan,multiMode]);

  async function loadLibs(){
    return new Promise(resolve=>{
      let n=0,done=0;
      const libs=[];
      if(!window.jsQR)libs.push("https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js");
      if(!window.Quagga)libs.push("https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js");
      if(libs.length===0){resolve();return;}
      n=libs.length;
      libs.forEach(src=>{
        const s=document.createElement("script");s.src=src;
        s.onload=s.onerror=()=>{done++;if(done>=n)resolve();};
        document.head.appendChild(s);
      });
    });
  }

  const captureNow=()=>{
    const v=vidRef.current,cv=canvasRef.current;
    if(!v||!cv||lockRef.current)return;
    setStatus("📸 جاري المسح...");
    const W=v.videoWidth,H=v.videoHeight;
    const attempts=[
      {sx:0,sy:0,sw:W,sh:H,size:1280},
      {sx:W*0.1,sy:H*0.1,sw:W*0.8,sh:H*0.8,size:960},
      {sx:W*0.2,sy:H*0.2,sw:W*0.6,sh:H*0.6,size:800},
    ];
    let gotIt=false,doneCount=0;
    attempts.forEach(({sx,sy,sw,sh,size})=>{
      if(gotIt)return;
      cv.width=size;cv.height=Math.floor(size*sh/sw);
      const ctx=cv.getContext("2d",{willReadFrequently:true});
      ctx.filter="contrast(2.0) brightness(1.2) saturate(0)";
      ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
      ctx.filter="none";
      if(window.Quagga?.decodeSingle){
        window.Quagga.decodeSingle({
          src:cv.toDataURL("image/jpeg",1.0),numOfWorkers:0,locate:true,
          inputStream:{size:cv.width},
          decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader","code_39_reader","i2of5_reader"]},
        },res=>{
          doneCount++;
          if(res?.codeResult?.code&&!lockRef.current&&!gotIt){
            gotIt=true;
            lockRef.current=true;
            if(navigator.vibrate)navigator.vibrate([80,40,80]);
            if(multiMode){
              const result=onScan(res.codeResult.code);
              if(result&&result.name){showToast({ok:true,name:result.name});setAddedCount(c=>c+1);}
              else if(result&&result.notFound)showToast({ok:false,code:res.codeResult.code});
              setStatus("✅ جاهز — وجّه على الباركود");
              setTimeout(()=>{lockRef.current=false;},1500);
            } else {
              if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());
              if(rafRef.current)cancelAnimationFrame(rafRef.current);
              onScan(res.codeResult.code);
            }
          } else if(doneCount>=attempts.length&&!gotIt){
            setStatus("⚠️ لم يُقرأ — قرّب الباركود وحاول");
            setTimeout(()=>setStatus("✅ جاهز — وجّه على الباركود"),2000);
          }
        });
      }
    });
  };

  const close=()=>{
    try{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());}catch{}
    try{if(rafRef.current)cancelAnimationFrame(rafRef.current);}catch{}
    onClose();
  };
  const go=()=>{
    if(!manual.trim())return;
    if(multiMode){
      const result=onScan(manual.trim());
      if(result&&result.name){showToast({ok:true,name:result.name});setAddedCount(c=>c+1);}
      else if(result&&result.notFound)showToast({ok:false,code:manual.trim()});
      setManual("");
    } else {
      close();onScan(manual.trim());
    }
  };

  return(
    <div className="scan-modal">
      <div style={{width:"100%",maxWidth:370}}>
        {/* شريط العنوان */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div>
            <p style={{color:"#fff",fontWeight:700,fontSize:15}}>{multiMode?"📷 مسح متعدد للزبون":"📷 مسح الباركود"}</p>
            <p style={{color:camErr?"#f85149":ready?"#2ea043":"#f0883e",fontSize:11,fontWeight:600}}>{status}</p>
          </div>
          <button onClick={close} style={{background:"rgba(218,54,51,0.2)",border:"1px solid rgba(218,54,51,0.45)",borderRadius:9,padding:"7px 15px",color:"#f85149",cursor:"pointer",fontFamily:"'Cairo',sans-serif",fontSize:14,fontWeight:700}}>✕ إغلاق</button>
        </div>

        {/* Toast إشعار فوق الكاميرا */}
        {toast&&(
          <div style={{
            marginBottom:7,padding:"9px 13px",borderRadius:11,
            background:toast.ok?"rgba(35,134,54,0.22)":"rgba(218,54,51,0.18)",
            border:`1.5px solid ${toast.ok?"rgba(46,160,67,0.55)":"rgba(248,81,73,0.45)"}`,
            display:"flex",alignItems:"center",gap:10,animation:"sli .18s ease"
          }}>
            <span style={{fontSize:20}}>{toast.ok?"✅":"⚠️"}</span>
            <div>
              {toast.ok
                ?<><p style={{color:"#3fb950",fontWeight:700,fontSize:13,margin:0}}>{toast.name}</p>
                   <p style={{color:"#7d8590",fontSize:10,margin:0}}>✔ تمت الإضافة إلى سلة الزبون</p></>
                :<><p style={{color:"#f85149",fontWeight:700,fontSize:13,margin:0}}>المنتج غير موجود في القاعدة</p>
                   <p style={{color:"#7d8590",fontSize:10,margin:0}}>كود: {toast.code}</p></>
              }
            </div>
          </div>
        )}

        {/* منطقة الكاميرا */}
        {!camErr&&(
          <div style={{position:"relative",background:"#000",borderRadius:14,overflow:"hidden",border:"2px solid rgba(35,134,54,0.6)",width:"100%",height:260}}>
            <video ref={vidRef} muted playsInline style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
            <canvas ref={canvasRef} style={{display:"none"}}/>
            <div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
              <div style={{position:"absolute",inset:0,background:"radial-gradient(ellipse 70% 55% at 50% 50%,transparent,rgba(0,0,0,0.55))"}}/>
              <div style={{position:"absolute",top:"15%",left:"8%",right:"8%",bottom:"15%"}}>
                {[
                  [{top:0,left:0},{borderTop:"3px solid #2ea043",borderLeft:"3px solid #2ea043",borderRadius:"6px 0 0 0"}],
                  [{top:0,right:0},{borderTop:"3px solid #2ea043",borderRight:"3px solid #2ea043",borderRadius:"0 6px 0 0"}],
                  [{bottom:0,left:0},{borderBottom:"3px solid #2ea043",borderLeft:"3px solid #2ea043",borderRadius:"0 0 0 6px"}],
                  [{bottom:0,right:0},{borderBottom:"3px solid #2ea043",borderRight:"3px solid #2ea043",borderRadius:"0 0 6px 0"}],
                ].map(([p,b],i)=><div key={i} style={{position:"absolute",width:26,height:26,...p,...b}}/>)}
                <div style={{position:"absolute",left:0,right:0,height:3,top:"50%",background:"linear-gradient(90deg,transparent,#2ea043,#fff,#2ea043,transparent)",boxShadow:"0 0 12px 3px rgba(46,160,67,0.8)",animation:"scl 0.9s ease-in-out infinite"}}/>
              </div>
              {ready&&<div style={{position:"absolute",bottom:8,left:0,right:0,textAlign:"center"}}>
                <span style={{background:"rgba(0,0,0,0.65)",color:"#3fb950",fontSize:11,padding:"3px 12px",borderRadius:20,fontWeight:600}}>ضع الباركود داخل الإطار</span>
              </div>}
            </div>
          </div>
        )}

        {camErr&&(
          <div style={{background:"rgba(218,54,51,0.15)",border:"1px solid rgba(218,54,51,0.3)",borderRadius:12,padding:16,textAlign:"center",margin:"8px 0"}}>
            <p style={{color:"#f85149",fontSize:14,fontWeight:700}}>⚠️ لا يمكن الوصول للكاميرا</p>

          </div>
        )}
      </div>
    </div>
  );
}

function AdminPanel({onClose}){
  const [step,setStep]=useState("pin"); 
  const [pin,setPin]=useState("");
  const [err,setErr]=useState("");
  const [users,setUsers]=useState({});
  const [form,setForm]=useState({phone:"",name:"",pin4:"",months:"1"});
  const [msg,setMsg]=useState("");

  useEffect(() => {
    (async () => {
      const u = await getUsers();
      setUsers(u);
    })();
  }, []);

  const checkPin=()=>{
    if(pin===ADMIN_PIN){setStep("manage");setErr("");}
    else{setErr("رمز المشرف خاطئ");setPin("");}
  };

  const addUser=async ()=>{
    if(!form.phone||form.phone.length<9)return setMsg("رقم الهاتف خاطئ");
    if(!form.name.trim())return setMsg("أدخل الاسم");
    if(form.pin4.length!==4)return setMsg("PIN يجب أن يكون 4 أرقام");
    const exp=new Date();exp.setMonth(exp.getMonth()+parseInt(form.months));
    const expStr=exp.toISOString().split("T")[0];
    const u={...users,[form.phone]:{name:form.name.trim(),pin:form.pin4,subscribed:true,subExpiry:expStr}};
    setUsers(u);
    saveUsers(u);
    setForm({phone:"",name:"",pin4:"",months:"1"});
    setMsg("✅ تم إضافة/تجديد البائع");
    setTimeout(()=>setMsg(""),2500);
  };

  const toggleSub=phone=>{
    const u={...users};u[phone]={...u[phone],subscribed:!u[phone].subscribed};
    setUsers(u);saveUsers(u);
  };

  const renewUser=phone=>{
    const input=window.prompt("كم شهر للتجديد؟","1");
    if(input===null)return;
    const months=parseInt(input)||1;
    const exp=new Date();exp.setMonth(exp.getMonth()+months);
    const expStr=exp.toISOString().split("T")[0];
    const u={...users};u[phone]={...u[phone],subscribed:true,subExpiry:expStr};
    setUsers(u);saveUsers(u);
    setMsg(`✅ تم تجديد اشتراك ${u[phone].name} لـ ${months} شهر`);
    setTimeout(()=>setMsg(""),2500);
  };

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16,direction:"rtl"}}>
      <div style={{background:"rgba(22,27,34,0.98)",border:"1px solid rgba(48,54,61,0.9)",borderRadius:18,padding:"28px 22px",width:"100%",maxWidth:400,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div>
            <p style={{color:"#fff",fontWeight:900,fontSize:17}}>🔑 لوحة المشرف</p>
            <p style={{color:"#7d8590",fontSize:11}}>إدارة البائعين والاشتراكات</p>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.08)",border:"none",borderRadius:8,padding:"6px 12px",color:"#ccc",cursor:"pointer",fontFamily:"'Cairo',sans-serif",fontSize:13}}>✕</button>
        </div>

        {step==="pin"&&<>
          <p style={{color:"#7d8590",fontSize:13,marginBottom:12,textAlign:"center"}}>أدخل رمز المشرف</p>
          <input className="inp" type="password" placeholder="رمز المشرف" value={pin} onChange={e=>setPin(e.target.value)} onKeyDown={e=>e.key==="Enter"&&checkPin()} style={{marginBottom:10,textAlign:"center",fontSize:20,letterSpacing:6}}/>
          {err&&<p style={{color:"#f85149",fontSize:12,textAlign:"center",marginBottom:10}}>{err}</p>}
          <button className="btn btn-p" onClick={checkPin}>دخول</button>
        </>}

        {step==="manage"&&<>
          <div style={{background:"rgba(35,134,54,0.08)",border:"1px solid rgba(35,134,54,0.3)",borderRadius:12,padding:14,marginBottom:16}}>
            <p style={{color:"#2ea043",fontWeight:700,fontSize:13,marginBottom:12}}>➕ إضافة بائع أو تجديد اشتراك</p>
            <div style={{marginBottom:9}}>
              <p className="lbl">رقم الهاتف</p>
              <input className="inp" placeholder="09XXXXXXXX" value={form.phone} type="tel" onChange={e=>setForm(f=>({...f,phone:e.target.value.replace(/\D/g,"").slice(0,10)}))}/>
            </div>
            <div style={{marginBottom:9}}>
              <p className="lbl">الاسم</p>
              <input className="inp" placeholder="اسم البائع" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
            </div>
            <div style={{marginBottom:9}}>
              <p className="lbl">رمز PIN (4 أرقام — يختاره البائع)</p>
              <input className="inp" placeholder="1234" maxLength={4} value={form.pin4} onChange={e=>setForm(f=>({...f,pin4:e.target.value.replace(/\D/g,"").slice(0,4)}))}/>
            </div>
            <div style={{marginBottom:12}}>
              <p className="lbl">مدة الاشتراك</p>
              <select className="inp" value={form.months} onChange={e=>setForm(f=>({...f,months:e.target.value}))}>
                <option value="1">شهر واحد — 45 د.ل</option>
                <option value="3">3 أشهر — 120 د.ل</option>
                <option value="6">6 أشهر — 220 د.ل</option>
                <option value="12">سنة كاملة — 400 د.ل</option>
              </select>
            </div>
            {msg&&<p style={{color:msg.includes("✅")?"#3fb950":"#f85149",fontSize:12,marginBottom:10}}>{msg}</p>}
            <button className="btn btn-p" onClick={addUser}>✅ إضافة / تجديد</button>
          </div>

          <p style={{color:"#7d8590",fontSize:12,fontWeight:700,marginBottom:8}}>👥 البائعون ({Object.keys(users).length})</p>
          {Object.keys(users).length===0&&<p style={{color:"#484f58",fontSize:12,textAlign:"center",padding:"16px 0"}}>لا يوجد بائعون بعد</p>}
          {Object.entries(users).map(([ph,u])=>{
            const days=u.subExpiry?daysUntil(u.subExpiry):0;
            return(
              <div key={ph} style={{background:"rgba(22,27,34,0.88)",border:"1px solid rgba(48,54,61,0.7)",borderRadius:10,padding:"10px 12px",marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{u.name}</p>
                    <p style={{color:"#484f58",fontSize:10}}>{ph}  ·  PIN: {u.pin}</p>
                    <p style={{color:days<0?"#f85149":days<=7?"#f0883e":"#3fb950",fontSize:10,marginTop:2}}>
                      {u.subscribed?(days<0?"انتهى الاشتراك":`${days} يوم متبقي`):"موقوف"}
                    </p>
                  </div>
                  <div style={{display:"flex",gap:5,flexDirection:"column",alignItems:"flex-end"}}>
                    <button className="btn btn-p btn-sm" style={{fontSize:11}} onClick={()=>renewUser(ph)}>🔄 تجديد</button>
                    <button className={`btn btn-sm ${u.subscribed?"btn-d":"btn-s"}`} style={{fontSize:11}} onClick={()=>toggleSub(ph)}>{u.subscribed?"إيقاف":"تفعيل"}</button>
                  </div>
                </div>
              </div>
            );
          })}
          <div style={{marginTop:12,padding:"10px",background:"rgba(13,17,23,0.5)",borderRadius:8,textAlign:"center"}}>
            <p style={{color:"#484f58",fontSize:10}}>رمز المشرف الحالي: {ADMIN_PIN} — غيّره في الكود</p>
          </div>
        </>}
      </div>
    </div>
  );
}

    if(!name.trim())return bad("أدخل اسمك");

  };

  const doLogin=()=>{
    setBusy(true);
    (async()=>{
      // تحقق من localStorage أولاً (سريع)
      let users=sg("admin:users")||{};
      let u=users[phone];

      }

      ss("session:user",ud);

          </div>
          <div style={{marginBottom:22}}>
            <p className="lbl">رقم الهاتف</p>
            <input className="inp" placeholder="09XXXXXXXX" value={phone} type="tel" onChange={e=>setPhone(e.target.value.replace(/\D/g,"").slice(0,10))} onKeyDown={e=>e.key==="Enter"&&goPin()}/>
          </div>
          {err&&<p style={{color:"#f85149",fontSize:12,textAlign:"center",marginBottom:12}}>{err}</p>}
          <button className="btn btn-p" onClick={goPin}>التالي →</button>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16}}>
            <p style={{color:"#30363d",fontSize:11}}>الاشتراك 45 د.ل/شهر</p>

          </div>
        </>}

        {step==="pin"&&<>
          <button onClick={()=>{setStep("info");setPin("");setErr("");}} style={{background:"none",border:"none",color:"#7d8590",cursor:"pointer",fontFamily:"'Cairo',sans-serif",fontSize:12,marginBottom:16}}>← رجوع</button>
          <p style={{color:"#e6edf3",textAlign:"center",fontSize:14,marginBottom:2}}>مرحباً، {name}</p>
          <p style={{color:"#7d8590",textAlign:"center",fontSize:11,marginBottom:4}}>رمز الدخول (4 أرقام)</p>
          <div className="pdots">{[0,1,2,3].map(i=><div key={i} className={`pd${pin.length>i?" on":""}`}/>)}</div>
          {err&&<p style={{color:"#f85149",fontSize:12,textAlign:"center",marginBottom:9}}>{err}</p>}
          <div className="numpad">
            {[1,2,3,4,5,6,7,8,9].map(n=>(
              <button key={n} className="nk" onClick={()=>pin.length<4&&setPin(p=>p+n)}>{n}</button>
            ))}
            <button className="nk" style={{fontSize:14}} onClick={()=>setPin(p=>p.slice(0,-1))}>⌫</button>
            <button className="nk" onClick={()=>pin.length<4&&setPin(p=>p+"0")}>0</button>
            <button className="nk" style={{background:pin.length===4?"linear-gradient(135deg,#238636,#2ea043)":undefined,fontSize:18}} onClick={doLogin} disabled={pin.length<4||busy}>{busy?"⏳":"✓"}</button>
          </div>
        </>}
      </div>
    </div>
  );
}

/* ══ POS TAB ══ */
function POSTab({prods,saveProds,addSale}){
  const [cart,setCart]=useState([]);
  const [scanning,setScanning]=useState(false);
  const [lastP,setLastP]=useState(null);
  const [showRec,setShowRec]=useState(false);
  const [curRec,setCurRec]=useState(null);
  // بحث يدوي
  const [searchQ,setSearchQ]=useState("");
  const [searchSugg,setSearchSugg]=useState([]);

  // دالة المسح — تُعيد نتيجة للـ Scanner (في الوضع المتعدد)
  const handleScan=useCallback(code=>{
    const p=prods[code];
    if(!p)return {notFound:true};
    setLastP({...p,code});
    setCart(prev=>{
      const ex=prev.find(i=>i.code===code);
      if(ex)return prev.map(i=>i.code===code?{...i,qty:Math.min(prods[code].stock,i.qty+1)}:i);
      return [...prev,{...p,code,qty:1}];
    });
    return {name:p.name};
  },[prods]);

  // إضافة من البحث اليدوي
  const addFromSearch=(code,p)=>{
    setSearchQ("");setSearchSugg([]);
    setLastP({...p,code});
    setCart(prev=>{
      const ex=prev.find(i=>i.code===code);
      if(ex)return prev.map(i=>i.code===code?{...i,qty:Math.min(prods[code].stock,i.qty+1)}:i);
      return [...prev,{...p,code,qty:1}];
    });
  };

  // منطق البحث: اسم أو آخر 4 أرقام كود
  const onSearchChange=v=>{
    setSearchQ(v);
    if(!v.trim()){setSearchSugg([]);return;}
    const q=v.trim().toLowerCase();
    const isDigits=/^\d+$/.test(q);
    const results=Object.entries(prods).filter(([code,p])=>{
      if(isDigits) return code.endsWith(q);
      return p.name.toLowerCase().includes(q);
    }).slice(0,8);
    setSearchSugg(results);
  };

  const remove=code=>setCart(p=>p.filter(i=>i.code!==code));
  const chgQty=(code,d)=>setCart(p=>p.map(i=>{
    if(i.code!==code)return i;
    const mx=prods[code]?.stock??i.qty;
    return{...i,qty:Math.min(mx,Math.max(1,i.qty+d))};
  }));
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);

  const checkout=()=>{
    const upd={...prods};
    cart.forEach(it=>{if(upd[it.code])upd[it.code]={...upd[it.code],stock:Math.max(0,upd[it.code].stock-it.qty)};});
    saveProds(upd);
    const rec={id:newId(),ts:Date.now(),
      items:cart.map(i=>({code:i.code,name:i.name,qty:i.qty,price:i.price,total:+(i.price*i.qty).toFixed(2)})),
      total:+total.toFixed(2)};
    addSale(rec);setCurRec(rec);setShowRec(true);
  };

  const newSale=()=>{setCart([]);setShowRec(false);setLastP(null);setCurRec(null);};

  if(showRec&&curRec)return(
    <div className="sc">
      <div className="rp">
        <div style={{textAlign:"center",borderBottom:"2px dashed #ccc",paddingBottom:13,marginBottom:13}}>
          <div style={{fontSize:30,marginBottom:5}}>🧾</div>
          <h2 style={{fontSize:16,fontWeight:900}}>فاتورة بيّاع</h2>
          <p style={{color:"#666",fontSize:11,marginTop:2}}>{curRec.id}</p>
          <p style={{color:"#555",fontSize:11}}>{fmtTime(curRec.ts)}</p>
        </div>
        {curRec.items.map((it,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f0f0f0",fontSize:12}}>
            <span style={{fontWeight:700}}>{it.name}</span>
            <span style={{color:"#238636",fontWeight:700}}>{it.qty}×{it.price.toFixed(2)}={it.total.toFixed(2)} د.ل</span>
          </div>
        ))}
        <div style={{display:"flex",justifyContent:"space-between",marginTop:13,borderTop:"2px solid #111",paddingTop:9,fontSize:17,fontWeight:900}}>
          <span>المجموع</span><span style={{color:"#238636"}}>{curRec.total.toFixed(2)} د.ل</span>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button className="btn btn-p" onClick={newSale} style={{flex:1}}>بيع جديد +</button>
        <button className="btn btn-s" onClick={()=>setShowRec(false)} style={{flex:1}}>تعديل</button>
      </div>
    </div>
  );

  return(
    <div className="sc">
      {scanning&&<BarcodeScanner onScan={handleScan} onClose={()=>setScanning(false)} multiMode={true}/>}

      {/* زر المسح */}
      <button className="btn btn-p" style={{marginBottom:9,fontSize:15}} onClick={()=>setScanning(true)}>📷 مسح باركود الزبون</button>

      {/* البحث اليدوي */}
      <div style={{position:"relative",marginBottom:11}}>
        <div style={{display:"flex",gap:7,alignItems:"center"}}>
          <div style={{position:"relative",flex:1}}>
            <input
              className="inp"
              placeholder="🔍 ابحث باسم المنتج أو آخر 4 أرقام من الكود..."
              value={searchQ}
              onChange={e=>onSearchChange(e.target.value)}
              style={{paddingRight:14}}
            />
            {searchQ&&<button onClick={()=>{setSearchQ("");setSearchSugg([]);}} style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#7d8590",fontSize:16,cursor:"pointer",lineHeight:1}}>✕</button>}
          </div>
        </div>
        {searchSugg.length>0&&(
          <div style={{position:"absolute",top:"100%",right:0,left:0,zIndex:50,background:"rgba(22,27,34,0.99)",border:"1.5px solid rgba(35,134,54,0.4)",borderRadius:11,marginTop:4,maxHeight:220,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
            {searchSugg.map(([code,p])=>{
              const inCart=cart.find(i=>i.code===code);
              return(
                <div key={code} onClick={()=>addFromSearch(code,p)} style={{padding:"10px 14px",borderBottom:"1px solid rgba(48,54,61,0.4)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",transition:"background .12s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="rgba(35,134,54,0.12)"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <div>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13,margin:0}}>{p.name}</p>
                    <p style={{color:"#484f58",fontSize:10,margin:0}}>كود: {code} · {p.price.toFixed(2)} د.ل · مخزون: {p.stock}</p>
                  </div>
                  <div style={{textAlign:"left"}}>
                    <p style={{color:"#3fb950",fontWeight:900,fontSize:13,margin:0}}>{p.price.toFixed(2)} د.ل</p>
                    {inCart&&<span style={{background:"rgba(35,134,54,0.2)",color:"#3fb950",fontSize:10,padding:"1px 6px",borderRadius:8}}>في السلة ×{inCart.qty}</span>}
                  </div>
                </div>
              );
            })}
          </div>
        )}
        {searchQ&&searchSugg.length===0&&(
          <div style={{position:"absolute",top:"100%",right:0,left:0,zIndex:50,background:"rgba(22,27,34,0.97)",border:"1px solid rgba(48,54,61,0.5)",borderRadius:11,marginTop:4,padding:"12px",textAlign:"center"}}>
            <p style={{color:"#7d8590",fontSize:12}}>لا توجد نتائج</p>
          </div>
        )}
      </div>

      {/* آخر منتج ممسوح */}
      {lastP&&(
        <div className="card card-g" style={{marginBottom:11,animation:"sli .22s ease"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <p style={{color:"#e6edf3",fontWeight:700,fontSize:14}}>{lastP.name}</p>
              <p style={{color:"#7d8590",fontSize:11,marginTop:2}}>📦 {lastP.stock} وحدة  ·  📅 {fmtDate(lastP.expiry)}</p>
            </div>
            <p style={{color:"#3fb950",fontSize:19,fontWeight:900}}>{lastP.price.toFixed(2)} د.ل</p>
          </div>
        </div>
      )}

      {/* السلة */}
      <div className="card" style={{marginBottom:11}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <p style={{color:"#e6edf3",fontWeight:700,fontSize:14}}>🛍️ السلة</p>
          {cart.length>0&&<span className="tag tg">{cart.reduce((s,i)=>s+i.qty,0)} منتج</span>}
        </div>
        {cart.length===0
          ?<div className="emp"><div className="emp-i">🏪</div><p className="emp-t">امسح باركود منتج لبدء البيع</p></div>
          :<div style={{maxHeight:"36vh",overflowY:"auto"}}>
            {cart.map(item=>{
              const d=daysUntil(item.expiry);
              const mx=prods[item.code]?.stock??item.qty;
              return(
                <div key={item.code} className="prow">
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap",marginBottom:3}}>
                        <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{item.name}</p>
                        {d<0&&<span className="tag tr">منتهي</span>}
                        {d>=0&&d<=30&&<span className="tag to">ينتهي قريباً</span>}
                        {item.qty>=mx&&<span className="tag to">الحد الأقصى</span>}
                      </div>
                      <p style={{color:"#484f58",fontSize:10}}>كود: {item.code}  ·  {item.price.toFixed(2)} د.ل  ·  متوفر: {mx}</p>
                    </div>
                    <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,marginRight:5}}>
                      <p style={{color:"#3fb950",fontWeight:900,fontSize:14}}>{(item.price*item.qty).toFixed(2)} د.ل</p>
                      <div className="qc">
                        <button className="qb" onClick={()=>chgQty(item.code,-1)}>−</button>
                        <span className="qn">{item.qty}</span>
                        <button className="qb" onClick={()=>chgQty(item.code,1)} disabled={item.qty>=mx} style={{opacity:item.qty>=mx?.4:1}}>+</button>
                      </div>
                      <button className="btn btn-d btn-sm" onClick={()=>remove(item.code)}>🗑 حذف</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        }
      </div>
      <div className="card card-g" style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <p style={{color:"#7d8590",fontSize:13,fontWeight:600}}>المجموع الكلي</p>
          <p style={{color:"#3fb950",fontSize:24,fontWeight:900}}>{total.toFixed(2)} <span style={{fontSize:12}}>د.ل</span></p>
        </div>
      </div>
      <button className="btn btn-p" disabled={cart.length===0} onClick={checkout} style={{fontSize:15}}>✅ إتمام البيع وإصدار الفاتورة</button>
    </div>
  );
}

/* ══ Products Tab ══ */
function ProductsTab({prods,saveProds,sets}){
  const [mode,setMode]=useState("list");
  const [edit,setEdit]=useState(null);
  const [scan,setScan]=useState(false);
  const [form,setForm]=useState({code:"",name:"",price:"",stock:"",expiry:"",category:"غذائي"});
  const [err,setErr]=useState("");

  const openAdd=()=>{setForm({code:"",name:"",price:"",stock:"",expiry:"",category:"غذائي"});setErr("");setMode("add");};
  const openEdit=code=>{
    const p=prods[code];
    setForm({code,name:p.name,price:p.price,stock:p.stock,expiry:p.expiry,category:p.category||"غذائي"});
    setEdit(code);setErr("");setMode("edit");
  };
  const scanCode=c=>{setScan(false);setForm(f=>({...f,code:c}));};
  const save=()=>{
    if(!form.code.trim()||!form.name.trim()||!form.price||!form.stock||!form.expiry)return setErr("يرجى تعبئة جميع الحقول");
    const u={...prods};
    u[form.code.trim()]={name:form.name.trim(),price:parseFloat(form.price),stock:parseInt(form.stock),expiry:form.expiry,category:form.category};
    if(edit&&edit!==form.code.trim())delete u[edit];
    saveProds(u);setMode("list");
  };
  const del=code=>{if(confirm("حذف هذا المنتج؟")){const u={...prods};delete u[code];saveProds(u);}};

  if(mode!=="list")return(
    <div className="sc">
      {scan&&<BarcodeScanner onScan={scanCode} onClose={()=>setScan(false)}/>}
      <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:16}}>
        <button className="btn btn-s btn-sm" onClick={()=>setMode("list")}>← رجوع</button>
        <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700}}>{mode==="add"?"إضافة منتج":"تعديل المنتج"}</h2>
      </div>
      <div className="card">
        <div style={{marginBottom:12}}>
          <p className="lbl">كود / باركود المنتج</p>
          <div style={{display:"flex",gap:7}}>
            <input className="inp" placeholder="أدخل أو امسح الكود" value={form.code} onChange={e=>setForm(f=>({...f,code:e.target.value}))} style={{flex:1}}/>
            <button className="btn btn-s btn-sm" style={{flexShrink:0,fontSize:18}} onClick={()=>setScan(true)}>📷</button>
          </div>
        </div>
        {[{l:"اسم المنتج",k:"name",p:"مثال: سكر 1كغ",t:"text"},{l:"السعر (د.ل)",k:"price",p:"0.00",t:"number"},{l:"الكمية في المستودع",k:"stock",p:"0",t:"number"}].map(f=>(
          <div key={f.k} style={{marginBottom:12}}>
            <p className="lbl">{f.l}</p>
            <input className="inp" placeholder={f.p} type={f.t} value={form[f.k]} onChange={e=>setForm(x=>({...x,[f.k]:e.target.value}))}/>
          </div>
        ))}
        <div style={{marginBottom:12}}>
          <p className="lbl">تاريخ انتهاء الصلاحية</p>
          <input className="inp" type="date" value={form.expiry} onChange={e=>setForm(f=>({...f,expiry:e.target.value}))}/>
        </div>
        <div style={{marginBottom:16}}>
          <p className="lbl">الفئة</p>
          <select className="inp" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {["غذائي","ألبان","عناية","مشروبات","أخرى"].map(x=><option key={x} value={x}>{x}</option>)}
          </select>
        </div>
        {err&&<p style={{color:"#f85149",fontSize:12,marginBottom:12}}>{err}</p>}
        <button className="btn btn-p" onClick={save}>{mode==="add"?"✅ إضافة":"💾 حفظ"}</button>
      </div>
    </div>
  );

  const entries=Object.entries(prods);
  return(
    <div className="sc">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:13}}>
        <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700}}>📦 المنتجات ({entries.length})</h2>
        <button className="btn btn-p btn-sm" onClick={openAdd}>+ إضافة</button>
      </div>
      {entries.length===0
        ?<div className="emp card"><div className="emp-i">📦</div><p className="emp-t">لا توجد منتجات</p></div>
        :entries.map(([code,p])=>{
          const d=daysUntil(p.expiry),low=p.stock<=sets.lowStock;
          return(
            <div key={code} className="prow">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",gap:5,alignItems:"center",flexWrap:"wrap",marginBottom:3}}>
                    <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{p.name}</p>
                    {d<0&&<span className="tag tr">منتهي</span>}
                    {d>=0&&d<=sets.expiryDays&&<span className="tag to">ينتهي قريباً</span>}
                    {low&&<span className="tag tr">مخزون منخفض</span>}
                  </div>
                  <p style={{color:"#484f58",fontSize:10}}>كود: {code}  ·  كمية: {p.stock}  ·  {fmtDate(p.expiry)}</p>
                </div>
                <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                  <p style={{color:"#3fb950",fontWeight:900,fontSize:13}}>{p.price.toFixed(2)} د.ل</p>
                  <div style={{display:"flex",gap:5}}>
                    <button className="btn btn-s btn-sm" onClick={()=>openEdit(code)}>✏️</button>
                    <button className="btn btn-d btn-sm" onClick={()=>del(code)}>🗑</button>
                  </div>
                </div>
              </div>
            </div>
          );
        })
      }
    </div>
  );
}

/* ══ Restock Tab ══ */
function RestockTab({prods,saveProds}){
  const [scan,setScan]=useState(false);
  const [form,setForm]=useState({code:"",name:"",price:"",stock:"",expiry:"",category:"غذائي"});
  const [isExist,setIsExist]=useState(false);
  const [done,setDone]=useState(false);
  const [doneStock,setDoneStock]=useState(0);
  const [err,setErr]=useState("");
  // بحث
  const [searchQ,setSearchQ]=useState("");
  const [searchSugg,setSearchSugg]=useState([]);

  const onCode=code=>{
    const t=code.trim();setDone(false);setErr("");setSearchQ("");setSearchSugg([]);
    const ex=prods[t];
    if(ex){setIsExist(true);setForm({code:t,name:ex.name,category:ex.category||"غذائي",price:ex.price,expiry:ex.expiry,stock:""});}
    else{setIsExist(false);setForm({code:t,name:"",price:"",expiry:"",stock:"",category:"غذائي"});}
  };

  const onSearchChange=v=>{
    setSearchQ(v);
    if(!v.trim()){setSearchSugg([]);return;}
    const q=v.trim().toLowerCase();
    const isDigits=/^\d+$/.test(q);
    const results=Object.entries(prods).filter(([code,p])=>{
      if(isDigits) return code.endsWith(q);
      return p.name.toLowerCase().includes(q);
    }).slice(0,8);
    setSearchSugg(results);
  };

  const save=()=>{
    if(!form.code.trim())return setErr("أدخل كود المنتج");
    if(!isExist&&!form.name.trim())return setErr("أدخل اسم المنتج");
    if(!form.price||isNaN(form.price))return setErr("أدخل السعر");
    if(!form.expiry)return setErr("أدخل تاريخ الصلاحية");
    if(!form.stock||isNaN(form.stock)||parseInt(form.stock)<=0)return setErr("أدخل الكمية");
    const upd={...prods};const addQty=parseInt(form.stock);
    const newStock=isExist?(upd[form.code].stock+addQty):addQty;
    if(isExist)upd[form.code]={...upd[form.code],price:parseFloat(form.price),expiry:form.expiry,stock:newStock};
    else upd[form.code.trim()]={name:form.name.trim(),price:parseFloat(form.price),stock:addQty,expiry:form.expiry,category:form.category};
    saveProds(upd);setDoneStock(newStock);setDone(true);setErr("");
    setTimeout(()=>{setForm({code:"",name:"",price:"",stock:"",expiry:"",category:"غذائي"});setIsExist(false);setDone(false);},2500);
  };

  return(
    <div className="sc">
      {scan&&<BarcodeScanner onScan={c=>{setScan(false);onCode(c);}} onClose={()=>setScan(false)}/>}
      <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700,marginBottom:13}}>➕ زيادة المخزون</h2>
      <div className="card">
        {/* البحث اليدوي */}
        <div style={{marginBottom:12}}>
          <p className="lbl">🔍 بحث بالاسم أو آخر 4 أرقام من الكود</p>
          <div style={{position:"relative"}}>
            <input
              className="inp"
              placeholder="اكتب اسم المنتج أو آخر 4 أرقام..."
              value={searchQ}
              onChange={e=>onSearchChange(e.target.value)}
            />
            {searchQ&&<button onClick={()=>{setSearchQ("");setSearchSugg([]);}} style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#7d8590",fontSize:16,cursor:"pointer"}}> ✕</button>}
            {searchSugg.length>0&&(
              <div style={{position:"absolute",top:"100%",right:0,left:0,zIndex:50,background:"rgba(22,27,34,0.99)",border:"1.5px solid rgba(35,134,54,0.4)",borderRadius:11,marginTop:4,maxHeight:200,overflowY:"auto",boxShadow:"0 8px 24px rgba(0,0,0,0.5)"}}>
                {searchSugg.map(([code,p])=>(
                  <div key={code} onClick={()=>onCode(code)}
                    style={{padding:"9px 13px",borderBottom:"1px solid rgba(48,54,61,0.4)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}
                    onMouseEnter={e=>e.currentTarget.style.background="rgba(35,134,54,0.12)"}
                    onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <div>
                      <p style={{color:"#e6edf3",fontWeight:700,fontSize:13,margin:0}}>{p.name}</p>
                      <p style={{color:"#484f58",fontSize:10,margin:0}}>كود: {code} · مخزون: {p.stock}</p>
                    </div>
                    <p style={{color:"#3fb950",fontWeight:900,fontSize:13,margin:0}}>{p.price.toFixed(2)} د.ل</p>
                  </div>

/* ══ Sales Tab ══ */
function SalesTab({sales, setSalesExt}){
  const [period,setPeriod]=useState("day");
  const [open,setOpen]=useState(null);
  const [selected,setSelected]=useState(new Set());
  const [selectMode,setSelectMode]=useState(false);
  const [confirmDel,setConfirmDel]=useState(null); // null | "one" | "selected" | "all"
  const [toDelete,setToDelete]=useState(null);

  const now=Date.now();
  const periods={
    day:  {label:"اليوم",     ms:86400000,     icon:"📅"},
    week: {label:"الأسبوع",   ms:86400000*7,   icon:"📆"},
    month:{label:"الشهر",     ms:86400000*30,  icon:"🗓️"},
    year: {label:"السنة",     ms:86400000*365, icon:"📊"},
  };

  const filtered=sales.filter(s=>now-s.ts<periods[period].ms);
  const grand=filtered.reduce((s,x)=>s+x.total,0);
  const totalItems=filtered.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0);

  // حذف فواتير
  const doDelete=(ids)=>{
    const idSet=new Set(ids);
    const updated=sales.filter(s=>!idSet.has(s.id));
    setSalesExt(updated);
    setSelected(new Set());
    setSelectMode(false);
    setConfirmDel(null);
    setOpen(null);
  };

  const toggleSelect=(id)=>{
    setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  };
  const selectAll=()=>setSelected(new Set(filtered.map(s=>s.id)));
  const clearSelect=()=>{setSelected(new Set());setSelectMode(false);};

  return(
    <div className="sc">
      {/* تأكيد الحذف */}
      {confirmDel&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.85)",zIndex:200,
          display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
          <div style={{background:"rgba(22,27,34,0.98)",border:"1px solid rgba(218,54,51,0.4)",
            borderRadius:16,padding:"24px 20px",maxWidth:340,width:"100%",textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:12}}>🗑️</div>
            <p style={{color:"#e6edf3",fontWeight:700,fontSize:15,marginBottom:8}}>
              {confirmDel==="one"?"هل تريد مسح هذه الفاتورة؟":
               confirmDel==="selected"?`هل تريد مسح ${selected.size} فاتورة؟`:
               `هل تريد مسح جميع الفواتير (${filtered.length})؟`}
            </p>
            <p style={{color:"#7d8590",fontSize:12,marginBottom:20}}>لا يمكن التراجع عن هذا الإجراء</p>
            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>{setConfirmDel(null);setToDelete(null);}}
                className="btn btn-s" style={{flex:1,padding:"11px"}}>❌ لا</button>
              <button onClick={()=>{
                if(confirmDel==="one")doDelete([toDelete]);
                else if(confirmDel==="selected")doDelete([...selected]);
                else doDelete(filtered.map(s=>s.id));
              }} className="btn btn-d" style={{flex:1,padding:"11px",fontWeight:700}}>✅ نعم، مسح</button>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:13}}>
        <h2 style={{color:"#e6edf3",fontSize:15,fontWeight:700}}>🧾 سجل المبيعات</h2>
        {filtered.length>0&&(
          <div style={{display:"flex",gap:6}}>
            {!selectMode
              ?<button onClick={()=>setSelectMode(true)} className="btn btn-s btn-sm">تحديد</button>
              :<>
                <button onClick={selectAll} className="btn btn-s btn-sm">تحديد الكل</button>
                <button onClick={clearSelect} className="btn btn-s btn-sm">إلغاء</button>
                {selected.size>0&&<button onClick={()=>setConfirmDel("selected")}
                  className="btn btn-d btn-sm">🗑 ({selected.size})</button>}
              </>
            }
            {filtered.length>0&&<button onClick={()=>setConfirmDel("all")}
              className="btn btn-d btn-sm">مسح الكل</button>}
          </div>
        )}
      </div>

      {/* أزرار الفترات */}
      <div style={{display:"flex",gap:6,marginBottom:13,overflowX:"auto",paddingBottom:4}}>
        {Object.entries(periods).map(([key,p])=>(
          <button key={key} onClick={()=>{setPeriod(key);setOpen(null);setSelected(new Set());setSelectMode(false);}}
            style={{flexShrink:0,background:period===key?"linear-gradient(135deg,#238636,#2ea043)":"rgba(255,255,255,0.06)",
              border:period===key?"none":"1px solid rgba(255,255,255,0.09)",borderRadius:20,padding:"7px 14px",
              color:period===key?"#fff":"#7d8590",fontFamily:"'Cairo',sans-serif",fontSize:12,fontWeight:700,cursor:"pointer"}}>
            {p.icon} {p.label}
          </button>
        ))}
      </div>

      {/* ملخص */}
      {filtered.length>0&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:13}}>
          {[
            {label:"الفواتير",value:filtered.length,unit:"فاتورة",color:"#3fb950"},
            {label:"المنتجات",value:totalItems,unit:"قطعة",color:"#60a5fa"},
            {label:"الإجمالي",value:grand.toFixed(2),unit:"د.ل",color:"#f0883e"},
          ].map(({label,value,unit,color})=>(
            <div key={label} style={{background:"rgba(22,27,34,0.9)",border:"1px solid rgba(48,54,61,0.7)",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
              <p style={{color,fontWeight:900,fontSize:18}}>{value}</p>
              <p style={{color:"#484f58",fontSize:10}}>{unit}</p>
              <p style={{color:"#7d8590",fontSize:10,marginTop:2}}>{label}</p>
            </div>
          ))}
        </div>
      )}

      {/* قائمة الفواتير */}
      {filtered.length===0
        ?<div className="emp card"><div className="emp-i">🧾</div><p className="emp-t">لا توجد مبيعات في {periods[period].label}</p></div>
        :filtered.map(sale=>(
          <div key={sale.id} style={{position:"relative",marginBottom:9}}>
            {/* checkbox للتحديد */}
            {selectMode&&(
              <div onClick={()=>toggleSelect(sale.id)}
                style={{position:"absolute",top:11,right:10,zIndex:10,width:22,height:22,
                  borderRadius:6,border:`2px solid ${selected.has(sale.id)?"#2ea043":"rgba(255,255,255,0.3)"}`,
                  background:selected.has(sale.id)?"#2ea043":"transparent",
                  display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
                {selected.has(sale.id)&&<span style={{color:"#fff",fontSize:13,fontWeight:700}}>✓</span>}
              </div>
            )}
            <div className="inv-card"
              style={{marginBottom:0,paddingRight:selectMode?"36px":0}}
              onClick={()=>!selectMode&&setOpen(open===sale.id?null:sale.id)}>
              <div className="inv-head">
                <div>
                  <p style={{color:"#e6edf3",fontWeight:700,fontSize:13}}>{sale.id}</p>
                  <p style={{color:"#7d8590",fontSize:10,marginTop:2}}>🕐 {fmtTime(sale.ts)}</p>
                </div>
                <div style={{textAlign:"center",display:"flex",alignItems:"center",gap:8}}>
                  <div>
                    <p style={{color:"#3fb950",fontWeight:900,fontSize:15}}>{sale.total.toFixed(2)} د.ل</p>
                    <p style={{color:"#484f58",fontSize:10}}>{sale.items.length} صنف {open===sale.id?"▲":"▼"}</p>
                  </div>
                  {!selectMode&&(
                    <button onClick={e=>{e.stopPropagation();setToDelete(sale.id);setConfirmDel("one");}}
                      style={{background:"rgba(218,54,51,0.15)",border:"1px solid rgba(218,54,51,0.3)",
                        borderRadius:7,padding:"4px 8px",color:"#f85149",cursor:"pointer",fontSize:14}}>
                      🗑
                    </button>
                  )}
                </div>
              </div>
              {open===sale.id&&(
                <div className="inv-body">
                  <div style={{height:1,background:"rgba(48,54,61,0.45)",margin:"0 0 8px"}}/>
                  {sale.items.map((it,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid rgba(48,54,61,0.3)",fontSize:12}}>
                      <div>
                        <p style={{color:"#e6edf3",fontWeight:600}}>{it.name}</p>
                        <p style={{color:"#484f58",fontSize:10}}>كود: {it.code}  ·  {it.qty}×{it.price.toFixed(2)}</p>
                      </div>
                      <p style={{color:"#3fb950",fontWeight:700}}>{it.total.toFixed(2)} د.ل</p>
                    </div>
                  ))}
                  <div style={{display:"flex",justifyContent:"space-between",marginTop:9,fontSize:13,fontWeight:700}}>
                    <span style={{color:"#7d8590"}}>المجموع</span>
                    <span style={{color:"#3fb950"}}>{sale.total.toFixed(2)} د.ل</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        ))
      }
    </div>
  );
}

/* ══════════════════════════════════════════
   ROOT APP
══════════════════════════════════════════ */
function App(){
  const [user,setUser]=useState(null);
  const [booting,setBooting]=useState(true);
  const [tab,setTab]=useState("pos");
  const [prods,setProds]=useState({});
  const [sets,setSets]=useState(INIT_SETS);
  const [notifs,setNotifs]=useState([]);
  const [unread,setUnread]=useState(0);
  const [sales,setSales]=useState([]);

  useEffect(()=>{
    injectCSS();

    // ── تحميل مكتبات المسح ──
    function loadScript(src){
      if(!document.querySelector(`script[src="${src}"]`)){
        const s=document.createElement("script");s.src=src;document.head.appendChild(s);
      }
    }
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js");
    loadScript("https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js");

    // ── استعادة الجلسة فوراً من localStorage ──
    const sess=sg("session:user");
    if(sess&&sess.phone){
      const ph=sess.phone;
      _activePhone=ph; // عيّن الـ phone أولاً قبل أي قراءة
      const lUsers=sg("admin:users")||{};
      const u=lUsers[ph];
      if(u&&u.subscribed&&(!u.subExpiry||daysUntil(u.subExpiry)>=0)){
        setActivePhone(ph);
        setUser({...sess,subExpiry:u.subExpiry});
        // قراءة بيانات هذا البائع تحديداً
        const lp=sg(_lk("products:all",ph));if(lp)setProds(lp);
        const ls=sg(_lk("settings:app",ph));if(ls)setSets(ls);
        const ln=sg(_lk("notifs:list",ph));if(ln){setNotifs(ln);setUnread(ln.filter(x=>!x.read).length);}
        const lr=sg(_lk("sales:list",ph));
        if(lr){const now=Date.now();setSales(lr.filter(x=>now-x.ts<86400000*366));}
      } else {
        _activePhone=""; // مسح إذا انتهى الاشتراك
      }
    }
    setBooting(false);

    // ── مزامنة Firebase في الخلفية بعد التحميل ──
    setTimeout(async()=>{
      if(!_db||!_activePhone)return;
      try{
        const users=await getUsers();
        const u=users[_activePhone];
        if(u&&u.subscribed){
          const p=await usg("products:all");if(p)setProds(p);
          const s=await usg("settings:app");if(s)setSets(s);
          const n=await usg("notifs:list");if(n){setNotifs(n);setUnread(n.filter(x=>!x.read).length);}
          const raw=await usg("sales:list");
          if(raw){const now=Date.now();setSales(raw.filter(x=>now-x.ts<86400000*366));}
        }
      }catch(e){console.warn("BG sync:",e);}

      // ── مزامنة فورية Real-time ──
      try{
        const base=_db.collection("sellers").doc(_activePhone).collection("data");
        const ph=_activePhone;
        base.doc("products:all").onSnapshot(snap=>{if(snap.exists&&ph===_activePhone){const v=snap.data().v;if(v){setProds(v);ss(_lk("products:all",ph),v);}}});
        base.doc("sales:list").onSnapshot(snap=>{if(snap.exists&&ph===_activePhone){const v=snap.data().v;if(v){const now=Date.now();const f=v.filter(x=>now-x.ts<86400000*366);setSales(f);ss(_lk("sales:list",ph),f);}}});
        base.doc("settings:app").onSnapshot(snap=>{if(snap.exists&&ph===_activePhone){const v=snap.data().v;if(v){setSets(v);ss(_lk("settings:app",ph),v);}}});
        console.log("✅ Real-time sync active");
      }catch(e){console.warn("RT sync:",e);}
    },1500);
  },[]);

  useEffect(()=>{
    if(!Object.keys(prods).length)return;
    const newN=[];
    Object.entries(prods).forEach(([code,p])=>{
      const d=daysUntil(p.expiry);
      if(d>=0&&d<=sets.expiryDays)newN.push({id:`exp-${code}`,type:"expiry",icon:"⏰",title:"صلاحية قاربت على الانتهاء",body:`${p.name} — ينتهي خلال ${d} يوم`,read:false,ts:Date.now()});
      if(d<0)newN.push({id:`xp-${code}`,type:"expired",icon:"❌",title:"منتج منتهي الصلاحية",body:`${p.name}`,read:false,ts:Date.now()});
      if(p.stock>0&&p.stock<=sets.lowStock)newN.push({id:`stk-${code}`,type:"stock",icon:"📦",title:"مخزون منخفض",body:`${p.name} — تبقى ${p.stock} وحدة`,read:false,ts:Date.now()});
      if(p.stock===0)newN.push({id:`out-${code}`,type:"stockout",icon:"🚫",title:"نفذ المخزون",body:`${p.name}`,read:false,ts:Date.now()});
    });
    setNotifs(prev=>{
      const exist=new Set(prev.map(n=>n.id));
      const merged=[...newN.filter(n=>!exist.has(n.id)),...prev];
      setUnread(merged.filter(n=>!n.read).length);
      uss("notifs:list",merged);
      return merged;
    });
  },[prods,sets]);

  const saveProds=p=>{setProds(p);uss("products:all",p);};
  const saveSets=s=>{setSets(s);uss("settings:app",s);};
  const addSale=sale=>setSales(prev=>{
    const u=[sale,...prev].filter(x=>Date.now()-x.ts<86400000*366);
    uss("sales:list",u);return u;
  });
  const markRead=()=>{setNotifs(prev=>{const n=prev.map(x=>({...x,read:true}));uss("notifs:list",n);return n;});setUnread(0);};
  const logout=()=>{ss("session:user",null);_activePhone="";setActivePhone("");setUser(null);setTab("pos");setProds({});setSales([]);setSets(INIT_SETS);setNotifs([]);setUnread(0);};

  if(booting)return(
    <div style={{minHeight:"100vh",background:"#0d1117",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:10}}>
      <div style={{fontSize:48}}>🏪</div>
      <p style={{color:"#7d8590",fontSize:14,fontFamily:"'Cairo',sans-serif"}}>جاري التحميل...</p>
    </div>
  );
  if(!user)return <LoginScreen onLogin={(ud,ph)=>{if(ph){_activePhone=ph;const lp=sg(_lk('products:all',ph));setProds(lp||{});const ls=sg(_lk('settings:app',ph));if(ls)setSets(ls);const ln=sg(_lk('notifs:list',ph));if(ln){setNotifs(ln);setUnread(ln.filter(x=>!x.read).length);}const lr=sg(_lk('sales:list',ph));if(lr){const now=Date.now();setSales(lr.filter(x=>now-x.ts<86400000*366));}else setSales([]);}else{setProds({});setSales([]);setSets(INIT_SETS);}setUser(ud);}}/>;

  const TABS=[
    {id:"pos",icon:"🛒",label:"البيع"},
    {id:"products",icon:"📦",label:"المنتجات"},
    {id:"restock",icon:"➕",label:"المخزون"},
    {id:"sales",icon:"🧾",label:"المبيعات"},
    {id:"notifs",icon:"🔔",label:"الإشعارات"},
    {id:"settings",icon:"⚙️",label:"الإعدادات"},
  ];

  return(
    <div className="app">
      <div className="tb">
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <div className="tb-ico">🏪</div>
          <div>
            <div style={{fontSize:19,fontWeight:900,color:"#fff",lineHeight:1}}>بيّاع</div>
            <div style={{fontSize:10,color:"#7d8590"}}>{user.name}</div>
          </div>
        </div>
        <div className="tb-nav">
          {TABS.map(t=>(
            <button key={t.id} title={t.label} className={`nb${tab===t.id?" on":""}`} onClick={()=>{if(t.id==="notifs")markRead();setTab(t.id);}}>{t.icon}
              {t.id==="notifs"&&unread>0&&<span className="nb-bd">{unread}</span>}
            </button>
          ))}
          <button className="nb nb-out" onClick={logout}>خروج</button>
        </div>
      </div>
      {tab==="pos"&&<POSTab prods={prods} saveProds={saveProds} sets={sets} addSale={addSale}/>}
      {tab==="products"&&<ProductsTab prods={prods} saveProds={saveProds} sets={sets}/>}
      {tab==="restock"&&<RestockTab prods={prods} saveProds={saveProds}/>}
      {tab==="sales"&&<SalesTab sales={sales} setSalesExt={s=>{setSales(s);uss("sales:list",s);}}/>}
      {tab==="notifs"&&<NotifsTab notifs={notifs}/>}
      {tab==="settings"&&<SettingsTab sets={sets} saveSets={saveSets} user={user} onLogout={logout}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<!-- Service Worker — inline blob for GitHub Pages compatibility -->
<script>
if("serviceWorker" in navigator){
  const swCode = `
const CACHE = 'bayyaa-v3';
const ASSETS = [
  'https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap',
  'https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js',
];
self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => c.addAll(ASSETS).catch(()=>{})).then(() => self.skipWaiting())
  );
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
});
self.addEventListener('fetch', e => {
  if(e.request.method !== 'GET') return;
  e.respondWith(
    caches.match(e.request).then(cached => {
      if(cached) return cached;
      return fetch(e.request).then(resp => {
        if(resp && resp.status === 200 && resp.type !== 'opaque'){
          const clone = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone));
        }
        return resp;
      }).catch(() => cached);
    })
  );
});
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  window.addEventListener('load', () => {
    navigator.serviceWorker.register(swUrl, {scope: './'})
      .then(r => console.log('SW registered (blob):', r.scope))
      .catch(e => console.warn('SW failed:', e));
  });
}
</script>
